function ensurePartQualityData(part){
  if(!part) return;
  if(!Array.isArray(part.qualityEvents)) part.qualityEvents=[];
  if(!Array.isArray(part.productionIssues)) part.productionIssues=[];
  if(!Array.isArray(part.dismissedNcrSuggestions)) part.dismissedNcrSuggestions=[];
  if(!part.processProfile || typeof part.processProfile!=='object') part.processProfile={};
  if(!Array.isArray(part.ncrs)) part.ncrs=[];
}
function qualityFlowTotals(part){
  ensurePartQualityData(part);
  const t={quarantine:0,rework:0,qualityScrap:0,surplusStock:0,surplusScrap:0,surplusShip:0,surplusHold:0,customerComplaint:0};
  (part.qualityEvents||[]).forEach(e=>{
    const q=Math.max(0,Number(e.qty)||0);
    if(e.type==='quarantine') t.quarantine+=q;
    if(e.type==='quarantine_release') t.quarantine=Math.max(0,t.quarantine-q);
    if(e.type==='rework') t.rework+=q;
    if(e.type==='rework_complete') t.rework=Math.max(0,t.rework-q);
    if(e.type==='quality_scrap') t.qualityScrap+=q;
    if(e.type==='surplus_stock') t.surplusStock+=q;
    if(e.type==='surplus_scrap') t.surplusScrap+=q;
    if(e.type==='surplus_ship') t.surplusShip+=q;
    if(e.type==='surplus_hold') t.surplusHold+=q;
    if(e.type==='customer_complaint') t.customerComplaint+=q;
  });
  t.surplusTotal=t.surplusStock+t.surplusScrap+t.surplusShip+t.surplusHold;
  return t;
}
function collectQualityFlowTotals(){
  const t={quarantine:0,rework:0,qualityScrap:0,surplusStock:0,surplusScrap:0,surplusShip:0,surplusHold:0,surplusTotal:0,customerComplaint:0};
  visibleCompanies().forEach(c=>getParts(c.id).forEach(p=>{
    const x=qualityFlowTotals(p); Object.keys(t).forEach(k=>t[k]+=Number(x[k]||0));
  }));
  return t;
}
function ncrExistsForSource(part, sourceKey){
  return !!(part.ncrs||[]).find(n=>n.sourceKey===sourceKey);
}
function createNcrObject(part, data){
  ensurePartQualityData(part);
  const ncr={
    id:uid('ncr'), date:todayStr(), stage:data.stage||'Kalite Kontrol',
    recordType:data.recordType||'Kalite Uygunsuzluğu',
    category:data.category||'Diğer',
    description:data.description||'',
    rootCause:data.rootCause||'',
    correctiveAction:data.correctiveAction||'',
    disposition:data.disposition||'Karantina',
    qty:Math.max(0,Number(data.qty)||0),
    status:'acik', user:data.user||state.currentUser,
    source:data.source||'manual', sourceKey:data.sourceKey||null,
    autoCreated:!!data.autoCreated
  };
  part.ncrs.push(ncr);
  return ncr;
}
function ensureAutomaticMeasurementNcrs(part){
  ensurePartQualityData(part);
  let created=0;
  (part.measurements||[]).forEach(m=>{
    if(measurementStatus(m)!=='fail') return;
    const key='measurement:'+m.id;
    if(ncrExistsForSource(part,key)) return;
    const measured=parseDecimal(m.measuredValue), nominal=parseDecimal(m.nominalValue), tol=Math.abs(parseDecimal(m.tolerance));
    const diff=measured-nominal;
    createNcrObject(part,{
      stage:'Kalite Kontrol', category:'Ölçü tolerans dışı', disposition:'Karantina', qty:1,
      description:`Ölçüm #${m.no}: nominal ${decimalDisplay(nominal)} ±${decimalDisplay(tol)}, ölçülen ${decimalDisplay(measured)}. Sapma ${diff>=0?'+':''}${decimalDisplay(Number(diff.toFixed(4)))}.`,
      source:'measurement',sourceKey:key,autoCreated:true
    });
    created++;
  });
  return created;
}
function processProfile(part){
  ensurePartQualityData(part);
  return Object.assign({material:'',thickness:'',width:'',length:'',holeCount:0,bendCount:0,weldLengthMm:0,complexity:'normal',toleranceClass:'normal'},part.processProfile||{});
}
function estimateStageDays(part, stage){
  const p=processProfile(part);
  const qty=Math.max(1,Number(part.orderedQty)||1);
  const th=Math.max(.5,Number(p.thickness)||1.5);
  const w=Math.max(50,Number(p.width)||300), l=Math.max(50,Number(p.length)||300);
  const areaM2=(w*l)/1e6;
  const holes=Math.max(0,Number(p.holeCount)||0), bends=Math.max(0,Number(p.bendCount)||0), weldM=Math.max(0,Number(p.weldLengthMm)||0)/1000;
  const cf=p.complexity==='high'?1.45:p.complexity==='low'?.82:1;
  const tf=p.toleranceClass==='precision'?1.35:p.toleranceClass==='rough'?.9:1;
  let hours=0;
  switch(stage){
    case 'Kesim': hours=.35 + qty*(.006 + areaM2*.010 + holes*.0015 + th*.0015); break;
    case 'CNC': hours=.55 + qty*(.012 + holes*.0035 + areaM2*.004)*tf; break;
    case 'Torna': hours=.65 + qty*(.018 + th*.0015)*tf; break;
    case 'Büküm': hours=.35 + qty*Math.max(1,bends)*.009*cf; break;
    case 'Kaynak': hours=.45 + qty*(Math.max(.12,weldM)*.11 + .006)*cf; break;
    case 'Taşlama': hours=.25 + qty*(Math.max(.10,weldM)*.055 + .004)*cf; break;
    case 'Boya': hours=1.6 + qty*(.006+areaM2*.018); break;
    case 'Kaplama': hours=2.0 + qty*(.005+areaM2*.014); break;
    case 'Montaj': hours=.35 + qty*(.012 + (holes+bends)*.0015)*cf; break;
    case 'Paketleme': hours=.20 + qty*(.004 + areaM2*.003); break;
    case 'Sevkiyat': hours=2.0; break;
    default: hours=.35 + qty*.01*cf;
  }
  // Fabrika içi kuyruk/aktarım payı: aktif işleme süresinden daha gerçekçi proses hedefi üretir.
  const workingDays=(hours/8)*1.35;
  return Math.max(.25,Math.min(30,workingDays));
}
function currentStageEstimateStatus(part, company){
  const idx=getCurrentStageIndex(part,company.stages);
  if(idx<0) return null;
  const stage=company.stages[idx], entry=getStageLastEntry(part,stage);
  const actual=entry?daysSince(entry.date):0, expected=estimateStageDays(part,stage);
  const ratio=expected>0?actual/expected:0;
  return {stage,actual,expected,ratio,cls:ratio>1.5?'bad':ratio>1.1?'warn':'good'};
}
function ncrSuggestionsForPart(part, company){
  ensurePartQualityData(part);
  const dismissed=new Set(part.dismissedNcrSuggestions||[]);
  const out=[];
  const ordered=Math.max(1,Number(part.orderedQty)||1);
  company.stages.forEach(stage=>{
    const rej=Math.max(0,Number((part.rejects||{})[stage]||0));
    if(!rej) return;
    const pct=rej/ordered*100, key='reject:'+stage;
    const threshold=Math.max(.1,Number(state.errorTracking?.ncrRejectThresholdPct)||QUALITY_REJECT_SUGGEST_PCT);
    if(pct>=threshold && !dismissed.has(key) && !ncrExistsForSource(part,key)){
      out.push({key,critical:pct>=8,title:`${stage} prosesinde yüksek ret oranı`,desc:`${fmtNum(rej)} ret / ${fmtNum(part.orderedQty)} sipariş = %${pct.toLocaleString('tr-TR',{maximumFractionDigits:1})}. NCR değerlendirmesi önerilir.`,stage,category:'Diğer',disposition:'Karantina',qty:rej});
    }
  });
  (part.returnEvents||[]).forEach(r=>{
    const key='return:'+r.id;
    if(dismissed.has(key)||ncrExistsForSource(part,key)) return;
    out.push({key,critical:false,title:'Proses geri dönüşü tespit edildi',desc:`${r.fromStage} → ${r.toStage} · ${fmtNum(r.qty)} adet. Geri dönüş kalite kaynaklıysa NCR açın; planlama kaynaklıysa sadece proses geri dönüşü olarak bırakın.`,stage:r.toStage,category:'Diğer',disposition:'Yeniden İşleme',qty:r.qty});
  });
  (part.productionIssues||[]).forEach(i=>{
    if(i.status==='kapali'||i.type!=='Kalite problemi') return;
    const key='issue:'+i.id;
    if(dismissed.has(key)||ncrExistsForSource(part,key)) return;
    out.push({key,critical:true,title:'Kalite kaynaklı üretim problemi',desc:i.description||`${i.stage} prosesinde kalite problemi kaydedildi.`,stage:i.stage,category:'Diğer',disposition:'Karantina',qty:i.qty||0});
  });
  const cur=currentStageEstimateStatus(part,company);
  if(cur && cur.actual>=1 && cur.ratio>1.5){
    const key='delay:'+cur.stage+':'+inferPartMonth(part);
    if(!dismissed.has(key)){
      out.push({key,productionOnly:true,critical:false,title:`${cur.stage} prosesinde gecikme`,desc:`Beklenen yaklaşık ${cur.expected.toLocaleString('tr-TR',{maximumFractionDigits:1})} gün; şu an ${cur.actual} gün. Bu kalite uygunsuzluğu değil, üretim problemi olarak değerlendirilmelidir.`,stage:cur.stage});
    }
  }
  return out;
}

function measurementStatus(m){
  const measured = m.measuredValue!==''&&m.measuredValue!=null ? parseDecimal(m.measuredValue) : null;
  const nominal = m.nominalValue!==''&&m.nominalValue!=null ? parseDecimal(m.nominalValue) : null;
  const tol = m.tolerance!==''&&m.tolerance!=null ? Math.abs(parseDecimal(m.tolerance)) : null;
  if(measured===null || nominal===null || tol===null || isNaN(measured) || isNaN(nominal) || isNaN(tol)) return 'pending';
  return Math.abs(measured-nominal) <= tol ? 'ok' : 'fail';
}
function decimalDisplay(v){
  if(v==='' || v==null || Number.isNaN(v)) return '';
  return String(v).replace('.',',');
}

async function renderPdfMeasurementSurface(){
  const canvas = document.getElementById('measureDrawingSurface');
  if(!canvas || canvas.tagName!=='CANVAS' || !canvas.dataset.pdfMeasure) return;
  const company = getCompany(state.selectedCompanyId);
  const part = company ? getParts(company.id).find(p=>p.id===state.selectedPartId) : null;
  const drawingIndex = Number(canvas.dataset.drawingIndex);
  const drawing = part && part.drawings ? part.drawings[drawingIndex] : null;
  if(!drawing || !drawing.data) return;
  if(!window.pdfjsLib){
    const ctx=canvas.getContext('2d'); canvas.width=760; canvas.height=440;
    ctx.fillStyle='#101A2E'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#FF8089'; ctx.font='16px Inter, sans-serif'; ctx.fillText('PDF görüntüleyici yüklenemedi.',24,40);
    return;
  }
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const raw = new Uint8Array(await dataURLtoBlob(drawing.data).arrayBuffer());
    const pdf = await pdfjsLib.getDocument({data:raw}).promise;
    const page = await pdf.getPage(1);
    const baseViewport = page.getViewport({scale:1});
    const zoom = Math.min(3,Math.max(.75,Number(state.measureImageZoom)||1));
    const targetHeight = 440*zoom;
    const scale = targetHeight/baseViewport.height;
    const viewport = page.getViewport({scale});
    const dpr = Math.max(1,window.devicePixelRatio||1);
    canvas.width=Math.floor(viewport.width*dpr); canvas.height=Math.floor(viewport.height*dpr);
    canvas.style.width=Math.floor(viewport.width)+'px'; canvas.style.height=Math.floor(viewport.height)+'px';
    const ctx=canvas.getContext('2d');
    await page.render({canvasContext:ctx,viewport,transform:dpr===1?null:[dpr,0,0,dpr,0,0]}).promise;
  }catch(err){
    console.error('PDF ölçüm çizimi hatası',err);
    const ctx=canvas.getContext('2d'); canvas.width=760; canvas.height=440; canvas.style.width='760px';canvas.style.height='440px';
    ctx.fillStyle='#101A2E';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#FF8089';ctx.font='16px Inter, sans-serif';ctx.fillText('PDF teknik resim görüntülenemedi.',24,40);
  }
}

function parseTRDateTime(str){
  if(!str) return null;
  const raw = String(str).trim();
  const [datePart,timePart='00:00'] = raw.split(/\s+/);
  const bits = datePart.split('.').map(Number);
  if(bits.length<3 || bits.some(isNaN)) return null;
  const tb = timePart.split(':').map(Number);
  const d = new Date(bits[2],bits[1]-1,bits[0],tb[0]||0,tb[1]||0,tb[2]||0);
  return isNaN(d.getTime()) ? null : d;
}
function allKnownMonths(companies){
  const set = new Set();
  (companies||[]).forEach(c=>ensureCompanyMonths(c,getParts(c.id)).forEach(m=>set.add(m)));
  if(!set.size) set.add(currentMonthKey());
  return Array.from(set).sort();
}
function previousMonthKey(key){
  if(!/^\d{4}-\d{2}$/.test(key||'')) return null;
  const [y,m]=key.split('-').map(Number); const d=new Date(y,m-2,1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function collectReturnEvents(monthKey){
  const out=[];
  visibleCompanies().forEach(c=>getParts(c.id).forEach(p=>{
    if(monthKey && inferPartMonth(p)!==monthKey) return;
    (p.returnEvents||[]).forEach(r=>out.push({...r,company:c,part:p}));
  }));
  return out.sort((a,b)=>(parseTRDateTime(b.date)||0)-(parseTRDateTime(a.date)||0));
}
function collectStageDurationStats(monthKey, companyId){
  const map={};
  const companies = companyId ? visibleCompanies().filter(c=>c.id===companyId) : visibleCompanies();
  companies.forEach(c=>{
    c.stages.forEach(stage=>{ if(!map[stage]) map[stage]={stage,totalDays:0,count:0,maxDays:0,active:0}; });
    const parts = monthKey ? getMonthParts(c.id,monthKey) : getParts(c.id);
    parts.forEach(p=>{
      const events=(p.history||[]).filter(h=>!h.reject && Number(h.qty)>0 && c.stages.includes(h.stage) && parseTRDateTime(h.date));
      if(!events.length) return;
      const blocks=[];
      events.forEach(e=>{
        const last=blocks[blocks.length-1];
        if(!last || last.stage!==e.stage) blocks.push({stage:e.stage,start:parseTRDateTime(e.date)});
      });
      for(let i=0;i<blocks.length;i++){
        const b=blocks[i];
        let end = i<blocks.length-1 ? blocks[i+1].start : null;
        const isCurrent = i===blocks.length-1 && partStatus(p,c.stages)!=='shipped';
        if(isCurrent){ end=new Date(); map[b.stage].active++; }
        if(!end) continue;
        const days=Math.max(0,(end-b.start)/(1000*60*60*24));
        if(!Number.isFinite(days)) continue;
        map[b.stage].totalDays+=days; map[b.stage].count++; map[b.stage].maxDays=Math.max(map[b.stage].maxDays,days);
      }
    });
  });
  return Object.values(map).filter(x=>x.count>0||x.active>0).map(x=>{
    const avg=x.count?x.totalDays/x.count:0;
    let health='Mükemmel', healthClass='excellent';
    if(avg>7){health='Kritik',healthClass='critical';}
    else if(avg>3){health='Dikkat',healthClass='watch';}
    else if(avg>1){health='İyi',healthClass='good';}
    return {...x,avg,health,healthClass};
  }).sort((a,b)=>b.avg-a.avg);
}
function companyMonthSeries(companyId){
  const c=getCompany(companyId); if(!c) return [];
  const months=ensureCompanyMonths(c,getParts(companyId)).slice().sort();
  return months.map(m=>({month:m,...companyTotals(companyId,m)}));
}
function renderCompanyMonthlyInsights(company, monthKey){
  const current=companyTotals(company.id,monthKey);
  const prevKey=previousMonthKey(monthKey);
  const prev=companyTotals(company.id,prevKey);
  const prevHasData=!!(prevKey && getMonthParts(company.id,prevKey).length);
  const shipRate=current.ordered>0?current.shipped/current.ordered*100:0;
  const prevShipRate=prev.ordered>0?prev.shipped/prev.ordered*100:0;
  const rejectRate=current.ordered>0?current.rejected/current.ordered*100:0;
  const prevRejectRate=prev.ordered>0?prev.rejected/prev.ordered*100:0;
  const orderD=monthDelta(current.ordered,prev.ordered);
  const partD=monthDelta(current.partCount,prev.partCount);
  const shipD=shipRate-prevShipRate;
  const rejD=rejectRate-prevRejectRate;
  const sentence=prevHasData ? [
    `Sipariş adedi geçen aya göre ${orderD.diff>0?fmtNum(Math.abs(orderD.diff))+' arttı':orderD.diff<0?fmtNum(Math.abs(orderD.diff))+' azaldı':'değişmedi'}.`,
    `Parça kayıt sayısı ${partD.diff>0?fmtNum(Math.abs(partD.diff))+' arttı':partD.diff<0?fmtNum(Math.abs(partD.diff))+' azaldı':'değişmedi'}.`,
    `Sevk oranı ${shipD>0?shipD.toLocaleString('tr-TR',{maximumFractionDigits:1})+' puan yükseldi':shipD<0?Math.abs(shipD).toLocaleString('tr-TR',{maximumFractionDigits:1})+' puan düştü':'değişmedi'}.`,
    `Ret oranı ${rejD>0?rejD.toLocaleString('tr-TR',{maximumFractionDigits:2})+' puan yükseldi':rejD<0?Math.abs(rejD).toLocaleString('tr-TR',{maximumFractionDigits:2})+' puan düştü':'değişmedi'}.`
  ].join(' ') : `${monthLabel(prevKey)} için sipariş kaydı bulunmadığından önceki aya göre değişim yüzdesi hesaplanmadı.`;
  const noPrev='<span class="metric-delta flat">Önceki ay verisi yok</span>';
  return `<div class="kpi-grid" style="margin-bottom:14px;">
    <div class="kpi-card"><div class="kpi-label">Sipariş · ${escapeHtml(monthShortLabel(monthKey))}</div><div class="kpi-value">${fmtNum(current.ordered)}</div><div style="margin-top:7px;">${prevHasData?deltaHtml(current.ordered,prev.ordered,false):noPrev}</div></div>
    <div class="kpi-card"><div class="kpi-label">Parça Kaydı</div><div class="kpi-value">${fmtNum(current.partCount)}</div><div style="margin-top:7px;">${prevHasData?deltaHtml(current.partCount,prev.partCount,false):noPrev}</div></div>
    <div class="kpi-card"><div class="kpi-label">Sevk Oranı</div><div class="kpi-value">%${shipRate.toLocaleString('tr-TR',{maximumFractionDigits:1})}</div><div style="margin-top:7px;">${prevHasData?`<span class="metric-delta ${shipD>0?'up':shipD<0?'down':'flat'}">${shipD>0?'▲':shipD<0?'▼':'•'} ${shipD>0?'+':''}${shipD.toLocaleString('tr-TR',{maximumFractionDigits:1})} puan</span>`:noPrev}</div></div>
    <div class="kpi-card"><div class="kpi-label">Ret Oranı</div><div class="kpi-value">%${rejectRate.toLocaleString('tr-TR',{maximumFractionDigits:2})}</div><div style="margin-top:7px;">${prevHasData?`<span class="metric-delta ${rejD<0?'up':rejD>0?'down':'flat'}">${rejD>0?'▲':rejD<0?'▼':'•'} ${rejD>0?'+':''}${rejD.toLocaleString('tr-TR',{maximumFractionDigits:2})} puan</span>`:noPrev}</div></div>
  </div><div class="analytics-note">${escapeHtml(sentence)}</div>`;
}

function renderLineChartSVG(data){
  if(!data.length) return '<div class="helper-text">Veri yok.</div>';
  const W=560,H=180,padL=34,padR=14,padT=14,padB=28;
  const max = Math.max(1, ...data.map(d=>d.value));
  const stepX = data.length>1 ? (W-padL-padR)/(data.length-1) : 0;
  const pts = data.map((d,i)=>{
    const x = padL + i*stepX;
    const y = padT + (1 - d.value/max) * (H-padT-padB);
    return {x,y,...d};
  });
  const pathD = pts.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L${pts[pts.length-1].x.toFixed(1)},${H-padB} L${pts[0].x.toFixed(1)},${H-padB} Z`;
  return `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
    <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#2A3A5C" stroke-width="1"/>
    <path d="${areaD}" fill="rgba(226,58,76,0.12)" stroke="none"/>
    <path d="${pathD}" fill="none" stroke="#E2394C" stroke-width="2"/>
    ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="#E2394C"/>`).join('')}
    ${pts.filter((p,i)=> i===0 || i===pts.length-1 || i===Math.floor(pts.length/2)).map(p=>`<text x="${p.x.toFixed(1)}" y="${H-8}" font-size="9" fill="#93A0BE" text-anchor="middle">${escapeHtml(p.date.slice(0,5))}</text>`).join('')}
    <text x="${padL-6}" y="${padT+4}" font-size="9" fill="#93A0BE" text-anchor="end">${max}</text>
    <text x="${padL-6}" y="${H-padB}" font-size="9" fill="#93A0BE" text-anchor="end">0</text>
  </svg>`;
}
function renderBarChartSVG(data){
  if(!data.length) return '<div class="helper-text">Veri yok.</div>';
  const W=560, barH=26, gap=10, padL=90, padR=50;
  const H = data.length*(barH+gap)+gap;
  const max = Math.max(1, ...data.map(d=>d.value));
  return `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;">
    ${data.map((d,i)=>{
      const y = gap + i*(barH+gap);
      const w = (d.value/max) * (W-padL-padR);
      return `
      <text x="${padL-8}" y="${y+barH*0.65}" font-size="11" fill="#C6CFE3" text-anchor="end" font-weight="600">${escapeHtml(d.stage)}</text>
      <rect x="${padL}" y="${y}" width="${Math.max(2,w)}" height="${barH}" rx="4" fill="#E2394C"/>
      <text x="${padL+Math.max(2,w)+8}" y="${y+barH*0.65}" font-size="11" fill="#93A0BE" font-weight="700">${fmtNum(d.value)}</text>
      `;
    }).join('')}
  </svg>`;
}

/* ============================= TARAYICI BİLDİRİMİ (Notification API) ============================= */
// Not: Bu, uygulama açıkken/son zamanlarda ziyaret edilmişken çalışan bir bildirimdir.
// Uygulama tamamen kapalıyken gerçek "push" bildirim göndermek ayrı bir sunucu altyapısı gerektirir.
function checkAndNotify(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const stuck = collectStuckParts();
  const dueSoon = collectDueSoonParts();
  if(stuck.length===0 && dueSoon.length===0) return;
  const parts = [];
  if(stuck.length) parts.push(`${stuck.length} parça aşamada takıldı`);
  if(dueSoon.length) parts.push(`${dueSoon.length} parçanın termini yaklaştı/geçti`);
  try{
    new Notification('Üretim Takip — Dikkat', { body: parts.join(' · '), icon: undefined });
  }catch(e){ console.error('notification error', e); }
}
