<style>
  :root{
    /* ---- ink / structural navy scale ---- */
    --navy-deep:#04070D;
    --navy-950:#070C18;
    --navy-900:#EEF2FC;   /* strongest heading text on dark panels */
    --navy-800:#D7E1F5;   /* secondary strong text / data emphasis */
    --navy-700:#4A72C9;   /* navy-blue accent: borders, focus rings, links, fills */
    --navy-600:#6C8FDD;
    --navy-100:#DCE5F6;   /* pale text on dark navy structural surfaces (sidebar/header) */
    --navy-50:#152343;    /* dark chip / hover fill */
    --ink-fill:#0A1120;   /* deep structural fill (sidebar, table header, toast, bulk bar) */
    --ink-fill-2:#14203E; /* structural fill, one step lighter than ink-fill */

    --blue-signal:#4A72C9;
    --blue-glow:#93A9D8;
    --blue-deep:#2F4F9E;
    --blue-100:#182A4C;

    --red-800:#4E0E1B;
    --red-700:#E23A4C;
    --red-600:#FF4E5E;
    --red-500:#FF8089;
    --red-100:#301620;    /* dark maroon chip tint */

    --brass:#C6A153;
    --brass-soft:#8C7238;

    --green-signal:#3FC17E;

    --gray-50:#0D1524;
    --gray-100:#1A2740;
    --gray-200:#263654;
    --gray-300:#354971;
    --gray-500:#8D99B9;
    --gray-700:#C6CFE3;
    --gray-900:#F1F3FA;
    --white:#FFFFFF;

    --ink:#070B14;
    --panel:#111A2F;
    --panel-2:#17233D;
    --hair:#233252;

    --font-display:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  html{zoom:1.16;}
  @media (max-width:900px){ html{zoom:1;} }
  body{
    font-family:var(--font-body);
    background:var(--ink);
    color:var(--gray-900);
  }
  #app{display:flex;min-height:100vh;}
  ::selection{background:rgba(226,58,76,0.35);color:#fff;}
  *:focus-visible{outline:2px solid var(--navy-700);outline-offset:2px;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:246px;
    flex-shrink:0;
    background:linear-gradient(175deg,var(--navy-950) 0%, var(--ink-fill) 60%, #0A1526 100%);
    color:var(--navy-100);
    display:flex;
    flex-direction:column;
    padding:0 0 16px 0;
    border-right:1px solid rgba(255,255,255,0.06);
    position:relative;
    z-index:5;
  }
  .brand{
    padding:28px 22px 20px 22px;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .brand-mark{
    font-family:var(--font-display);
    font-weight:700;
    font-size:23px;
    letter-spacing:-0.2px;
    color:var(--white);
    line-height:1.15;
  }
  .brand-mark span{color:var(--red-600);}
  .brand-sub{
    font-size:11px;
    letter-spacing:0.2px;
    color:var(--blue-glow);
    opacity:0.7;
    margin-top:7px;
  }
  .user-pill{
    margin:16px 16px 0 16px;
    padding:11px 13px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:10px;
    font-size:12px;
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    backdrop-filter:blur(6px);
  }
  .user-pill .who{overflow:hidden;}
  .user-pill .label{opacity:0.55;font-size:10px;letter-spacing:0.3px;margin-bottom:3px;font-weight:600;}
  .user-pill .value{font-weight:700;font-size:14px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-body);}
  .user-pill .switch-user{font-size:10.5px;color:var(--red-500);cursor:pointer;white-space:nowrap;text-decoration:underline;font-weight:600;}
  .company-pill{
    margin:8px 16px 6px 16px;
    padding:10px 12px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.09);
    border-radius:8px;
    font-size:12px;
  }
  .company-pill .label{opacity:0.55;font-size:10px;margin-bottom:3px;}
  .company-pill .value{font-weight:700;font-size:14px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav{margin-top:16px;display:flex;flex-direction:column;gap:3px;padding:0 12px;}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:10px 13px;border-radius:8px;cursor:pointer;
    font-size:13.5px;font-weight:600;color:var(--navy-100);opacity:0.62;
    border-left:3px solid transparent;
    transition:background .18s,opacity .18s,transform .12s;
    user-select:none;
    font-family:var(--font-body);
    letter-spacing:0.1px;
  }
  .nav-item:hover{background:rgba(255,255,255,0.05);opacity:1;transform:translateX(1px);}
  .nav-item.active{background:linear-gradient(90deg,rgba(226,58,76,0.20),rgba(226,58,76,0.04));opacity:1;border-left:3px solid var(--red-600);color:var(--white);}
  .nav-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .nav-icon svg{width:17px;height:17px;}
  .nav-badge{margin-left:auto;background:var(--red-600);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;}
  .sidebar-footer{margin-top:auto;padding:16px 22px 4px 22px;font-size:10px;color:var(--navy-100);opacity:0.3;letter-spacing:0.2px;}

  /* ---------- MAIN ---------- */
  .main{flex:1;min-width:0;padding:34px 40px;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
  .page-title{font-family:var(--font-display);font-weight:700;font-size:31px;color:var(--navy-900);line-height:1.05;letter-spacing:-0.4px;border-left:3px solid var(--red-600);padding-left:14px;}
  .page-sub{font-size:13px;color:var(--gray-500);margin-top:8px;margin-left:17px;font-family:var(--font-body);}
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.5px;
    padding:9px 17px;border-radius:9px;border:none;cursor:pointer;

  }

  .btn-primary{background:var(--red-600);color:var(--white);box-shadow:0 2px 10px rgba(255,78,94,0.28);}
  .btn-primary:hover{background:var(--red-700);box-shadow:0 4px 16px rgba(255,78,94,0.38);}
  .btn-navy{background:var(--ink-fill-2);color:var(--white);box-shadow:0 2px 8px rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);}
  .btn-navy:hover{background:var(--navy-50);border-color:rgba(255,255,255,0.14);}
  .btn-ghost{background:var(--panel);color:var(--navy-800);border:1px solid var(--gray-200);}

  .card{background:var(--panel);border:1px solid var(--hair);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);}
  .empty-state{

  .empty-state p{font-size:13.5px;margin:0 0 16px 0;font-family:var(--font-body);}

  /* company grid */
  .company-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .company-card{
    padding:18px;cursor:pointer;position:relative;
    border-top:3px solid var(--navy-700);
    transition:box-shadow .15s, transform .1s, border-color .15s;
  }
  .company-card:hover{box-shadow:0 10px 26px rgba(0,0,0,0.35);transform:translateY(-2px);}
  .company-card.selected{border-top-color:var(--red-600);box-shadow:0 0 0 1px var(--red-600),0 10px 26px rgba(226,58,76,0.15);}
  .company-card h3{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--navy-900);margin:0 0 4px 0;}
  .company-card .meta{font-size:11.5px;color:var(--gray-500);}
  .company-card .stats{display:flex;gap:14px;margin-top:12px;}
  .company-card .stat{font-size:11px;color:var(--gray-500);}
  .company-card .stat b{display:block;font-family:var(--font-mono);font-size:17px;color:var(--navy-800);font-weight:700;}
  .company-card .actions{position:absolute;top:12px;right:10px;display:flex;gap:4px;opacity:0;transition:opacity .15s;}
  .company-card:hover .actions{opacity:1;}
  .icon-btn{
    width:26px;height:26px;border-radius:6px;border:1px solid var(--hair);background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:var(--gray-700);
  }
  .icon-btn:hover{background:var(--gray-100);}
  .icon-btn.danger:hover{background:var(--red-100);color:var(--red-500);border-color:var(--red-100);}
  .badge-selected{position:absolute;top:12px;right:12px;background:var(--red-600);color:#fff;font-size:10px;font-weight:700;letter-spacing:.3px;padding:3px 8px;border-radius:20px;}
  .pin-btn{position:absolute;top:10px;left:10px;font-size:15px;cursor:pointer;opacity:0.4;transition:opacity .15s,transform .15s;z-index:3;line-height:1;}
  .pin-btn:hover{opacity:0.9;transform:scale(1.15);}
  .pin-btn.pinned{opacity:1;}
  .part-row-pin{cursor:pointer;opacity:0.4;transition:opacity .15s;font-size:14px;}
  .part-row-pin:hover{opacity:0.9;}
  .part-row-pin.pinned{opacity:1;}
  tr.part-row-clickable{cursor:pointer;}

  .part-search-wrap{position:relative;}
  .part-search-wrap .stage-select{width:280px;}
  .part-search-dropdown{
    position:absolute;top:calc(100% + 4px);left:0;right:0;max-height:320px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    background:var(--panel-2);border:1px solid var(--hair);border-radius:10px;box-shadow:0 20px 44px rgba(0,0,0,0.45);
    z-index:200;
  }
  .part-search-item{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--hair);}
  .part-search-item:last-child{border-bottom:none;}
  .part-search-item:hover{background:var(--navy-50);}
  .part-search-item.active{background:var(--navy-50);}
  .part-search-item .psi-name{flex:1;font-size:13px;color:var(--gray-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .part-search-item .psi-pin{font-size:11px;}
  .part-search-empty{padding:14px;text-align:center;font-size:12.5px;color:var(--gray-500);}

  .et-tabs{display:flex;gap:4px;border-bottom:1px solid var(--hair);margin-bottom:20px;flex-wrap:wrap;}
  .et-tab{padding:10px 16px;font-size:13.5px;font-weight:700;color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;}
  .et-tab:hover{color:var(--navy-800);}
  .et-tab.active{color:var(--red-600);border-bottom-color:var(--red-600);}
  .et-card-title{font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--navy-900);margin-bottom:6px;}
  .et-editable-table input.et-input{width:90px;border:1.5px solid var(--gray-300);border-radius:6px;padding:6px 8px;font-family:var(--font-mono);font-size:13px;text-align:center;background:var(--panel-2);color:var(--navy-900);}
  .et-editable-table input.et-input:disabled{background:var(--gray-100);color:var(--gray-500);}

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(3,6,12,0.65);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal{background:var(--panel);border:1px solid var(--hair);border-radius:16px;width:100%;max-width:440px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,0.55);max-height:88vh;overflow-y:auto;}
  .modal.wide{max-width:660px;}
  .modal h2{font-family:var(--font-display);font-size:23px;font-weight:600;color:var(--navy-900);margin:0 0 4px 0;letter-spacing:-0.2px;}
  .modal .modal-sub{font-size:13px;color:var(--gray-500);margin-bottom:18px;font-family:var(--font-body);}
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--gray-500);margin-bottom:6px;letter-spacing:0.1px;font-family:var(--font-body);}
  .field input[type=text],.field input[type=number],.field input[type=email],.field input[type=password],.field input[type=date],.field input[type=month],.field textarea,.field select{
    width:100%;padding:10px 12px;border:1.5px solid var(--gray-300);border-radius:8px;
    font-family:var(--font-body);font-size:14px;color:var(--navy-900);background:var(--panel-2);
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--navy-700);box-shadow:0 0 0 3px rgba(74,114,201,0.18);}
  .field textarea{resize:vertical;min-height:60px;font-family:var(--font-body);}
  .field .radio-row{display:flex;gap:14px;margin-top:4px;}
  .field .radio-row label{display:flex;align-items:center;gap:6px;font-weight:400;font-size:13px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;}
  .modal-close{position:absolute;top:18px;right:20px;cursor:pointer;font-size:18px;color:var(--gray-500);transition:color .15s;}
  .modal-close:hover{color:var(--red-600);}
  .modal-wrap-pos{position:relative;}

  /* login modal specific */
  .login-overlay{position:fixed;inset:0;background:radial-gradient(circle at 25% 15%, #16264A 0%, var(--navy-950) 55%, #030509 100%);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;}
  .login-box{background:var(--panel);border:1px solid var(--hair);border-radius:18px;padding:44px 38px;width:100%;max-width:400px;box-shadow:0 50px 120px rgba(0,0,0,0.6);position:relative;overflow:hidden;}
  .login-box::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--navy-700),var(--brass),var(--red-600));}
  .login-box .login-brand{font-family:var(--font-display);font-weight:700;font-size:27px;color:var(--navy-900);text-align:center;letter-spacing:-0.3px;}
  .login-box .login-brand span{color:var(--red-600);}
  .login-box .login-sub{text-align:center;font-size:12.5px;color:var(--gray-500);margin:8px 0 28px 0;font-family:var(--font-body);}
  .login-box .field{margin-bottom:16px;}
  .login-note{font-size:11px;color:var(--gray-500);text-align:center;margin-top:10px;line-height:1.5;font-family:var(--font-body);}
  datalist{}

  /* toolbar */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .search-box{flex:1;min-width:200px;position:relative;}
  .search-box input{width:100%;padding:9px 12px 9px 32px;border:1.5px solid var(--gray-300);border-radius:8px;font-size:14px;font-family:var(--font-body);background:var(--panel-2);color:var(--navy-900);}
  .search-box::before{content:"⌕";position:absolute;left:11px;top:8px;color:var(--gray-500);font-size:15px;}
  .filter-select{padding:9px 11px;border:1.5px solid var(--gray-300);border-radius:8px;font-size:13.5px;font-family:var(--font-body);background:var(--panel-2);color:var(--navy-900);}

  /* table */
  table.data-table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden;border:1px solid var(--hair);}
  table.data-table thead th{
    background:var(--ink-fill);color:var(--navy-100);text-align:left;padding:11px 12px;
    font-size:11.5px;font-weight:700;white-space:nowrap;letter-spacing:.2px;
  }
  table.data-table tbody td{padding:11px 12px;border-bottom:1px solid var(--hair);font-size:13.5px;vertical-align:middle;color:var(--gray-700);}
  table.data-table tbody tr:last-child td{border-bottom:none;}
  table.data-table tbody tr:hover{background:var(--navy-50);}
  .mono{font-family:var(--font-mono);}
  .part-no-tag{font-family:var(--font-mono);font-weight:700;color:var(--navy-800);background:var(--navy-50);padding:2px 8px;border-radius:5px;font-size:12.5px;}
  .row-actions{display:flex;gap:5px;}

  .status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .status-badge.shipped{background:var(--navy-50);color:var(--navy-800);}
  .status-badge.progress{background:var(--red-100);color:var(--red-500);}
  .status-badge.notstarted{background:var(--gray-100);color:var(--gray-500);}
  .status-badge.open{background:var(--red-100);color:var(--red-500);}
  .status-badge.closed{background:var(--navy-50);color:var(--navy-800);}
  .status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  .progress-track{width:100%;height:6px;border-radius:4px;background:var(--gray-200);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--navy-700),var(--red-600));border-radius:4px;}

  /* dashboard */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:26px;}
  .kpi-card{padding:19px 19px 17px 19px;border-radius:12px;background:var(--panel);border:1px solid var(--hair);border-left:3px solid var(--navy-700);box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);transition:box-shadow .2s,transform .15s,border-color .15s;}
  .kpi-card:hover{border-color:var(--navy-700);transform:translateY(-2px);}
  .kpi-card.accent{border-left-color:var(--red-600);}
  .kpi-card .kpi-label{font-size:11px;color:var(--gray-500);font-weight:600;letter-spacing:0.2px;font-family:var(--font-body);}
  .kpi-card .kpi-value{font-family:var(--font-mono);font-size:27px;font-weight:700;color:var(--navy-900);margin-top:8px;letter-spacing:-0.3px;}
  .kpi-card .kpi-unit{font-size:12px;color:var(--gray-500);margin-left:4px;font-family:var(--font-body);}

  .section-title{font-family:var(--font-display);font-size:19px;font-weight:600;color:var(--navy-900);margin:30px 0 14px 0;letter-spacing:-0.2px;}

  /* pipeline / stage flow */
  .pipeline{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 0 10px 0;}
  .pipeline-stage{
    flex:1;min-width:132px;position:relative;padding:14px 12px 12px 12px;background:var(--panel);
    border:1px solid var(--hair);border-left:none;
  }
  .pipeline-stage:first-child{border-left:1px solid var(--hair);border-radius:10px 0 0 10px;}
  .pipeline-stage:last-child{border-radius:0 10px 10px 0;}
  .pipeline-stage .stage-name{font-size:11px;letter-spacing:.2px;color:var(--gray-500);font-weight:700;margin-bottom:8px;white-space:nowrap;}
  .pipeline-stage .stage-input{
    width:100%;border:1.5px solid var(--gray-300);border-radius:6px;padding:7px 8px;font-family:var(--font-mono);
    font-size:15px;font-weight:700;color:var(--navy-900);text-align:center;background:var(--panel-2);
  }
  .pipeline-stage .stage-input:focus{outline:none;border-color:var(--red-600);}
  .pipeline-stage .reject-row{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .pipeline-stage .reject-row label{font-size:10.5px;color:var(--red-500);font-weight:700;white-space:nowrap;}
  .pipeline-stage.locked{background:var(--gray-50);}
  .pipeline-stage.locked .stage-input,.pipeline-stage.locked .reject-input{background:var(--gray-100);color:var(--gray-500);cursor:not-allowed;}
  .pipeline-stage.current{border-color:var(--red-600);border-width:2px;box-shadow:0 0 0 1px var(--red-600);}
  .current-badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--red-600);color:#fff;font-size:8.5px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:10px;white-space:nowrap;}
  .stage-meta{font-size:9.5px;color:var(--gray-500);margin-top:7px;line-height:1.4;text-align:center;}
  .pipeline-stage .reject-input{
    width:100%;border:1.5px solid var(--red-100);background:var(--red-100);border-radius:6px;padding:5px 6px;
    font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--red-500);text-align:center;
  }
  .pipeline-stage .reject-input:focus{outline:none;border-color:var(--red-600);}
  .pipeline-stage::after{
    content:"›";position:absolute;right:-11px;top:26px;
    font-size:20px;color:var(--gray-300);z-index:2;font-weight:700;
  }
  .pipeline-stage:last-child::after{content:"";}
  .pipeline-stage .stage-bar{height:4px;border-radius:3px;background:var(--gray-200);margin-top:8px;overflow:hidden;}
  .pipeline-stage .stage-bar-fill{height:100%;background:var(--navy-700);}
  .pipeline-stage.final .stage-bar-fill{background:var(--red-600);}
  .pipeline-stage.final .stage-name{color:var(--red-500);}

  .history-list{max-height:260px;overflow-y:auto;border:1px solid var(--hair);border-radius:10px;}

  .history-row .h-stage{font-weight:700;color:var(--navy-800);}
  .history-row .h-qty{font-family:var(--font-mono);font-weight:700;color:var(--red-500);}
  .history-row .h-user{font-size:11px;color:var(--gray-500);}

  .tag-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--navy-50);border:1px solid rgba(255,255,255,0.12);
    padding:5px 10px 5px 12px;border-radius:20px;font-size:13px;color:var(--navy-800);font-weight:600;
  }
  .tag-chip .x{cursor:pointer;color:var(--red-500);font-weight:700;}
  .stage-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .add-stage-row{display:flex;gap:8px;margin-top:12px;}
  .add-stage-row input{flex:1;}

  .helper-text{font-size:11.5px;color:var(--gray-500);margin-top:4px;line-height:1.5;}
  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--ink-fill-2);border:1px solid var(--hair);color:#fff;padding:12px 18px;border-radius:10px;
    font-size:13.5px;font-weight:600;box-shadow:0 16px 40px rgba(0,0,0,0.5);z-index:300;display:flex;align-items:center;gap:8px;
    border-left:3px solid var(--red-600);
  }
  .toast-undo-btn{background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.25);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .toast-undo-btn:hover{background:rgba(255,255,255,0.22);}
  .loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;width:100%;color:var(--gray-500);font-size:14px;background:var(--ink);}
  .select-company-hint{padding:60px 20px;text-align:center;color:var(--gray-500);}
  .drop-zone{
    border:2px dashed var(--gray-300);border-radius:10px;padding:26px;text-align:center;cursor:pointer;
    background:var(--gray-50);transition:border-color .15s, background .15s;
  }
  .drop-zone:hover,.drop-zone.drag{border-color:var(--red-600);background:var(--red-100);}
  .drop-zone .dz-ico{font-size:26px;margin-bottom:6px;}
  .drop-zone .dz-text{font-size:13.5px;color:var(--gray-700);font-weight:600;}
  .drop-zone .dz-sub{font-size:11.5px;color:var(--gray-500);margin-top:3px;}
  .preview-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px;}
  .preview-table th{background:var(--gray-100);padding:6px 9px;text-align:left;font-size:11px;color:var(--gray-500);}

  .import-summary{display:flex;gap:16px;margin-top:12px;font-size:13px;color:var(--gray-500);}
  .import-summary b{color:var(--navy-800);}
  select.stage-select{padding:9px 11px;border:1.5px solid var(--gray-300);border-radius:8px;font-size:13.5px;min-width:220px;font-family:var(--font-body);background:var(--panel-2);color:var(--navy-900);}

  .bulk-bar{display:flex;align-items:center;gap:12px;background:var(--ink-fill);border:1px solid var(--hair);color:var(--white);padding:10px 16px;border-radius:10px;margin-bottom:14px;flex-wrap:wrap;}

  .bulk-bar .bulk-count b{color:var(--red-500);}

  .bulk-bar .btn-ghost{background:transparent;color:var(--white);border-color:rgba(255,255,255,0.25);}
  .bulk-bar .btn-ghost:hover{border-color:var(--white);}
  .row-check{width:34px;}
  input[type=checkbox].sel-check{width:16px;height:16px;cursor:pointer;accent-color:var(--red-600);}

  .bulk-preview-row{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;font-size:12px;border-bottom:1px solid var(--hair);}

  .storage-warning{background:var(--red-100);color:var(--red-500);border:1px solid var(--red-800);padding:10px 16px;border-radius:9px;font-size:12.5px;font-weight:600;margin-bottom:16px;}

  .alert-panel{background:linear-gradient(135deg,var(--ink-fill),var(--ink-fill-2));border:1px solid var(--hair);border-radius:12px;padding:18px 20px;margin-bottom:22px;}
  .alert-panel-title{color:#fff;font-family:var(--font-display);font-size:17px;font-weight:700;margin-bottom:12px;}

  .production-issue{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--panel);margin-bottom:8px;}

  @media(max-width:820px){
    .profile-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .quality-event{grid-template-columns:1fr 70px;gap:6px 10px;}
    .quality-event .qe-note{grid-column:1/-1;}
    .quality-event .qe-date{grid-column:1/-1;}

  @media(max-width:460px){
    .profile-grid{grid-template-columns:1fr;}
    .quality-flow-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  }

// Güvenli veritabanı yolları: her path segmenti ayrı encode edilir.
function encodeDbPath(path){
  return String(path||'').split('/').filter(Boolean).map(encodeURIComponent).join('/');
}
async function getIdToken(){
  const user = fbAuth.currentUser;
  if(!user) return null;
  try{ return await user.getIdToken(); }catch(e){ return null; }
}
async function firebaseFetch(path, options){
  const token = await getIdToken();
  const cleanPath = encodeDbPath(path);
  const url = `${FIREBASE_URL}/${cleanPath}.json${token ? '?auth='+encodeURIComponent(token) : ''}`;
  const res = await fetch(url, options);
  if(!res.ok){
    const err = new Error('Firebase request failed: ' + res.status);
    err.status = res.status;
    throw err;
  }
  return res;
}
async function storageGet(path){

    return (data===null || data===undefined) ? null : data;
  }catch(e){
    console.error('storageGet error', path, e);
    return null;
  }
}
async function storageSet(path, value){

function legacyValueMissing(v){
  if(v===undefined || v===null || v==='') return true;
  if(Array.isArray(v)) return v.length===0;
  if(typeof v==='object') return Object.keys(v).length===0;
  return false;
}
function mergeLegacyPartRecord(oldPart,newPart){
  if(!newPart) return (typeof structuredClone==='function') ? structuredClone(oldPart) : JSON.parse(JSON.stringify(oldPart));
  const merged={...(oldPart||{}),...(newPart||{})};
  Object.keys(oldPart||{}).forEach(k=>{
    if(legacyValueMissing(newPart[k]) && !legacyValueMissing(oldPart[k])) merged[k]=oldPart[k];
  });
  ['qtys','rejects','processProfile'].forEach(k=>{
    if(oldPart && oldPart[k] && typeof oldPart[k]==='object' && !Array.isArray(oldPart[k])){
      merged[k]={...(oldPart[k]||{}),...((newPart&&newPart[k])||{})};
    }
  });
  ['drawings','measurements','history','ncrs','returnEvents','qualityEvents','productionIssues','dismissedNcrSuggestions'].forEach(k=>{
    const a=Array.isArray(oldPart&&oldPart[k])?oldPart[k]:[];
    const b=Array.isArray(newPart&&newPart[k])?newPart[k]:[];
    if(a.length && !b.length) merged[k]=a;
  });
  if((!newPart.note || !String(newPart.note).trim()) && oldPart && oldPart.note) merged.note=oldPart.note;
  return merged;
}
async function recoverLegacyParts(){
  if(!isAdmin()) return {ok:false,message:'Yalnızca yönetici kurtarma yapabilir.'};
  const companies=companyArrayFromRaw(await storageGet('companies'));
  let restored=0, mergedCount=0, legacyCompanies=0, permissionDenied=false, writeFailed=false;
  for(const c of companies){
    if(!c || !c.id) continue;
    const legacyRes=await legacyStorageGetDetailed('parts:'+c.id);
    if(!legacyRes.ok){
      if(legacyRes.status===401 || legacyRes.status===403) permissionDenied=true;
      continue;
    }
    const legacy=asArray(legacyRes.data);
    if(!legacy.length) continue;
    legacyCompanies++;
    const current=asArray(await storageGet('parts/'+c.id));
    const out=current.slice();
    for(const oldPart of legacy){
      if(!oldPart) continue;
      const idx=oldPart.id ? out.findIndex(x=>x&&x.id===oldPart.id) : -1;
      if(idx<0){ out.push(oldPart); restored++; }
      else{
        const before=JSON.stringify(out[idx]);
        out[idx]=mergeLegacyPartRecord(oldPart,out[idx]);
        if(JSON.stringify(out[idx])!==before) mergedCount++;
      }
    }
    const ok=await storageSet('parts/'+c.id,out);
    if(!ok) writeFailed=true;
  }
  if(!writeFailed && (restored||mergedCount||legacyCompanies)){
    await storageSet('meta/legacyRecoveryAt',todayStr());
    await storageSet('meta/legacyRecoveryCompleted',true);
  }
  return {ok:!writeFailed,restored,mergedCount,legacyCompanies,permissionDenied,writeFailed};
}

// Örnekleme / kontrol sıklığı tablosu (kullanıcının verdiği tabloya göre)
const SAMPLING_TABLE = [
  {min:1,   max:3,     full:true},           // 1-3 arası -> %100 kontrol
  {min:4,   max:50,    num:1, per:10},       // 3-50 arası -> 1 adet / 10 adet
  {min:51,  max:150,   num:3, per:50},       // 51-150 arası -> 3 adet / 50 adet
  {min:151, max:500,   num:4, per:100},      // 151-500 arası -> 4 adet / 100 adet
  {min:501, max:3250,  num:5, per:250},      // 501-3250 arası -> 5 adet / 250 adet
  {min:3251,max:35000, num:6, per:500},      // 3201-35000 arası -> 6 adet / 500 adet
];
function calcSampleCount(orderedQty){
  const q = Number(orderedQty)||0;
  if(q<=0) return 0;
  let bracket = SAMPLING_TABLE.find(b => q>=b.min && q<=b.max);
  if(!bracket) bracket = q < SAMPLING_TABLE[0].min ? SAMPLING_TABLE[0] : SAMPLING_TABLE[SAMPLING_TABLE.length-1];
  if(bracket.full) return q;
  return Math.max(1, Math.ceil(q / bracket.per) * bracket.num);
}

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
// Base64 data URI'yi gerçek bir Blob'a çevirir — tarayıcıların "data:" linklerine
// doğrudan yönlendirmeyi engelleyen güvenlik kısıtlamasını aşmak için kullanılır.
function dataURLtoBlob(dataURL){
  const commaIdx = dataURL.indexOf(',');
  const meta = dataURL.slice(0, commaIdx);
  const isBase64 = meta.includes('base64');
  const mimeMatch = meta.match(/data:([^;]+)/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const rawData = dataURL.slice(commaIdx+1);
  const raw = isBase64 ? atob(rawData) : decodeURIComponent(rawData);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return new Blob([arr], {type: mime});
}
function fmtNum(n){
  n = Number(n)||0;
  return n.toLocaleString('tr-TR');
}
// Kullanıcı virgülle ondalık girebilsin diye ("12,5" -> 12.5). Boşlukları ve binlik
// ayırıcı noktaları da tolere eder.
function parseDecimal(str){
  if(str==null) return NaN;
  let s = String(str).trim();
  if(s==='') return NaN;
  if(s.includes(',')){
    // Virgül ondalık ayıracı: noktalar binlik ayıracı sayılır ve atılır.
    s = s.replace(/\./g,'').replace(',','.');
  }
  return Number(s);
}

function genAccessCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes = new Uint32Array(24);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
  else for(let i=0;i<bytes.length;i++) bytes[i]=Math.floor(Math.random()*0xffffffff);
  let s='';
  for(let i=0;i<bytes.length;i++) s += chars[bytes[i] % chars.length];
  return s;
}

function currentMonthKey(){

function monthLabel(key){
  if(!/^\d{4}-\d{2}$/.test(String(key||''))) return key || '—';
  const [y,m] = key.split('-').map(Number);
  return new Date(y,m-1,1).toLocaleDateString('tr-TR',{month:'long',year:'numeric'}).replace(/^./,x=>x.toLocaleUpperCase('tr-TR'));
}
function monthShortLabel(key){

}
function inferPartMonth(part){
  if(part && /^\d{4}-\d{2}$/.test(part.orderMonth||'')) return part.orderMonth;
  if(part && /^\d{4}-\d{2}/.test(part.dueDate||'')) return String(part.dueDate).slice(0,7);
  const d = part && parseTRDate(part.lastUpdate);
  if(d) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  return currentMonthKey();
}
function ensureRequiredStages(stages){
  let out = Array.isArray(stages) && stages.length ? stages.slice() : DEFAULT_STAGES.slice();
  const insertAfter = (name, after)=>{
    if(out.some(s=>s.toLocaleLowerCase('tr-TR')===name.toLocaleLowerCase('tr-TR'))) return;
    const idx = out.findIndex(s=>s.toLocaleLowerCase('tr-TR')===after.toLocaleLowerCase('tr-TR'));
    if(idx>=0) out.splice(idx+1,0,name); else out.push(name);
  };
  insertAfter('CNC','Kesim');

  insertAfter('Kaplama','Boya');

}
function ensureCompanyMonths(company, parts){

  (parts||[]).forEach(p=>set.add(inferPartMonth(p)));
  if(!set.size) set.add(currentMonthKey());
  company.months = Array.from(set).sort();

function monthDelta(current, previous){
  const diff = Number(current||0)-Number(previous||0);
  const pct = Number(previous||0)!==0 ? (diff/Number(previous))*100 : (Number(current||0)>0 ? 100 : 0);
  return {diff,pct};
}
function deltaHtml(current, previous, reverseGood){
  const d = monthDelta(current, previous);
  const good = reverseGood ? d.diff<0 : d.diff>0;
  const bad = reverseGood ? d.diff>0 : d.diff<0;
  const cls = good?'up':bad?'down':'flat';
  const arrow = d.diff>0?'▲':d.diff<0?'▼':'•';
  return `<span class="metric-delta ${cls}">${arrow} ${d.diff>0?'+':''}${fmtNum(d.diff)} (${d.pct>0?'+':''}${d.pct.toLocaleString('tr-TR',{maximumFractionDigits:1})}%)</span>`;

// Bunlar paylaşılan üretim verisi DEĞİL — sadece bu tarayıcıdaki kişisel görünüm tercihleri
// (son seçilen şirket, sabitlenen şirket/parçalar). Bu yüzden Firebase'e değil, bu cihaza kaydedilir.
function lsGet(key, fallback){
  try{
    const raw = localStorage.getItem('ut_'+key);
    return raw!=null ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function lsSet(key, value){
  try{ localStorage.setItem('ut_'+key, JSON.stringify(value)); }catch(e){}
}
function loadLocalPrefs(){
  state.pinnedCompanies = lsGet('pinnedCompanies', []);
  state.pinnedParts = lsGet('pinnedParts', []);

}
function toggleCompanyPin(id){
  const set = new Set(state.pinnedCompanies);
  if(set.has(id)) set.delete(id); else set.add(id);
  state.pinnedCompanies = Array.from(set);
  lsSet('pinnedCompanies', state.pinnedCompanies);
}
function togglePartPin(id){
  const set = new Set(state.pinnedParts);
  if(set.has(id)) set.delete(id); else set.add(id);
  state.pinnedParts = Array.from(set);
  lsSet('pinnedParts', state.pinnedParts);
}
function sortWithPinned(list, pinnedIds){
  const pinned = [], rest = [];
  list.forEach(item=> (pinnedIds.includes(item.id) ? pinned : rest).push(item));
  return [...pinned, ...rest];
}

function setState(patch){ Object.assign(state, patch); render(); }
function showToast(msg, undoTrashId){
  state.toast = msg;
  state.toastUndoId = undoTrashId || null;

  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ state.toast=null; state.toastUndoId=null; render(); }, undoTrashId ? 6000 : 2600);
}

/* ============================= DATA ACCESS ============================= */
function asArray(v){ return Array.isArray(v) ? v : []; }

function companyArrayFromRaw(raw){
  if(Array.isArray(raw)) return raw.filter(Boolean);
  if(raw && typeof raw==='object') return Object.values(raw).filter(Boolean);
  return [];
}
function companyMapFromArray(list){
  const out={}; (list||[]).forEach(c=>{ if(c&&c.id) out[c.id]=c; }); return out;
}
async function migrateLegacySchemaIfNeeded(){
  if(!isAdmin()) return;
  const version = Number(await storageGet('meta/schemaVersion') || 0);
  if(version >= 2) return;

  const rawCompanies = await storageGet('companies');
  const companies = companyArrayFromRaw(rawCompanies);
  const existingCodes = (await storageGet('companyAccessCodes')) || {};
  const accessCodes = {...existingCodes};
  const inviteMap = (await storageGet('clientInvites')) || {};
  let migrationOk = true;

  for(const c of companies){
    if(!c || !c.id) continue;
    let code = String(accessCodes[c.id] || c.clientCode || '').toUpperCase();
    // Eski kısa kodlar yerine tahmin edilmesi çok daha zor, 24 karakterlik kod üret.
    if(code.length < 16) code = genClientCode();
    accessCodes[c.id] = code;
    inviteMap[code] = {companyId:c.id,active:true,createdAt:todayStr()};
    delete c.clientCode;

    const currentParts = await storageGet('parts/'+c.id);
    if(currentParts===null){
      const legacyParts = await legacyStorageGet('parts:'+c.id);
      if(legacyParts!==null){
        const copied = await storageSet('parts/'+c.id, legacyParts);
        if(!copied) migrationOk = false;
      }
    }
  }

  if(companies.length && !(await storageSet('companies', companyMapFromArray(companies)))) migrationOk=false;
  if(!(await storageSet('companyAccessCodes', accessCodes))) migrationOk=false;
  if(!(await storageSet('clientInvites', inviteMap))) migrationOk=false;

  // Eski parts:... anahtarlarını otomatik silmiyoruz: geçiş sırasında güvenli yedek olarak kalırlar.
  // Yeni Rules yayımlandığında bu eski yollar zaten erişilemez olur.
  if(migrationOk){
    await storageSet('meta/schemaVersion', 2);
    await storageSet('meta/migratedAt', todayStr());
  }else{
    throw new Error('Güvenli veri göçü tamamlanamadı. Eski veriler silinmedi; Rules yayımlanmadan önce tekrar deneyin.');
  }
}

async function loadAll(){
  try{
    if(isAdmin()) await migrateLegacySchemaIfNeeded();

    let companies=[];
    if(isClient()){
      if(!state.clientCompanyId) throw new Error('Müşteri hesabında şirket bağlantısı yok.');
      const c = await storageGet('companies/'+state.clientCompanyId);
      if(c) companies=[c];
    }else{
      companies = companyArrayFromRaw(await storageGet('companies'));
    }
    state.companies = companies;

    let companiesMigrated = false;
    companies.forEach(c=>{
      if(!c) return;
      const normalizedStages=ensureRequiredStages(c.stages);
      if(JSON.stringify(normalizedStages)!==JSON.stringify(c.stages||[])){ c.stages=normalizedStages; companiesMigrated=true; }
      if(!Array.isArray(c.months)){ c.months=[]; companiesMigrated=true; }
    });

    const partsMap={};
    const migratedPartCompanies=new Set();
    for(const c of companies){
      if(!c||!c.id) continue;
      const parts=asArray(await storageGet('parts/'+c.id));
      parts.forEach(p=>{
        if(!p) return;
        if(!p.qtys) p.qtys={}; if(!p.rejects) p.rejects={}; if(!p.ncrs) p.ncrs=[]; if(!p.history) p.history=[];
        if(!Array.isArray(p.drawings)) p.drawings=[]; if(p.drawing){p.drawings.push(p.drawing);p.drawing=undefined;}
        if(p.color===undefined) p.color=''; if(!Array.isArray(p.measurements)) p.measurements=[]; if(!Array.isArray(p.returnEvents)) p.returnEvents=[];
        if(!Array.isArray(p.qualityEvents)) p.qualityEvents=[];
        if(!Array.isArray(p.productionIssues)) p.productionIssues=[];
        if(!Array.isArray(p.dismissedNcrSuggestions)) p.dismissedNcrSuggestions=[];
        if(!p.processProfile || typeof p.processProfile!=='object') p.processProfile={};
        if(!p.orderedQty) p.orderedQty=Number(p.orderedQty)||0;
        const inferredMonth=inferPartMonth(p); if(p.orderMonth!==inferredMonth){p.orderMonth=inferredMonth;migratedPartCompanies.add(c.id);}
      });
      const beforeMonths=JSON.stringify(c.months||[]); ensureCompanyMonths(c,parts);
      if(JSON.stringify(c.months||[])!==beforeMonths) companiesMigrated=true;
      partsMap[c.id]=parts;
    }
    state.partsByCompany=partsMap;

    if(!isClient()){
      const knownUsersRaw=await storageGet('known-users'); state.knownUsers=asArray(knownUsersRaw).filter(u=>typeof u==='string');
      const etRaw=await storageGet('errortracking');
      state.errorTracking={ppmMonthly:(etRaw&&etRaw.ppmMonthly)||{},ppmTarget:Number(etRaw&&etRaw.ppmTarget)||3000,ncrRejectThresholdPct:Number(etRaw&&etRaw.ncrRejectThresholdPct)||3,deptMonthly:(etRaw&&etRaw.deptMonthly)||{},disHatalar:asArray(etRaw&&etRaw.disHatalar),icHatalar:asArray(etRaw&&etRaw.icHatalar)};
      const trashRaw=await storageGet('drawingtrash'); let trash=asArray(trashRaw); const before=trash.length;
      trash=trash.filter(t=>{const d=daysSince(t.deletedAt);return d===null||d<TRASH_RETENTION_DAYS;}); state.drawingTrash=trash;
      if(trash.length!==before && isAdmin()) await persistDrawingTrash();
    }
    if(isAdmin()){
      state.companyAccessCodes=(await storageGet('companyAccessCodes'))||{};
      state.staffInvites=(await storageGet('staffInvites'))||{};
      state.accessUsers=(await storageGet('users'))||{};
    }
    if(companiesMigrated && isAdmin()) await persistCompanies();
    if(isAdmin()) for(const cid of migratedPartCompanies) await persistParts(cid);

    if(isClient()){
      state.selectedCompanyId=state.clientCompanyId;
      if(state.view==='companies'||state.view==='errortracking'||state.view==='access') state.view='parts';
    }else{
      if(state.selectedCompanyId && !companies.find(c=>c.id===state.selectedCompanyId)) state.selectedCompanyId=null;
      if(companies.length&&!state.selectedCompanyId) state.selectedCompanyId=companies[0].id;
    }
  }catch(e){
    console.error('loadAll fatal error',e); state.storageUnavailable=true; state.companies=asArray(state.companies); state.partsByCompany=state.partsByCompany||{}; state.knownUsers=asArray(state.knownUsers);
  }
  state.loading=false; render();
}

  state.lastSaveFailed=false;
  const ok=await storageSet('companies',companyMapFromArray(state.companies));
  if(!ok&&!state.storageUnavailable){state.lastSaveFailed=true;render();} return ok;
}

  state.lastSaveFailed=false;
  const ok=await storageSet('parts/'+companyId,state.partsByCompany[companyId]||[]);

const ERROR_DEPT_LIST = ['Lazer Kesimi', 'Kaynakhane', 'CNC Bükme', 'Diğer'];
function genMonthLabels(beforeCount, afterCount){
  const months = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  const now = new Date();
  const labels = [];
  for(let i=-beforeCount;i<=afterCount;i++){
    const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
    labels.push(months[d.getMonth()] + '.' + String(d.getFullYear()).slice(2));
  }
  return labels;
}
async function persistErrorTracking(){
  const ok = await storageSet('errortracking', state.errorTracking);

  return ok;
}

/* ============================= COMPUTATIONS ============================= */
function partRemaining(part, stages){
  const last = stages[stages.length-1];
  const shipped = Number((part.qtys||{})[last]||0);
  return Math.max(0, Number(part.orderedQty||0) - shipped);
}
function partTotalReject(part){
  return Object.values(part.rejects||{}).reduce((a,b)=>a+(Number(b)||0),0);
}
function partStatus(part, stages){
  const last = stages[stages.length-1];
  const shipped = Number((part.qtys||{})[last]||0);
  const anyProgress = stages.some(s => Number((part.qtys||{})[s]||0) > 0);
  if(shipped >= Number(part.orderedQty||0) && Number(part.orderedQty||0) > 0) return 'shipped';
  if(anyProgress) return 'progress';
  return 'notstarted';
}
function companyTotals(companyId, monthKey){
  const company = getCompany(companyId);
  const parts = monthKey ? getMonthParts(companyId, monthKey) : getParts(companyId);
  const stages = company ? company.stages : DEFAULT_STAGES;
  const last = stages[stages.length-1];
  const prev = stages.length>1 ? stages[stages.length-2] : last;
  let ordered=0, shipped=0, completed=0, rejected=0, openNcr=0, closedNcr=0;
  parts.forEach(p=>{
    ordered += Number(p.orderedQty||0);
    shipped += Number((p.qtys||{})[last]||0);
    completed += Number((p.qtys||{})[prev]||0);
    rejected += partTotalReject(p);
    (p.ncrs||[]).forEach(n=> n.status==='acik' ? openNcr++ : closedNcr++);
  });
  return { partCount: parts.length, ordered, shipped, completed, rejected, openNcr, closedNcr, inProgress: Math.max(0, ordered - shipped) };
}
function allTotals(){
  const vc = visibleCompanies();
  let totals = {companyCount: vc.length, partCount:0, ordered:0, shipped:0, completed:0, inProgress:0, rejected:0, openNcr:0, closedNcr:0};
  vc.forEach(c=>{
    const t = companyTotals(c.id);
    totals.partCount += t.partCount; totals.ordered += t.ordered; totals.shipped += t.shipped;
    totals.completed += t.completed; totals.inProgress += t.inProgress; totals.rejected += t.rejected;
    totals.openNcr += t.openNcr; totals.closedNcr += t.closedNcr;
  });
  return totals;
}
function allOpenNcrCount(){
  let n=0;
  visibleCompanies().forEach(c=> getParts(c.id).forEach(p=> (p.ncrs||[]).forEach(x=> { if(x.status==='acik') n++; })));
  return n;
}

      ${state.storageUnavailable ? `<div class="storage-warning">&#9888; Firebase veritabanına bağlanılamadı — internet bağlantınızı kontrol edin veya veritabanı kurallarının (Rules) açık olduğundan emin olun.</div>` : ''}
      ${state.lastSaveFailed ? `<div class="storage-warning">&#9888; Son değişiklik kaydedilemedi.${state.lastSaveErrorDetail ? ' '+escapeHtml(state.lastSaveErrorDetail) : ''} Lütfen tekrar deneyin veya sayfayı yenileyip son işlemi tekrar yapın.</div>` : ''}

  `;
  attachHandlers();
}

function attachAuthHandlers(){
  const isSignup = state.authView === 'signup';
  const emailInput = document.getElementById('authEmailInput');
  const passInput = document.getElementById('authPassInput');
  const submitBtn = document.getElementById('authSubmitBtn');
  const errEl = document.getElementById('authErrorMsg');
  if(emailInput) emailInput.focus();

  const switchLink = document.getElementById(isSignup ? 'switchToLogin' : 'switchToSignup');
  if(switchLink){ switchLink.addEventListener('click', (e)=>{ e.preventDefault(); state.authView = isSignup ? 'login' : 'signup'; render(); }); }

  const accountType = document.getElementById('authAccountTypeInput');
  const inviteLabel = document.getElementById('authInviteLabel');
  if(accountType && inviteLabel){
    accountType.addEventListener('change', ()=>{ inviteLabel.textContent = accountType.value==='staff' ? 'Personel Davet Kodu' : 'Şirket Davet Kodu'; });
  }
  const showErr = (msg)=>{ if(errEl) errEl.textContent = msg; };
  const friendlyError = (code)=>{
    if(code==='auth/email-already-in-use') return 'Bu e-posta zaten kayıtlı. Giriş yapmayı deneyin.';
    if(code==='auth/invalid-email') return 'Geçerli bir e-posta adresi girin.';
    if(code==='auth/weak-password') return 'Şifre en az 6 karakter olmalı.';
    if(code==='auth/user-not-found' || code==='auth/wrong-password' || code==='auth/invalid-credential') return 'E-posta veya şifre hatalı.';
    if(code==='auth/too-many-requests') return 'Çok fazla deneme yapıldı, biraz sonra tekrar deneyin.';
    return 'Bir hata oluştu, tekrar deneyin.';
  };

  const doSubmit = async ()=>{
    showErr('');
    const email = (emailInput.value||'').trim();
    const pass = passInput.value||'';
    if(!email || !pass){ showErr('E-posta ve şifre zorunludur.'); return; }
    submitBtn.disabled = true;
    try{
      if(isSignup){
        const name = (document.getElementById('authNameInput').value||'').trim();
        const type = document.getElementById('authAccountTypeInput').value;
        const inviteCode = (document.getElementById('authInviteCodeInput').value||'').trim().toUpperCase();
        if(!name){ showErr('Ad soyad zorunludur.'); submitBtn.disabled=false; return; }
        if(!inviteCode){ showErr('Davet kodu zorunludur.'); submitBtn.disabled=false; return; }

        const cred = await fbAuth.createUserWithEmailAndPassword(email, pass);
        await cred.user.updateProfile({ displayName: name });
        let profileData = null;
        if(type==='client'){
          const inv = await storageGet('clientInvites/'+inviteCode);
          if(!inv || inv.active===false || !inv.companyId){
            await cred.user.delete().catch(()=>{});
            showErr('Şirket davet kodu geçersiz veya artık aktif değil.'); submitBtn.disabled=false; return;
          }
          profileData = {name,email,role:'client',companyId:inv.companyId,inviteCode,createdAt:todayStr()};
        }else{
          const inv = await storageGet('staffInvites/'+inviteCode);
          if(!inv || inv.active===false || !inv.role || !DEFAULT_STAGES.includes(inv.role)){
            await cred.user.delete().catch(()=>{});
            showErr('Personel davet kodu geçersiz veya artık aktif değil.'); submitBtn.disabled=false; return;
          }
          profileData = {name,email,role:inv.role,inviteCode,createdAt:todayStr()};
        }
        const ok = await storageSet('users/'+cred.user.uid, profileData);
        if(!ok){
          await cred.user.delete().catch(()=>{});
          showErr('Hesap profili oluşturulamadı. Davet kodunu kontrol edin.'); submitBtn.disabled=false; return;
        }
        state.currentUser = name; state.currentUserUid = cred.user.uid; state.currentUserRole = profileData.role;
        state.clientCompanyId = profileData.companyId || null;
      } else {
        const cred = await fbAuth.signInWithEmailAndPassword(email, pass);
        const profile = await storageGet('users/'+cred.user.uid);
        if(!profile || !profile.role){
          await fbAuth.signOut();
          showErr('Bu hesabın uygulama erişim profili yok. Yöneticiyle görüşün.'); submitBtn.disabled=false; return;
        }
        state.currentUser = profile.name || cred.user.displayName || email;
        state.currentUserUid = cred.user.uid;
        state.currentUserRole = profile.role;
        state.clientCompanyId = profile.companyId || null;
      }
      state.loading = true; render(); loadLocalPrefs(); await loadAll();
    }catch(e){ console.error('auth error',e); showErr(friendlyError(e.code)); submitBtn.disabled=false; }
  };
  submitBtn.addEventListener('click', doSubmit);
  passInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doSubmit(); });
}

      <div class="value">${sel ? escapeHtml(sel.name) : 'Seçilmedi'}</div>
    </div>
    <div class="nav">
      ${items.map(it => `
        <div class="nav-item ${state.view===it.id?'active':''}" data-nav="${it.id}">
          <span class="nav-icon">${it.icon}</span><span class="label-text">${it.label}</span>
          ${it.badge ? `<span class="nav-badge">${it.badge}</span>` : ''}
        </div>`).join('')}
    </div>
    <div class="sidebar-footer">Veriler otomatik olarak kaydedilir.</div>
  </div>`;
}

function renderView(){
  switch(state.view){
    case 'companies': return renderCompaniesView();
    case 'parts': return renderPartsView();
    case 'tracking': return renderTrackingView();
    case 'quality': return renderQualityView();
    case 'errortracking': return renderErrorTrackingView();
    case 'dashboard': return renderDashboardView();
    case 'reports': return renderReportsView();
    case 'access': return renderAccessView();
    default: return '';
  }
}

/* ============================= COMPANIES VIEW ============================= */

  return `
    <div class="page-head">
      <div>
        <div class="page-title">Şirketler</div>
        <div class="page-sub">Her şirketin parça verileri birbirinden tamamen bağımsızdır. Sabitlemek için 📌 ikonuna tıklayın.</div>
      </div>
      ${isAdmin() ? `<button class="btn btn-primary" data-action="openAddCompany">+ Şirket Ekle</button>` : ''}
    </div>
    ${companies.length===0 ? `
      <div class="empty-state">
        <div class="ico">&#127970;</div>
        <h3>Henüz şirket eklenmedi</h3>
        <p>${isAdmin() ? 'Başlamak için ilk şirketinizi ekleyin, ardından parça listesini yükleyin.' : 'Henüz şirket eklenmemiş. Bu işlemi yalnızca Kalite Kontrol yetkilisi yapabilir.'}</p>
        ${isAdmin() ? `<button class="btn btn-primary" data-action="openAddCompany">+ Şirket Ekle</button>` : ''}
      </div>
    ` : `
      <div class="company-grid">
        ${companies.map(c=>{
          const t = companyTotals(c.id);
          const isSel = c.id === state.selectedCompanyId;

          return `
          <div class="card company-card ${isSel?'selected':''}" data-select-company="${c.id}">
            <div class="pin-btn ${isPinned?'pinned':''}" data-pin-company="${c.id}" title="${isPinned?'Sabitlemeyi kaldır':'En üste sabitle'}">${isPinned?'📌':'📍'}</div>
            ${isSel ? '<div class="badge-selected">Seçili</div>' : (isAdmin() ? `
            <div class="actions">
              <div class="icon-btn" data-edit-company="${c.id}" title="Düzenle">&#9998;</div>
              <div class="icon-btn danger" data-delete-company="${c.id}" title="Sil">&#128465;</div>
            </div>` : '')}
            <h3>${escapeHtml(c.name)}</h3>
            <div class="meta">Eklendi: ${c.createdAt}</div>
            <div class="stats">
              <div class="stat">Parça<b>${fmtNum(t.partCount)}</b></div>
              <div class="stat">Sipariş<b>${fmtNum(t.ordered)}</b></div>
              <div class="stat">Sevk<b>${fmtNum(t.shipped)}</b></div>
              <div class="stat">Ret<b style="color:var(--red-700);">${fmtNum(t.rejected)}</b></div>
            </div>
            ${!isSel ? `<div style="margin-top:12px;"><button class="btn btn-ghost btn-sm" data-select-company-btn="${c.id}">Seç ve Çalış</button></div>` : (isAdmin() ? `
            <div style="display:flex;gap:6px;margin-top:12px;">
              <button class="btn btn-ghost btn-sm" data-edit-company="${c.id}">Düzenle</button>
              <button class="btn btn-danger-ghost btn-sm" data-delete-company="${c.id}">Sil</button>
            </div>` : '')}
          </div>`;
        }).join('')}
      </div>
    `}
  `;
}

/* ============================= PARTS VIEW ============================= */
function renderPartsView(){
  const company = getCompany(state.selectedCompanyId);
  if(!company) return renderNoCompanySelected();
  const stages = company.stages;
  const monthKey = activeMonthKey(company.id);
  let parts = getMonthParts(company.id, monthKey);
  const rawMonthParts = parts.slice();
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    parts = parts.filter(p => (p.partNo||'').toLowerCase().includes(q) || (p.partName||'').toLowerCase().includes(q));
  }
  if(state.drawingFilter==='missing') parts = parts.filter(p => !(p.drawings && p.drawings.length));
  if(state.drawingFilter==='has') parts = parts.filter(p => p.drawings && p.drawings.length);
  if(state.shipmentFilter==='active') parts = parts.filter(p => partStatus(p, stages)!=='shipped');
  if(state.shipmentFilter==='shipped') parts = parts.filter(p => partStatus(p, stages)==='shipped');
  parts = sortWithPinned(parts, state.pinnedParts);
  const missingDrawingCount = rawMonthParts.filter(p => !(p.drawings && p.drawings.length)).length;
  const shippedCount = rawMonthParts.filter(p => partStatus(p, stages)==='shipped').length;
  const activeCount = rawMonthParts.length - shippedCount;
  return `
    <div class="page-head">
      <div>
        <div class="page-title">Parçalar <span style="color:var(--gray-500);font-size:19px;">— ${escapeHtml(company.name)}</span></div>
        <div class="page-sub">${fmtNum(rawMonthParts.length)} parça · ${escapeHtml(monthLabel(monthKey))} · Proses: ${stages.map(escapeHtml).join(' → ')}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${isAdmin() ? `
        <button class="btn btn-ghost" data-action="openStages">Proses Aşamaları</button>
        <button class="btn btn-ghost" data-action="openDrawingTrash">&#128465; Çöp Kutusu${state.drawingTrash.length?` (${state.drawingTrash.length})`:''}</button>
        <button class="btn btn-navy" data-action="openImport">&#128228; Excel / CSV Yükle</button>
        <button class="btn btn-navy" data-action="openBulkDrawings">&#128193; Teknik Resimleri Toplu Yükle</button>
        <button class="btn btn-primary" data-action="openAddPart">+ Parça Ekle</button>
        ` : ''}
      </div>
    </div>
    ${renderCompanyMonthBar(company)}
    <div class="toolbar">
      <div class="search-box"><input type="text" id="searchInput" placeholder="Parça no veya adı ile ara…" value="${escapeHtml(state.search)}"/></div>
      <select class="filter-select" id="shipmentFilterSelect">
        <option value="all" ${state.shipmentFilter==='all'?'selected':''}>Tüm Durumlar (${rawMonthParts.length})</option>
        <option value="active" ${state.shipmentFilter==='active'?'selected':''}>Aktif / Sevk Edilmemiş (${activeCount})</option>
        <option value="shipped" ${state.shipmentFilter==='shipped'?'selected':''}>Sadece Sevk Edilen (${shippedCount})</option>
      </select>
      <select class="filter-select" id="drawingFilterSelect">
        <option value="all" ${state.drawingFilter==='all'?'selected':''}>Tüm Teknik Resimler</option>
        <option value="missing" ${state.drawingFilter==='missing'?'selected':''}>Teknik Resmi Olmayanlar ${missingDrawingCount?`(${missingDrawingCount})`:''}</option>
        <option value="has" ${state.drawingFilter==='has'?'selected':''}>Teknik Resmi Olanlar</option>
      </select>
    </div>
    ${parts.length===0 ? `
      <div class="empty-state">
        <div class="ico">&#128230;</div>
        <h3>${rawMonthParts.length===0 ? `${escapeHtml(monthLabel(monthKey))} için henüz parça yok` : 'Sonuç bulunamadı'}</h3>
        <p>${rawMonthParts.length===0 ? (isAdmin() ? 'Bu aya parça ekleyin veya Excel/CSV yükleyin. Diğer ayların siparişleri ayrı tutulur.' : 'Bu ay için henüz parça kaydı yok.') : 'Arama kriterlerinizi değiştirin.'}</p>
        ${rawMonthParts.length===0 && isAdmin() ? `<button class="btn btn-primary" data-action="openAddPart">+ Bu Aya Parça Ekle</button>` : ''}
      </div>
    ` : `
      ${state.selectedPartIds.size>0 && isAdmin() ? `
      <div class="bulk-bar">
        <span class="bulk-count"><b>${state.selectedPartIds.size}</b> parça seçili</span>
        <div class="spacer"></div>
        <button class="btn btn-ghost btn-sm" data-action="openBulkRename">Toplu İsim Değiştir</button>
        <button class="btn btn-ghost btn-sm" data-action="clearSelection">Seçimi Temizle</button>
      </div>` : ''}
      <div style="overflow-x:auto;">
      <table class="data-table">
        <thead><tr>
          <th style="width:30px;"></th>
          ${isAdmin() ? `<th class="row-check"><input type="checkbox" class="sel-check" id="selectAllCheck" ${parts.length>0 && parts.every(p=>state.selectedPartIds.has(p.id))?'checked':''}/></th>` : ''}
          <th>Parça No</th><th>Parça Adı</th><th>Mevcut Aşama</th><th>Termin</th><th>İstenen</th><th>${escapeHtml(stages[stages.length-1])}</th><th>Ret</th><th>Kalan</th><th>İlerleme</th><th>Durum</th><th>Son Güncelleme</th><th></th>
        </tr></thead>
        <tbody>
          ${parts.map(p=>{
            const remaining = partRemaining(p, stages);
            const status = partStatus(p, stages);
            const shipped = Number((p.qtys||{})[stages[stages.length-1]]||0);
            const reject = partTotalReject(p);
            const pct = p.orderedQty>0 ? Math.min(100, Math.round(shipped/p.orderedQty*100)) : 0;
            const statusLabel = status==='shipped'?'Sevk Edildi':status==='progress'?'Üretimde':'Başlamadı';
            const openNcr = (p.ncrs||[]).filter(n=>n.status==='acik').length;
            const curIdx = getCurrentStageIndex(p, stages);
            const curStage = curIdx>=0 && status!=='shipped' ? stages[curIdx] : null;
            const curEntry = curStage ? getStageLastEntry(p, curStage) : null;
            const curDays = curEntry ? daysSince(curEntry.date) : null;
            const isPinned = state.pinnedParts.includes(p.id);
            return `
            <tr class="part-row-clickable" data-row-part="${p.id}" data-row-company="${company.id}">
              <td><span class="part-row-pin ${isPinned?'pinned':''}" data-pin-part="${p.id}" title="${isPinned?'Sabitlemeyi kaldır':'En üste sabitle'}">${isPinned?'📌':'📍'}</span></td>
              ${isAdmin() ? `<td class="row-check"><input type="checkbox" class="sel-check part-check" data-part-check="${p.id}" ${state.selectedPartIds.has(p.id)?'checked':''}/></td>` : ''}
              <td><span class="part-no-tag">${escapeHtml(p.partNo)}</span>${openNcr?` <span title="Açık uygunsuzluk kaydı" style="color:var(--red-600);font-weight:700;font-size:11px;">⚠ ${openNcr}</span>`:''}${(p.drawings&&p.drawings.length)?` <span title="${p.drawings.length} teknik resim eklendi" class="drawing-attach-icon">&#128206; ${p.drawings.length}</span>`:''}</td>
              <td>${p.partName ? escapeHtml(p.partName) : '<span style="color:var(--gray-500);font-style:italic;">(isim yok)</span>'}</td>
              <td>${curStage ? `<b style="color:var(--navy-800);">${escapeHtml(curStage)}</b>${curDays!=null?`<div class="helper-text" style="margin:0;">${curDays} gündür</div>`:''}` : '<span style="color:var(--gray-500);">—</span>'}</td>
              <td>${p.dueDate ? `<span style="font-size:12px;font-weight:700;color:${dueDateStatus(p.dueDate)==='overdue'?'var(--red-700)':dueDateStatus(p.dueDate)==='soon'?'var(--red-600)':'var(--gray-700)'};">${fmtDueDate(p.dueDate)}</span>` : '<span style="color:var(--gray-500);">—</span>'}</td>
              <td class="mono">${fmtNum(p.orderedQty)}</td>
              <td class="mono">${fmtNum(shipped)}</td>
              <td class="mono" style="color:${reject>0?'var(--red-700)':'var(--gray-500)'};font-weight:700;">${fmtNum(reject)}</td>
              <td class="mono" style="color:${remaining>0?'var(--red-700)':'var(--gray-500)'};font-weight:700;">${fmtNum(remaining)}</td>
              <td style="width:110px;"><div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div></td>
              <td><span class="status-badge ${status}"><span class="status-dot"></span>${statusLabel}</span></td>
              <td style="font-size:11.5px;color:var(--gray-500);white-space:nowrap;">${p.lastUpdate||'—'}${p.updatedBy?`<div class="helper-text" style="margin:0;">${escapeHtml(p.updatedBy)}</div>`:''}</td>
              <td><div class="row-actions">${isAdmin()?`<div class="icon-btn" data-edit-part="${p.id}" title="Düzenle">&#9998;</div><div class="icon-btn danger" data-delete-part="${p.id}" title="Sil">&#128465;</div>`:''}</div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      </div>
    `}
  `;
}

/* ============================= TRACKING VIEW ============================= */
function renderTrackingView(){
  const company = getCompany(state.selectedCompanyId);
  if(!company) return renderNoCompanySelected();
  const stages = company.stages;
  const monthKey = activeMonthKey(company.id);
  const parts = getMonthParts(company.id, monthKey);
  if(parts.length===0){
    return `
      <div class="page-head"><div><div class="page-title">Üretim Takibi</div><div class="page-sub">${escapeHtml(company.name)} · ${escapeHtml(monthLabel(monthKey))}</div></div></div>
      ${renderCompanyMonthBar(company)}
      <div class="empty-state">
        <div class="ico">&#128295;</div><h3>Bu ay takip edilecek parça yok</h3>
        <p>Önce bu aya parça ekleyin veya başka bir ay seçin.</p>
        <button class="btn btn-primary" data-action="gotoParts">Parçalara Git</button>
      </div>`;
  }
  const partId = state.selectedPartId && parts.find(p=>p.id===state.selectedPartId) ? state.selectedPartId : parts[0].id;
  state.selectedPartId = partId;
  const part = parts.find(p=>p.id===partId);
  const remaining = partRemaining(part, stages);
  const reject = partTotalReject(part);
  const currentIdx = getCurrentStageIndex(part, stages);
  const currentStageName = currentIdx>=0 ? stages[currentIdx] : null;
  const currentEntry = currentStageName ? getStageLastEntry(part, currentStageName) : null;
  const daysInStage = currentEntry ? daysSince(currentEntry.date) : null;
  const isShippedFully = remaining===0 && Number(part.orderedQty||0)>0;
  const pinnedPartsInCompany = sortWithPinned(parts, state.pinnedParts);

  return `
    <div class="page-head">
      <div>
        <div class="page-title">Üretim Takibi</div>
        <div class="page-sub">${escapeHtml(company.name)} · ${escapeHtml(monthLabel(monthKey))} — en son adet girişi yapılan proses “ŞU AN BURADA” olarak gösterilir</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;position:relative;flex-wrap:wrap;">
        <select class="filter-select" id="shipmentFilterSelect" title="Parça durum filtresi"><option value="all" ${state.shipmentFilter==='all'?'selected':''}>Tüm Durumlar</option><option value="active" ${state.shipmentFilter==='active'?'selected':''}>Aktif / Sevk Edilmemiş</option><option value="shipped" ${state.shipmentFilter==='shipped'?'selected':''}>Sevk Edilen</option></select>
        <div class="part-search-wrap">
          <input type="text" class="stage-select" id="partSearchInput" placeholder="Parça no veya adı yazın…" value="" autocomplete="off"/>
          <div class="part-search-dropdown" id="partSearchDropdown" style="display:${state.partSearchOpen?'block':'none'};">
            ${pinnedPartsInCompany.filter(p=>{
              if(state.shipmentFilter==='active' && partStatus(p,stages)==='shipped') return false;
              if(state.shipmentFilter==='shipped' && partStatus(p,stages)!=='shipped') return false;
              const q = state.partSearchQuery.trim().toLowerCase();
              if(!q) return true;
              return (p.partNo||'').toLowerCase().includes(q) || (p.partName||'').toLowerCase().includes(q);
            }).map(p=>`
              <div class="part-search-item ${p.id===part.id?'active':''}" data-search-select-part="${p.id}">
                <span class="part-no-tag">${escapeHtml(p.partNo)}</span>
                <span class="psi-name">${escapeHtml(p.partName||'(isim yok)')}</span>
                ${state.pinnedParts.includes(p.id)?'<span class="psi-pin">📌</span>':''}
              </div>`).join('') || `<div class="part-search-empty">Eşleşen parça yok</div>`}
          </div>
        </div>
        <button class="btn btn-primary btn-sm" data-action="openAddPart" style="white-space:nowrap;" ${!isAdmin()?'disabled':''}>+ Parça Ekle</button>
      </div>
    </div>
    ${renderCompanyMonthBar(company,true)}

    <div class="card" style="padding:20px;">
      <div class="helper-text" style="margin:-6px 0 14px 0;">Seçili parça: <b style="color:var(--navy-800);font-style:normal;">${escapeHtml(part.partNo)} — ${part.partName?escapeHtml(part.partName):'(isim yok)'}</b></div>
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
        <div>
          <div style="font-family:var(--font-mono);font-size:13px;color:var(--navy-800);font-weight:700;">${escapeHtml(part.partNo)}</div>
          <div style="font-family:var(--font-display);font-size:23px;font-weight:700;color:var(--navy-900);">${part.partName ? escapeHtml(part.partName) : '<span style="color:var(--gray-500);font-style:italic;">(isim girilmedi)</span>'}</div>
          <div class="helper-text" style="margin:4px 0 0;">Sipariş ayı: ${escapeHtml(monthLabel(inferPartMonth(part)))}</div>
        </div>
        <div style="display:flex;gap:22px;text-align:right;">
          <div><div class="helper-text" style="margin:0;">İstenen</div><div class="mono" style="font-size:18px;font-weight:700;color:var(--navy-800);">${fmtNum(part.orderedQty)}</div></div>
          <div><div class="helper-text" style="margin:0;">Toplam Ret</div><div class="mono" style="font-size:18px;font-weight:700;color:var(--red-700);">${fmtNum(reject)}</div></div>
          <div><div class="helper-text" style="margin:0;">Kalan</div><div class="mono" style="font-size:18px;font-weight:700;color:${remaining>0?'var(--red-700)':'var(--gray-500)'};">${fmtNum(remaining)}</div></div>
        </div>
      </div>
      <div style="margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        ${isShippedFully ? `<span class="status-badge shipped"><span class="status-dot"></span>Sevk Edildi</span>`
          : currentStageName ? `<span class="status-badge progress"><span class="status-dot"></span>Şu an: ${escapeHtml(currentStageName)}${daysInStage!=null ? ` · son giriş ${daysInStage} gün önce` : ''}</span>`
          : `<span class="status-badge notstarted"><span class="status-dot"></span>Henüz üretime başlanmadı</span>`}
        ${part.dueDate ? `<span class="status-badge ${dueDateStatus(part.dueDate)==='overdue'?'progress':dueDateStatus(part.dueDate)==='soon'?'progress':'notstarted'}"><span class="status-dot"></span>Termin: ${fmtDueDate(part.dueDate)}</span>` : ''}
        ${(part.returnEvents||[]).length ? `<span class="status-badge bad"><span class="status-dot"></span>${part.returnEvents.length} proses geri dönüşü</span>` : ''}
      </div>

      <div class="field">
        <label>Teknik Resimler ${part.drawings&&part.drawings.length?`(${part.drawings.length})`:''}</label>
        ${part.drawings && part.drawings.length ? `
          <div class="drawing-gallery">
            ${part.drawings.map((d,i)=> `
              <div class="drawing-box">
                ${d.type && d.type.startsWith('image/') ?
                  `<img src="${d.data}" class="drawing-thumb" data-view-drawing="${part.id}" data-drawing-idx="${i}"/>` :
                  `<div class="drawing-file-icon" data-view-drawing="${part.id}" data-drawing-idx="${i}">&#128196;</div>`}
                <div class="drawing-info"><div class="fname">${escapeHtml(d.name)}</div><div class="helper-text" style="margin:2px 0 0 0;">Görüntülemek için tıklayın</div></div>
                ${isAdmin() ? `<button class="btn btn-danger-ghost btn-sm" data-remove-drawing="${part.id}" data-drawing-idx="${i}">Kaldır</button>` : ''}
              </div>`).join('')}
          </div>
        ` : (!isAdmin() ? `<div class="helper-text" style="margin:0 0 8px 0;">Henüz teknik resim eklenmedi.</div>` : '')}
        ${isAdmin() ? `
          <div class="drop-zone" id="drawingDropZone" style="padding:16px;margin-top:${part.drawings&&part.drawings.length?'10px':'0'};">
            <div class="dz-text">${part.drawings&&part.drawings.length ? 'Başka teknik resim eklemek için tıklayın' : 'Teknik resim yüklemek için tıklayın'}</div>
            <div class="dz-sub">.png, .jpg veya .pdf — dosya başına en fazla 3 MB</div>
            <input type="file" id="drawingFileInput" accept=".png,.jpg,.jpeg,.pdf" multiple style="display:none;"/>
          </div>
        ` : ''}
      </div>

      <div class="field">
        <label>Malzeme Rengi (opsiyonel)</label>
        <input type="text" id="partColorTrackInput" placeholder="Örn. RAL 9005 Siyah — boyanmıyorsa boş bırakın" value="${escapeHtml(part.color||'')}" ${!isAdmin()?'disabled':''}/>
      </div>

      <div class="pipeline" id="pipelineWrap">
        ${stages.map((s,i)=>{
          const stageDraft=(state.stageDrafts[part.id]||{});
          const rejectDraft=(state.rejectDrafts[part.id]||{});
          const val = Object.prototype.hasOwnProperty.call(stageDraft,s) ? Number(stageDraft[s]||0) : Number((part.qtys||{})[s]||0);
          const rej = Object.prototype.hasOwnProperty.call(rejectDraft,s) ? Number(rejectDraft[s]||0) : Number((part.rejects||{})[s]||0);
          const pct = part.orderedQty>0 ? Math.min(100, Math.round(val/part.orderedQty*100)) : 0;
          const isFinal = i === stages.length-1;
          const editable = canEditStage(s);
          const lastEntry = getStageLastEntry(part, s);
          const isCurrent = i === currentIdx && !isShippedFully;
          return `
          <div class="pipeline-stage ${isFinal?'final':''} ${!editable?'locked':''} ${isCurrent?'current':''}">
            ${isCurrent ? `<div class="current-badge">ŞU AN BURADA</div>` : ''}
            <div class="stage-name">${escapeHtml(s)}${!editable?' 🔒':''}</div>
            <input class="stage-input" type="number" min="0" data-stage-input="${escapeHtml(s)}" value="${val}" ${!editable?'disabled title="Bu aşamayı sadece ilgili istasyon veya yönetici güncelleyebilir"':''}/>
            <div class="reject-row"><label>Ret</label><input class="reject-input" type="number" min="0" data-reject-input="${escapeHtml(s)}" value="${rej}" ${!editable?'disabled':''}/></div>
            <div class="stage-bar"><div class="stage-bar-fill" style="width:${pct}%;"></div></div>
            <div class="stage-meta">${lastEntry ? `${escapeHtml(lastEntry.date)}<br/>${escapeHtml(lastEntry.user||'—')}` : 'Henüz giriş yok'}</div>
          </div>`;
        }).join('')}

// bellekteki state'e aktarır. Böylece "ölçüm ekle" gibi butonlar diğer alanlardaki yazılanları silmez.
function syncTrackingFormToState(){
  const company = getCompany(state.selectedCompanyId);
  if(!company) return;
  const part = getParts(company.id).find(p=>p.id===state.selectedPartId);
  if(!part) return;
  state.stageDrafts[part.id]=state.stageDrafts[part.id]||{};
  state.rejectDrafts[part.id]=state.rejectDrafts[part.id]||{};
  document.querySelectorAll('[data-stage-input]').forEach(inp=>{
    if(inp.disabled) return;
    const stage=inp.getAttribute('data-stage-input');
    state.stageDrafts[part.id][stage]=Math.max(0,Number(inp.value)||0);
  });
  document.querySelectorAll('[data-reject-input]').forEach(inp=>{
    if(inp.disabled) return;
    const stage=inp.getAttribute('data-reject-input');
    state.rejectDrafts[part.id][stage]=Math.max(0,Number(inp.value)||0);
  });
  const noteEl = document.getElementById('partNoteInput');
  if(noteEl && !noteEl.disabled) part.note = noteEl.value;
  const colorEl = document.getElementById('partColorTrackInput');
  if(colorEl && !colorEl.disabled) part.color = colorEl.value.trim();
  part.measurements = part.measurements || [];
  document.querySelectorAll('[data-meas-value]').forEach(inp=>{
    if(inp.disabled) return;
    const m = part.measurements.find(x=>x.id===inp.getAttribute('data-meas-value'));
    if(m) m.measuredValue = inp.value===''?'':parseDecimal(inp.value);
  });
  document.querySelectorAll('[data-meas-nominal]').forEach(inp=>{
    if(inp.disabled) return;
    const m = part.measurements.find(x=>x.id===inp.getAttribute('data-meas-nominal'));
    if(m) m.nominalValue = inp.value===''?'':parseDecimal(inp.value);
  });
  document.querySelectorAll('[data-meas-tol]').forEach(inp=>{
    if(inp.disabled) return;
    const m = part.measurements.find(x=>x.id===inp.getAttribute('data-meas-tol'));
    if(m) m.tolerance = inp.value===''?'':parseDecimal(inp.value);
  });
}

/* ============================= TARİH / AŞAMA YARDIMCILARI ============================= */
function parseTRDate(str){
  if(!str) return null;
  const datePart = String(str).split(' ')[0];
  const bits = datePart.split('.').map(Number);
  if(bits.length<3 || bits.some(isNaN)) return null;
  const [d,m,y] = bits;
  return new Date(y, m-1, d);
}
function daysSince(dateStr){
  const d = parseTRDate(dateStr);
  if(!d) return null;
  const now = new Date();
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.max(0, Math.round((a - d) / (1000*60*60*24)));
}
function getStageLastEntry(part, stage){
  const hist = (part.history||[]).filter(h=>h.stage===stage && !h.reject);
  if(!hist.length) return null;
  return hist[hist.length-1];
}
function getCurrentStageIndex(part, stages){
  const hist = (part.history||[]).filter(h=>!h.reject && stages.includes(h.stage) && Number(h.qty)>0);
  if(hist.length){
    const last = hist[hist.length-1];
    return stages.indexOf(last.stage);
  }
  // Eski kayıtlarda history yoksa, önceki davranışa geri düş.
  let idx = -1;
  stages.forEach((s,i)=>{ if(Number((part.qtys||{})[s]||0) > 0) idx = i; });
  return idx;
}

/* ============================= TERMİN TARİHİ ============================= */
const STUCK_DAYS_THRESHOLD = 3; // bu süreden fazla aynı aşamada kalan parça "takıldı" sayılır
function daysUntilDue(dueDateStr){
  if(!dueDateStr) return null;
  const due = new Date(dueDateStr + 'T00:00:00');
  if(isNaN(due.getTime())) return null;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((due - today) / (1000*60*60*24));
}
function dueDateStatus(dueDateStr){
  const d = daysUntilDue(dueDateStr);
  if(d===null) return null;
  if(d < 0) return 'overdue';
  if(d <= 3) return 'soon';
  return 'ok';
}
function fmtDueDate(dueDateStr){
  const d = daysUntilDue(dueDateStr);
  if(d===null) return '';
  if(d < 0) return `${Math.abs(d)} gün gecikti`;
  if(d === 0) return 'Bugün';
  return `${d} gün kaldı`;
}

/* ============================= UYARI / ANALİZ TOPLAMA ============================= */
function collectStuckParts(){
  const out = [];
  visibleCompanies().forEach(c=>{
    getParts(c.id).forEach(p=>{
      const stages = c.stages;
      const status = partStatus(p, stages);
      if(status==='shipped') return;
      const idx = getCurrentStageIndex(p, stages);
      if(idx<0) return;
      const stage = stages[idx];
      const entry = getStageLastEntry(p, stage);
      const days = entry ? daysSince(entry.date) : null;
      if(days!=null && days >= STUCK_DAYS_THRESHOLD){
        out.push({company:c, part:p, stage, days});
      }
    });
  });
  return out.sort((a,b)=> b.days - a.days);
}
function collectDueSoonParts(){
  const out = [];
  visibleCompanies().forEach(c=>{
    getParts(c.id).forEach(p=>{
      if(!p.dueDate) return;
      const status = partStatus(p, c.stages);
      if(status==='shipped') return;
      const d = daysUntilDue(p.dueDate);
      if(d!=null && d<=3){
        out.push({company:c, part:p, days:d});
      }
    });
  });
  return out.sort((a,b)=> a.days - b.days);
}
function collectUserActivity(){
  const map = {};
  visibleCompanies().forEach(c=>{
    getParts(c.id).forEach(p=>{
      (p.history||[]).forEach(h=>{
        const user = h.user || 'Bilinmiyor';
        if(!map[user]) map[user] = {count:0, qty:0, lastDate:''};
        map[user].count++;
        if(!h.reject) map[user].qty += Number(h.qty)||0;
        if(!map[user].lastDate || h.date > map[user].lastDate) map[user].lastDate = h.date;
      });
    });
  });
  return Object.entries(map).map(([user,v])=>({user, ...v})).sort((a,b)=> b.count - a.count);
}
function collectRejectTrend(days){
  // Son N gün için toplam ret adedi (history'deki reject:true kayıtlarından, günlük toplam)
  const byDate = {};
  visibleCompanies().forEach(c=>{
    getParts(c.id).forEach(p=>{
      (p.history||[]).forEach(h=>{
        if(!h.reject) return;
        const dateOnly = String(h.date).split(' ')[0];
        byDate[dateOnly] = (byDate[dateOnly]||0) + (Number(h.qty)||0);
      });
    });
  });
  const dates = Object.keys(byDate).sort((a,b)=>{
    const da = parseTRDate(a), db = parseTRDate(b);
    return (da||0) - (db||0);
  });
  return dates.slice(-days).map(d=>({date:d, value: byDate[d]}));
}
function collectRejectByStage(){
  const totals = {};
  visibleCompanies().forEach(c=>{
    getParts(c.id).forEach(p=>{
      c.stages.forEach(s=>{
        totals[s] = (totals[s]||0) + Number((p.rejects||{})[s]||0);
      });
    });
  });
  return Object.entries(totals).map(([stage,value])=>({stage,value})).sort((a,b)=>b.value-a.value);
}
