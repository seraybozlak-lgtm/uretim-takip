<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Üretim ve Kalite Takip Sistemi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --navy-950:#081226;
    --navy-900:#0D1F42;
    --navy-800:#163368;
    --navy-700:#1F4488;
    --navy-600:#2E5AA8;
    --navy-100:#E7ECF6;
    --navy-50:#F2F5FB;
    --red-800:#7C0F27;
    --red-700:#A31432;
    --red-600:#C81E3A;
    --red-500:#DB3B57;
    --red-100:#FBE3E7;
    --gray-50:#F5F6F8;
    --gray-100:#ECEEF2;
    --gray-200:#DFE2E9;
    --gray-300:#C7CCD6;
    --gray-500:#7C8494;
    --gray-700:#3A4152;
    --gray-900:#181D28;
    --white:#FFFFFF;
    --font-display:'Times New Roman', Times, serif;
    --font-body:'Times New Roman', Times, serif;
    --font-mono:'Times New Roman', Times, serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-body);
    background:var(--gray-50);
    color:var(--gray-900);
  }
  #app{display:flex;min-height:100vh;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:224px;
    flex-shrink:0;
    background:linear-gradient(180deg,var(--navy-950) 0%, var(--navy-900) 100%);
    color:var(--navy-100);
    display:flex;
    flex-direction:column;
    padding:0 0 16px 0;
  }
  .brand{
    padding:22px 20px 16px 20px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .brand-mark{
    font-family:var(--font-display);
    font-weight:700;
    font-size:23px;
    letter-spacing:0.3px;
    color:var(--white);
    line-height:1.15;
  }
  .brand-mark span{color:var(--red-500);}
  .brand-sub{
    font-size:11px;
    font-style:italic;
    letter-spacing:0.3px;
    color:var(--navy-100);
    opacity:0.6;
    margin-top:5px;
  }
  .user-pill{
    margin:14px 16px 0 16px;
    padding:10px 12px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:8px;
    font-size:12px;
    display:flex;justify-content:space-between;align-items:center;gap:8px;
  }
  .user-pill .who{overflow:hidden;}
  .user-pill .label{opacity:0.5;font-size:10px;letter-spacing:0.3px;margin-bottom:3px;}
  .user-pill .value{font-weight:700;font-size:14px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .user-pill .switch-user{font-size:10.5px;color:var(--red-500);cursor:pointer;white-space:nowrap;text-decoration:underline;}
  .company-pill{
    margin:8px 16px 6px 16px;
    padding:10px 12px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:8px;
    font-size:12px;
  }
  .company-pill .label{opacity:0.5;font-size:10px;margin-bottom:3px;}
  .company-pill .value{font-weight:700;font-size:14px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nav{margin-top:10px;display:flex;flex-direction:column;gap:2px;padding:0 10px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:7px;cursor:pointer;
    font-size:14.5px;font-weight:500;color:var(--navy-100);opacity:0.72;
    border-left:3px solid transparent;
    transition:background .15s,opacity .15s;
    user-select:none;
  }
  .nav-item:hover{background:rgba(255,255,255,0.05);opacity:1;}
  .nav-item.active{background:rgba(200,30,58,0.16);opacity:1;border-left:3px solid var(--red-500);color:var(--white);}
  .nav-icon{width:16px;text-align:center;font-size:14px;}
  .nav-badge{margin-left:auto;background:var(--red-600);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;}
  .sidebar-footer{margin-top:auto;padding:14px 20px 4px 20px;font-size:10.5px;font-style:italic;color:var(--navy-100);opacity:0.4;}

  /* ---------- MAIN ---------- */
  .main{flex:1;min-width:0;padding:28px 34px;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-title{font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--navy-900);line-height:1;}
  .page-sub{font-size:13px;color:var(--gray-500);margin-top:6px;font-style:italic;}
  .btn{
    font-family:var(--font-body);font-weight:700;font-size:13.5px;
    padding:9px 16px;border-radius:7px;border:none;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;
    transition:transform .1s, box-shadow .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--red-600);color:var(--white);}
  .btn-primary:hover{background:var(--red-700);}
  .btn-navy{background:var(--navy-800);color:var(--white);}
  .btn-navy:hover{background:var(--navy-900);}
  .btn-ghost{background:var(--white);color:var(--navy-800);border:1px solid var(--gray-300);}
  .btn-ghost:hover{border-color:var(--navy-700);}
  .btn-sm{padding:6px 11px;font-size:12.5px;}
  .btn-danger-ghost{background:var(--white);color:var(--red-700);border:1px solid var(--red-100);}
  .btn-danger-ghost:hover{background:var(--red-100);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .card{background:var(--white);border:1px solid var(--gray-200);border-radius:12px;}
  .empty-state{
    text-align:center;padding:70px 20px;color:var(--gray-500);
    border:1.5px dashed var(--gray-300);border-radius:12px;background:var(--white);
  }
  .empty-state .ico{font-size:34px;margin-bottom:10px;}
  .empty-state h3{font-family:var(--font-display);font-size:21px;color:var(--navy-800);margin:0 0 6px 0;font-weight:700;}
  .empty-state p{font-size:13.5px;margin:0 0 16px 0;}

  /* company grid */
  .company-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .company-card{
    padding:18px;cursor:pointer;position:relative;
    border-top:3px solid var(--navy-800);
    transition:box-shadow .15s, transform .1s;
  }
  .company-card:hover{box-shadow:0 6px 18px rgba(13,31,66,0.1);transform:translateY(-1px);}
  .company-card.selected{border-top-color:var(--red-600);box-shadow:0 6px 18px rgba(200,30,58,0.12);}
  .company-card h3{font-family:var(--font-display);font-size:21px;font-weight:700;color:var(--navy-900);margin:0 0 4px 0;}
  .company-card .meta{font-size:11.5px;color:var(--gray-500);font-style:italic;}
  .company-card .stats{display:flex;gap:14px;margin-top:12px;}
  .company-card .stat{font-size:11px;color:var(--gray-500);}
  .company-card .stat b{display:block;font-family:var(--font-mono);font-size:17px;color:var(--navy-800);font-weight:700;}
  .company-card .actions{position:absolute;top:12px;right:10px;display:flex;gap:4px;opacity:0;transition:opacity .15s;}
  .company-card:hover .actions{opacity:1;}
  .icon-btn{
    width:26px;height:26px;border-radius:6px;border:1px solid var(--gray-200);background:var(--white);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:var(--gray-700);
  }
  .icon-btn:hover{background:var(--gray-100);}
  .icon-btn.danger:hover{background:var(--red-100);color:var(--red-700);border-color:var(--red-100);}
  .badge-selected{position:absolute;top:12px;right:12px;background:var(--red-600);color:#fff;font-size:10px;font-weight:700;letter-spacing:.3px;padding:3px 8px;border-radius:20px;}

  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(8,18,38,0.55);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal{background:var(--white);border-radius:14px;width:100%;max-width:440px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-height:88vh;overflow-y:auto;}
  .modal.wide{max-width:660px;}
  .modal h2{font-family:var(--font-display);font-size:23px;font-weight:700;color:var(--navy-900);margin:0 0 4px 0;}
  .modal .modal-sub{font-size:13px;color:var(--gray-500);margin-bottom:18px;font-style:italic;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--gray-700);margin-bottom:5px;}
  .field input[type=text],.field input[type=number],.field textarea,.field select{
    width:100%;padding:9px 11px;border:1.5px solid var(--gray-300);border-radius:7px;
    font-family:var(--font-body);font-size:14px;color:var(--gray-900);background:var(--white);
  }
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--navy-700);}
  .field textarea{resize:vertical;min-height:60px;font-family:var(--font-body);}
  .field .radio-row{display:flex;gap:14px;margin-top:4px;}
  .field .radio-row label{display:flex;align-items:center;gap:6px;font-weight:400;font-size:13px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
  .modal-close{position:absolute;top:16px;right:18px;cursor:pointer;font-size:18px;color:var(--gray-500);}
  .modal-wrap-pos{position:relative;}

  /* login modal specific */
  .login-overlay{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy-950),var(--navy-800) 70%);display:flex;align-items:center;justify-content:center;z-index:300;}
  .login-box{background:var(--white);border-radius:14px;padding:36px 34px;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(0,0,0,0.4);border-top:5px solid var(--red-600);}
  .login-box .login-brand{font-family:var(--font-display);font-weight:700;font-size:26px;color:var(--navy-900);text-align:center;}
  .login-box .login-brand span{color:var(--red-600);}
  .login-box .login-sub{text-align:center;font-size:12.5px;color:var(--gray-500);font-style:italic;margin:6px 0 22px 0;}
  .login-box .field{margin-bottom:16px;}
  .login-note{font-size:11px;color:var(--gray-500);text-align:center;margin-top:10px;line-height:1.5;font-style:italic;}
  datalist{}

  /* toolbar */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .search-box{flex:1;min-width:200px;position:relative;}
  .search-box input{width:100%;padding:9px 12px 9px 32px;border:1.5px solid var(--gray-300);border-radius:7px;font-size:14px;font-family:var(--font-body);}
  .search-box::before{content:"⌕";position:absolute;left:11px;top:8px;color:var(--gray-500);font-size:15px;}
  .filter-select{padding:9px 11px;border:1.5px solid var(--gray-300);border-radius:7px;font-size:13.5px;font-family:var(--font-body);}

  /* table */
  table.data-table{width:100%;border-collapse:collapse;background:var(--white);border-radius:12px;overflow:hidden;border:1px solid var(--gray-200);}
  table.data-table thead th{
    background:var(--navy-900);color:var(--navy-100);text-align:left;padding:10px 12px;
    font-size:11.5px;font-weight:700;white-space:nowrap;letter-spacing:.2px;
  }
  table.data-table tbody td{padding:10px 12px;border-bottom:1px solid var(--gray-100);font-size:13.5px;vertical-align:middle;}
  table.data-table tbody tr:last-child td{border-bottom:none;}
  table.data-table tbody tr:hover{background:var(--navy-50);}
  .mono{font-family:var(--font-mono);}
  .part-no-tag{font-family:var(--font-mono);font-weight:700;color:var(--navy-800);background:var(--navy-100);padding:2px 8px;border-radius:5px;font-size:12.5px;}
  .row-actions{display:flex;gap:5px;}

  .status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .status-badge.shipped{background:var(--navy-100);color:var(--navy-800);}
  .status-badge.progress{background:var(--red-100);color:var(--red-700);}
  .status-badge.notstarted{background:var(--gray-100);color:var(--gray-500);}
  .status-badge.open{background:var(--red-100);color:var(--red-700);}
  .status-badge.closed{background:var(--navy-100);color:var(--navy-800);}
  .status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

  .progress-track{width:100%;height:6px;border-radius:4px;background:var(--gray-200);overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--navy-700),var(--red-600));border-radius:4px;}

  /* dashboard */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:26px;}
  .kpi-card{padding:18px 18px 16px 18px;border-radius:12px;background:var(--white);border:1px solid var(--gray-200);border-left:4px solid var(--navy-700);}
  .kpi-card.accent{border-left-color:var(--red-600);}
  .kpi-card .kpi-label{font-size:11.5px;color:var(--gray-500);font-weight:700;}
  .kpi-card .kpi-value{font-family:var(--font-mono);font-size:27px;font-weight:700;color:var(--navy-900);margin-top:6px;}
  .kpi-card .kpi-unit{font-size:12px;color:var(--gray-500);margin-left:4px;font-style:italic;}

  .section-title{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--navy-900);margin:26px 0 12px 0;}

  /* pipeline / stage flow */
  .pipeline{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 0 10px 0;}
  .pipeline-stage{
    flex:1;min-width:132px;position:relative;padding:14px 12px 12px 12px;background:var(--white);
    border:1px solid var(--gray-200);border-left:none;
  }
  .pipeline-stage:first-child{border-left:1px solid var(--gray-200);border-radius:10px 0 0 10px;}
  .pipeline-stage:last-child{border-radius:0 10px 10px 0;}
  .pipeline-stage .stage-name{font-size:11px;letter-spacing:.2px;color:var(--gray-500);font-weight:700;margin-bottom:8px;white-space:nowrap;}
  .pipeline-stage .stage-input{
    width:100%;border:1.5px solid var(--gray-300);border-radius:6px;padding:7px 8px;font-family:var(--font-mono);
    font-size:15px;font-weight:700;color:var(--navy-900);text-align:center;
  }
  .pipeline-stage .stage-input:focus{outline:none;border-color:var(--red-600);}
  .pipeline-stage .reject-row{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .pipeline-stage .reject-row label{font-size:10.5px;color:var(--red-700);font-weight:700;white-space:nowrap;}
  .pipeline-stage.locked{background:var(--gray-50);}
  .pipeline-stage.locked .stage-input,.pipeline-stage.locked .reject-input{background:var(--gray-100);color:var(--gray-500);cursor:not-allowed;}
  .pipeline-stage.current{border-color:var(--red-600);border-width:2px;box-shadow:0 0 0 1px var(--red-600);}
  .current-badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--red-600);color:#fff;font-size:8.5px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:10px;white-space:nowrap;}
  .stage-meta{font-size:9.5px;color:var(--gray-500);margin-top:7px;line-height:1.4;text-align:center;font-style:italic;}
  .pipeline-stage .reject-input{
    width:100%;border:1.5px solid var(--red-100);background:var(--red-100);border-radius:6px;padding:5px 6px;
    font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--red-700);text-align:center;
  }
  .pipeline-stage .reject-input:focus{outline:none;border-color:var(--red-600);}
  .pipeline-stage::after{
    content:"›";position:absolute;right:-11px;top:26px;
    font-size:20px;color:var(--gray-300);z-index:2;font-weight:700;
  }
  .pipeline-stage:last-child::after{content:"";}
  .pipeline-stage .stage-bar{height:4px;border-radius:3px;background:var(--gray-200);margin-top:8px;overflow:hidden;}
  .pipeline-stage .stage-bar-fill{height:100%;background:var(--navy-700);}
  .pipeline-stage.final .stage-bar-fill{background:var(--red-600);}
  .pipeline-stage.final .stage-name{color:var(--red-600);}

  .history-list{max-height:260px;overflow-y:auto;border:1px solid var(--gray-200);border-radius:10px;}
  .history-row{display:flex;justify-content:space-between;gap:8px;padding:9px 13px;font-size:12.5px;border-bottom:1px solid var(--gray-100);flex-wrap:wrap;}
  .history-row:last-child{border-bottom:none;}
  .history-row .h-date{color:var(--gray-500);font-family:var(--font-mono);font-size:11.5px;}
  .history-row .h-stage{font-weight:700;color:var(--navy-800);}
  .history-row .h-qty{font-family:var(--font-mono);font-weight:700;color:var(--red-700);}
  .history-row .h-user{font-size:11px;color:var(--gray-500);font-style:italic;}

  .tag-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--navy-50);border:1px solid var(--navy-100);
    padding:5px 10px 5px 12px;border-radius:20px;font-size:13px;color:var(--navy-800);font-weight:600;
  }
  .tag-chip .x{cursor:pointer;color:var(--red-600);font-weight:700;}
  .stage-chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .add-stage-row{display:flex;gap:8px;margin-top:12px;}
  .add-stage-row input{flex:1;}

  .helper-text{font-size:11.5px;color:var(--gray-500);margin-top:4px;line-height:1.5;font-style:italic;}
  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--navy-900);color:#fff;padding:12px 18px;border-radius:9px;
    font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.25);z-index:200;display:flex;align-items:center;gap:8px;
    border-left:3px solid var(--red-600);
  }
  .loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;width:100%;color:var(--gray-500);font-size:14px;font-style:italic;}
  .select-company-hint{padding:60px 20px;text-align:center;color:var(--gray-500);}
  .drop-zone{
    border:2px dashed var(--gray-300);border-radius:10px;padding:26px;text-align:center;cursor:pointer;
    background:var(--gray-50);transition:border-color .15s, background .15s;
  }
  .drop-zone:hover,.drop-zone.drag{border-color:var(--red-600);background:var(--red-100);}
  .drop-zone .dz-ico{font-size:26px;margin-bottom:6px;}
  .drop-zone .dz-text{font-size:13.5px;color:var(--gray-700);font-weight:600;}
  .drop-zone .dz-sub{font-size:11.5px;color:var(--gray-500);margin-top:3px;font-style:italic;}
  .preview-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px;}
  .preview-table th{background:var(--gray-100);padding:6px 9px;text-align:left;font-size:11px;color:var(--gray-500);}
  .preview-table td{padding:6px 9px;border-bottom:1px solid var(--gray-100);}
  .import-summary{display:flex;gap:16px;margin-top:12px;font-size:13px;}
  .import-summary b{color:var(--navy-800);}
  select.stage-select{padding:9px 11px;border:1.5px solid var(--gray-300);border-radius:7px;font-size:13.5px;min-width:220px;font-family:var(--font-body);}

  .bulk-bar{display:flex;align-items:center;gap:12px;background:var(--navy-900);color:var(--white);padding:10px 16px;border-radius:9px;margin-bottom:14px;flex-wrap:wrap;}
  .bulk-bar .bulk-count{font-weight:700;font-size:13.5px;}
  .bulk-bar .bulk-count b{color:var(--red-500);}
  .bulk-bar .spacer{flex:1;}
  .bulk-bar .btn-ghost{background:transparent;color:var(--white);border-color:rgba(255,255,255,0.3);}
  .bulk-bar .btn-ghost:hover{border-color:var(--white);}
  .row-check{width:34px;}
  input[type=checkbox].sel-check{width:16px;height:16px;cursor:pointer;accent-color:var(--red-600);}
  .radio-row-mode{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .radio-row-mode label{display:flex;align-items:center;gap:8px;font-weight:400;font-size:13.5px;cursor:pointer;}
  .bulk-preview{max-height:170px;overflow-y:auto;border:1px solid var(--gray-200);border-radius:8px;margin-top:10px;}
  .bulk-preview-row{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;font-size:12px;border-bottom:1px solid var(--gray-100);}
  .bulk-preview-row:last-child{border-bottom:none;}
  .bulk-preview-row .old{color:var(--gray-500);text-decoration:line-through;}
  .bulk-preview-row .new{color:var(--navy-800);font-weight:700;}

<body>
<div id="app"><div class="loading-screen">Yükleniyor…</div></div>

<script>
/* ============================= FIREBASE INIT (Auth + Realtime Database) ============================= */
const firebaseConfig = {
  apiKey: "AIzaSyDLSeefkn2FcBIuDgVQr9fh35VuxqBJVy0",
  authDomain: "seria-6efb4.firebaseapp.com",
  databaseURL: "https://seria-6efb4-default-rtdb.firebaseio.com",
  projectId: "seria-6efb4",
  storageBucket: "seria-6efb4.firebasestorage.app",
  messagingSenderId: "1084990408616",
  appId: "1:1084990408616:web:1cb7b53b392794fae3ff9d",
  measurementId: "G-M9J9HG6NNH"
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const FIREBASE_URL = firebaseConfig.databaseURL;

// Yönetici (Kalite Kontrol) rolüyle kayıt olabilmek için gereken kod.
const ADMIN_SIGNUP_CODE = 'formak1907';

async function getIdToken(){
  const user = fbAuth.currentUser;
  if(!user) return null;
  try{ return await user.getIdToken(); }catch(e){ return null; }
}
async function firebaseFetch(path, options){
  const token = await getIdToken();
  const sep = path.includes('?') ? '&' : '?';
  const url = `${FIREBASE_URL}/${path}.json${token ? sep+'auth='+token : ''}`;
  const res = await fetch(url, options);
  if(!res.ok) throw new Error('Firebase request failed: ' + res.status);
  return res;
}
async function storageGet(key){
  try{
    const res = await firebaseFetch(encodeURIComponent(key));
    const data = await res.json();
    return (data===null || data===undefined) ? null : data;
  }catch(e){
    console.error('storageGet error', e);
    return null;
  }
}
async function storageSet(key, value){
  try{
    const json = JSON.stringify(value);
    if(json.length > 9000000){
      showToast('Kayıt boyutu çok büyük. Teknik resim dosyalarını küçültün.');
      return false;
    }
    await firebaseFetch(encodeURIComponent(key), {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: json
    });
    return true;
  }catch(e){
    console.error('storage set error', e);
    return false;
  }
}
async function storageDelete(key){
  try{
    await firebaseFetch(encodeURIComponent(key), { method:'DELETE' });
  }catch(e){ console.error('storage delete error', e); }
}

const DEFAULT_STAGES = ['Kesim','Büküm','Kaynak','Taşlama','Boya','Montaj','Paketleme','Sevkiyat'];
// Örnekleme / kontrol sıklığı tablosu (kullanıcının verdiği tabloya göre)
const SAMPLING_TABLE = [
  {min:1,   max:3,     full:true},           // 1-3 arası -> %100 kontrol
  {min:4,   max:50,    num:1, per:10},       // 3-50 arası -> 1 adet / 10 adet
  {min:51,  max:150,   num:3, per:50},       // 51-150 arası -> 3 adet / 50 adet
  {min:151, max:500,   num:4, per:100},      // 151-500 arası -> 4 adet / 100 adet
  {min:501, max:3250,  num:5, per:250},      // 501-3250 arası -> 5 adet / 250 adet
  {min:3251,max:35000, num:6, per:500},      // 3201-35000 arası -> 6 adet / 500 adet
];
function calcSampleCount(orderedQty){
  const q = Number(orderedQty)||0;
  if(q<=0) return 0;
  let bracket = SAMPLING_TABLE.find(b => q>=b.min && q<=b.max);
  if(!bracket) bracket = q < SAMPLING_TABLE[0].min ? SAMPLING_TABLE[0] : SAMPLING_TABLE[SAMPLING_TABLE.length-1];
  if(bracket.full) return q;
  return Math.max(1, Math.ceil(q / bracket.per) * bracket.num);
}

function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
}
function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtNum(n){
  n = Number(n)||0;
  return n.toLocaleString('tr-TR');
}

/* ============================= STATE ============================= */
const ROLE_LIST = [...DEFAULT_STAGES]; // istasyon rolleri; ayrıca 'admin' özel rolü var
let state = {
  currentUser: null,        // görünen ad (kayıtlarda "kim güncelledi")
  currentUserUid: null,
  currentUserRole: null,    // 'admin' veya bir aşama adı (örn. 'Büküm')
  authView: 'login',        // login | signup
  companies: [],
  partsByCompany: {},
  selectedCompanyId: null,
  view: 'companies',        // companies | parts | tracking | quality | dashboard | reports
  selectedPartId: null,
  search: '',
  qualityFilter: 'acik',    // acik | kapali | hepsi
  modal: null,
  toast: null,
  loading: true,
  authChecking: true,
  importPreview: null,
  knownUsers: [],
  storageUnavailable: false,
  lastSaveFailed: false,
  selectedPartIds: new Set(),
  markingMeasurementId: null,
  bulkDrawingPreview: null,
};
function isAdmin(){ return state.currentUserRole === 'admin'; }
function canEditStage(stage){ return isAdmin() || state.currentUserRole === stage; }

function setState(patch){ Object.assign(state, patch); render(); }
function showToast(msg){
  state.toast = msg;
  render();
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ state.toast=null; render(); }, 2600);
}

/* ============================= DATA ACCESS ============================= */
function asArray(v){ return Array.isArray(v) ? v : []; }

async function loadAll(){
  try{
    const companiesRaw = await storageGet('companies');
    const companies = asArray(companiesRaw);
    state.companies = companies;
    companies.forEach(c => { if(c && (!c.stages || !c.stages.length)) c.stages = DEFAULT_STAGES.slice(); });
    const partsMap = {};
    for(const c of companies){
      if(!c || !c.id) continue;
      const partsRaw = await storageGet('parts:'+c.id);
      const parts = asArray(partsRaw);
      parts.forEach(p=>{ if(!p) return; if(!p.qtys) p.qtys={}; if(!p.rejects) p.rejects={}; if(!p.ncrs) p.ncrs=[]; if(!p.history) p.history=[]; if(p.drawing===undefined) p.drawing=null; if(p.color===undefined) p.color=''; if(!Array.isArray(p.measurements)) p.measurements=[]; if(!p.orderedQty) p.orderedQty = Number(p.orderedQty)||0; });
      partsMap[c.id] = parts;
    }
    state.partsByCompany = partsMap;
    const knownUsersRaw = await storageGet('known-users');
    state.knownUsers = asArray(knownUsersRaw).filter(u=>typeof u==='string');
    if(companies.length && !state.selectedCompanyId) state.selectedCompanyId = companies[0].id;
  }catch(e){
    console.error('loadAll fatal error', e);
    state.storageUnavailable = true;
    state.companies = asArray(state.companies);
    state.partsByCompany = state.partsByCompany || {};
    state.knownUsers = asArray(state.knownUsers);
  }
  state.loading = false;
  render();
}
async function persistCompanies(){
  state.lastSaveFailed = false;
  const ok = await storageSet('companies', state.companies);
  if(!ok && !state.storageUnavailable){ state.lastSaveFailed = true; render(); }
  return ok;
}
async function persistParts(companyId){
  state.lastSaveFailed = false;
  const ok = await storageSet('parts:'+companyId, state.partsByCompany[companyId] || []);
  if(!ok && !state.storageUnavailable){ state.lastSaveFailed = true; render(); }
  return ok;
}
async function persistKnownUsers(){ await storageSet('known-users', state.knownUsers); }

function getCompany(id){ return state.companies.find(c=>c.id===id); }
function getParts(companyId){ return state.partsByCompany[companyId] || []; }

/* ============================= COMPUTATIONS ============================= */
function partRemaining(part, stages){
  const last = stages[stages.length-1];
  const shipped = Number((part.qtys||{})[last]||0);
  return Math.max(0, Number(part.orderedQty||0) - shipped);
}
function partTotalReject(part){
  return Object.values(part.rejects||{}).reduce((a,b)=>a+(Number(b)||0),0);
}
function partStatus(part, stages){
  const last = stages[stages.length-1];
  const shipped = Number((part.qtys||{})[last]||0);
  const anyProgress = stages.some(s => Number((part.qtys||{})[s]||0) > 0);
  if(shipped >= Number(part.orderedQty||0) && Number(part.orderedQty||0) > 0) return 'shipped';
  if(anyProgress) return 'progress';
  return 'notstarted';
}
function companyTotals(companyId){
  const company = getCompany(companyId);
  const parts = getParts(companyId);
  const stages = company ? company.stages : DEFAULT_STAGES;
  const last = stages[stages.length-1];
  const prev = stages.length>1 ? stages[stages.length-2] : last;
  let ordered=0, shipped=0, completed=0, rejected=0, openNcr=0, closedNcr=0;
  parts.forEach(p=>{
    ordered += Number(p.orderedQty||0);
    shipped += Number((p.qtys||{})[last]||0);
    completed += Number((p.qtys||{})[prev]||0);
    rejected += partTotalReject(p);
    (p.ncrs||[]).forEach(n=> n.status==='acik' ? openNcr++ : closedNcr++);
  });
  return { partCount: parts.length, ordered, shipped, completed, rejected, openNcr, closedNcr, inProgress: Math.max(0, ordered - shipped) };
}
function allTotals(){
  let totals = {companyCount: state.companies.length, partCount:0, ordered:0, shipped:0, completed:0, inProgress:0, rejected:0, openNcr:0, closedNcr:0};
  state.companies.forEach(c=>{
    const t = companyTotals(c.id);
    totals.partCount += t.partCount; totals.ordered += t.ordered; totals.shipped += t.shipped;
    totals.completed += t.completed; totals.inProgress += t.inProgress; totals.rejected += t.rejected;
    totals.openNcr += t.openNcr; totals.closedNcr += t.closedNcr;
  });
  return totals;
}
function allOpenNcrCount(){
  let n=0;
  state.companies.forEach(c=> getParts(c.id).forEach(p=> (p.ncrs||[]).forEach(x=> { if(x.status==='acik') n++; })));
  return n;
}

/* ============================= RENDER ROOT ============================= */
function render(){
  const app = document.getElementById('app');
  if(state.authChecking){ app.innerHTML = '<div class="loading-screen">Oturum kontrol ediliyor…</div>'; return; }
  if(!state.currentUser){
    app.innerHTML = renderAuthScreen();
    attachAuthHandlers();
    return;
  }
  if(state.loading){ app.innerHTML = '<div class="loading-screen">Veriler yükleniyor…</div>'; return; }
  app.innerHTML = `
    ${renderSidebar()}
    <div class="main">
      ${state.storageUnavailable ? `<div class="storage-warning">&#9888; Firebase veritabanına bağlanılamadı — internet bağlantınızı kontrol edin veya veritabanı kurallarının (Rules) açık olduğundan emin olun.</div>` : ''}
      ${state.lastSaveFailed ? `<div class="storage-warning">&#9888; Son değişiklik kaydedilemedi. Lütfen tekrar deneyin veya sayfayı yenileyip son işlemi tekrar yapın.</div>` : ''}
      ${renderView()}
    </div>
    ${state.modal ? renderModal() : ''}
    ${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ''}
  `;
  attachHandlers();
}

/* ============================= LOGIN / SIGNUP (Firebase Authentication) ============================= */
function roleLabel(role){
  if(role==='admin') return 'Kalite Kontrol (Yönetici)';
  return role;
}
function renderAuthScreen(){
  const isSignup = state.authView === 'signup';
  return `
  <div class="login-overlay">
    <div class="login-box" style="max-width:420px;">
      <div class="login-brand">ÜRETİM<span>.</span>TAKİP</div>
      <div class="login-sub">${isSignup ? 'Yeni hesap oluşturun' : 'Hesabınızla giriş yapın'}</div>

      ${isSignup ? `
        <div class="field"><label>Ad Soyad</label><input type="text" id="authNameInput" placeholder="Örn. Ahmet Yılmaz" autocomplete="off"/></div>
        <div class="field"><label>E-posta</label><input type="email" id="authEmailInput" placeholder="ornek@sirket.com" autocomplete="off"/></div>
        <div class="field"><label>Şifre</label><input type="password" id="authPassInput" placeholder="En az 6 karakter" autocomplete="off"/></div>
        <div class="field">
          <label>İstasyon / Rol</label>
          <select id="authRoleInput">
            ${DEFAULT_STAGES.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')}
            <option value="admin">Kalite Kontrol (Yönetici)</option>
          </select>
        </div>
        <div class="field" id="adminCodeField" style="display:none;">
          <label>Yönetici Kodu</label>
          <input type="password" id="authAdminCodeInput" placeholder="Yönetici kaydı için gerekli kod" autocomplete="off"/>
        </div>
        <div id="authErrorMsg" style="color:var(--red-700);font-size:12.5px;font-weight:700;margin:-4px 0 14px 0;min-height:16px;"></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;" id="authSubmitBtn">Hesap Oluştur ve Gir</button>
        <div class="login-note">Zaten hesabın var mı? <a href="#" id="switchToLogin" style="color:var(--navy-700);font-weight:700;">Giriş yap</a></div>
      ` : `
        <div class="field"><label>E-posta</label><input type="email" id="authEmailInput" placeholder="ornek@sirket.com" autocomplete="off"/></div>
        <div class="field"><label>Şifre</label><input type="password" id="authPassInput" placeholder="Şifre" autocomplete="off"/></div>
        <div id="authErrorMsg" style="color:var(--red-700);font-size:12.5px;font-weight:700;margin:-4px 0 14px 0;min-height:16px;"></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;" id="authSubmitBtn">Giriş Yap</button>
        <div class="login-note">Hesabın yok mu? <a href="#" id="switchToSignup" style="color:var(--navy-700);font-weight:700;">Kayıt ol</a></div>
      `}
    </div>
  </div>`;
}
function attachAuthHandlers(){
  const isSignup = state.authView === 'signup';
  const emailInput = document.getElementById('authEmailInput');
  const passInput = document.getElementById('authPassInput');
  const submitBtn = document.getElementById('authSubmitBtn');
  const errEl = document.getElementById('authErrorMsg');
  if(emailInput) emailInput.focus();

  const switchLink = document.getElementById(isSignup ? 'switchToLogin' : 'switchToSignup');
  if(switchLink){
    switchLink.addEventListener('click', (e)=>{ e.preventDefault(); state.authView = isSignup ? 'login' : 'signup'; render(); });
  }

  const roleInput = document.getElementById('authRoleInput');
  const adminCodeField = document.getElementById('adminCodeField');
  if(roleInput && adminCodeField){
    roleInput.addEventListener('change', ()=>{
      adminCodeField.style.display = roleInput.value === 'admin' ? 'block' : 'none';
    });
  }

  const showErr = (msg)=>{ if(errEl) errEl.textContent = msg; };

  const friendlyError = (code)=>{
    if(code==='auth/email-already-in-use') return 'Bu e-posta zaten kayıtlı. Giriş yapmayı deneyin.';
    if(code==='auth/invalid-email') return 'Geçerli bir e-posta adresi girin.';
    if(code==='auth/weak-password') return 'Şifre en az 6 karakter olmalı.';
    if(code==='auth/user-not-found' || code==='auth/wrong-password' || code==='auth/invalid-credential') return 'E-posta veya şifre hatalı.';
    if(code==='auth/too-many-requests') return 'Çok fazla deneme yapıldı, biraz sonra tekrar deneyin.';
    return 'Bir hata oluştu, tekrar deneyin.';
  };

  const doSubmit = async ()=>{
    showErr('');
    const email = (emailInput.value||'').trim();
    const pass = passInput.value||'';
    if(!email || !pass){ showErr('E-posta ve şifre zorunludur.'); return; }
    submitBtn.disabled = true;
    try{
      if(isSignup){
        const name = (document.getElementById('authNameInput').value||'').trim();
        const role = document.getElementById('authRoleInput').value;
        const adminCode = (document.getElementById('authAdminCodeInput')?.value)||'';
        if(!name){ showErr('Ad soyad zorunludur.'); submitBtn.disabled=false; return; }
        if(role==='admin' && adminCode !== ADMIN_SIGNUP_CODE){ showErr('Yönetici kodu hatalı.'); submitBtn.disabled=false; return; }
        const cred = await fbAuth.createUserWithEmailAndPassword(email, pass);
        await cred.user.updateProfile({ displayName: name });
        // Profil/rol bilgisini veritabanına yaz
        const token = await cred.user.getIdToken();
        await fetch(`${FIREBASE_URL}/users/${cred.user.uid}.json?auth=${token}`, {
          method: 'PUT', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ name, email, role, createdAt: todayStr() })
        });
        state.currentUser = name; state.currentUserUid = cred.user.uid; state.currentUserRole = role;
      } else {
        const cred = await fbAuth.signInWithEmailAndPassword(email, pass);
        const token = await cred.user.getIdToken();
        const res = await fetch(`${FIREBASE_URL}/users/${cred.user.uid}.json?auth=${token}`);
        const profile = await res.json();
        state.currentUser = (profile && profile.name) || cred.user.displayName || email;
        state.currentUserUid = cred.user.uid;
        state.currentUserRole = (profile && profile.role) || null;
      }
      state.loading = true;
      render();
      await loadAll();
    }catch(e){
      console.error('auth error', e);
      showErr(friendlyError(e.code));
      submitBtn.disabled = false;
    }
  };
  submitBtn.addEventListener('click', doSubmit);
  passInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doSubmit(); });
}

function renderSidebar(){
  const items = [
    {id:'companies', icon:'&#127970;', label:'Şirketler'},
    {id:'parts', icon:'&#128230;', label:'Parçalar'},
    {id:'tracking', icon:'&#128295;', label:'Üretim Takibi'},
    {id:'quality', icon:'&#9878;', label:'Kalite Kontrol', badge: allOpenNcrCount()},
    {id:'dashboard', icon:'&#128202;', label:'Dashboard'},
    {id:'reports', icon:'&#128196;', label:'Raporlar'},
  ];
  const sel = getCompany(state.selectedCompanyId);
  return `
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">ÜRETİM<span>.</span>TAKİP</div>
      <div class="brand-sub">Şirket, Üretim &amp; Kalite Sistemi</div>
    </div>
    <div class="user-pill">
      <div class="who"><div class="label">${state.currentUserRole ? roleLabel(state.currentUserRole) : 'Kullanıcı'}</div><div class="value">${escapeHtml(state.currentUser)}</div></div>
      <div class="switch-user" data-action="switchUser">çıkış</div>
    </div>
    <div class="company-pill">
      <div class="label">Aktif Şirket</div>
      <div class="value">${sel ? escapeHtml(sel.name) : 'Seçilmedi'}</div>
    </div>
    <div class="nav">
      ${items.map(it => `
        <div class="nav-item ${state.view===it.id?'active':''}" data-nav="${it.id}">
          <span class="nav-icon">${it.icon}</span><span class="label-text">${it.label}</span>
          ${it.badge ? `<span class="nav-badge">${it.badge}</span>` : ''}
        </div>`).join('')}
    </div>
    <div class="sidebar-footer">Veriler otomatik olarak kaydedilir.</div>
  </div>`;
}

function renderView(){
  switch(state.view){
    case 'companies': return renderCompaniesView();
    case 'parts': return renderPartsView();
    case 'tracking': return renderTrackingView();
    case 'quality': return renderQualityView();
    case 'dashboard': return renderDashboardView();
    case 'reports': return renderReportsView();
    default: return '';
  }
}

/* ============================= COMPANIES VIEW ============================= */
function renderCompaniesView(){
  const companies = state.companies;
  return `
    <div class="page-head">
      <div>
        <div class="page-title">Şirketler</div>
        <div class="page-sub">Her şirketin parça verileri birbirinden tamamen bağımsızdır.</div>
      </div>
      ${isAdmin() ? `<button class="btn btn-primary" data-action="openAddCompany">+ Şirket Ekle</button>` : ''}
    </div>
    ${companies.length===0 ? `
      <div class="empty-state">

/* ============================= FORM -> STATE SENKRONİZASYONU (veri kaybını önler) ============================= */
// Ekranda yazılmış ama henüz "Kaydet"e basılmamış değerleri, bir yeniden çizimden (render) önce
// bellekteki state'e aktarır. Böylece "ölçüm ekle" gibi butonlar diğer alanlardaki yazılanları silmez.
function syncTrackingFormToState(){
  const company = getCompany(state.selectedCompanyId);
  if(!company) return;
  const part = getParts(company.id).find(p=>p.id===state.selectedPartId);
  if(!part) return;
  document.querySelectorAll('[data-stage-input]').forEach(inp=>{
    if(inp.disabled) return;
    const stage = inp.getAttribute('data-stage-input');
    if(!part.qtys) part.qtys={};
    part.qtys[stage] = Math.max(0, Number(inp.value)||0);
  });
  document.querySelectorAll('[data-reject-input]').forEach(inp=>{
    if(inp.disabled) return;
    const stage = inp.getAttribute('data-reject-input');
    if(!part.rejects) part.rejects={};
    part.rejects[stage] = Math.max(0, Number(inp.value)||0);
  });
  const noteEl = document.getElementById('partNoteInput');
  if(noteEl && !noteEl.disabled) part.note = noteEl.value;
  const colorEl = document.getElementById('partColorTrackInput');
  if(colorEl && !colorEl.disabled) part.color = colorEl.value.trim();
  part.measurements = part.measurements || [];
  document.querySelectorAll('[data-meas-value]').forEach(inp=>{
    if(inp.disabled) return;
    const m = part.measurements.find(x=>x.id===inp.getAttribute('data-meas-value'));
    if(m) m.measuredValue = inp.value===''?'':Number(inp.value);
  });
  document.querySelectorAll('[data-meas-nominal]').forEach(inp=>{
    if(inp.disabled) return;
    const m = part.measurements.find(x=>x.id===inp.getAttribute('data-meas-nominal'));
    if(m) m.nominalValue = inp.value===''?'':Number(inp.value);
  });
  document.querySelectorAll('[data-meas-tol]').forEach(inp=>{
    if(inp.disabled) return;
    const m = part.measurements.find(x=>x.id===inp.getAttribute('data-meas-tol'));
    if(m) m.tolerance = inp.value===''?'':Number(inp.value);
  });
}

/* ============================= TARİH / AŞAMA YARDIMCILARI ============================= */
function parseTRDate(str){
  if(!str) return null;
  const datePart = String(str).split(' ')[0];
  const bits = datePart.split('.').map(Number);
  if(bits.length<3 || bits.some(isNaN)) return null;
  const [d,m,y] = bits;
  return new Date(y, m-1, d);
}
function daysSince(dateStr){
  const d = parseTRDate(dateStr);
  if(!d) return null;
  const now = new Date();
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.max(0, Math.round((a - d) / (1000*60*60*24)));
}
function getStageLastEntry(part, stage){
  const hist = (part.history||[]).filter(h=>h.stage===stage && !h.reject);
  if(!hist.length) return null;
  return hist[hist.length-1];
}
function getCurrentStageIndex(part, stages){
  let idx = -1;
  stages.forEach((s,i)=>{ if(Number((part.qtys||{})[s]||0) > 0) idx = i; });
  return idx;
}

function measurementStatus(m){
  const measured = m.measuredValue!==''&&m.measuredValue!=null ? Number(m.measuredValue) : null;
  const nominal = m.nominalValue!==''&&m.nominalValue!=null ? Number(m.nominalValue) : null;
  const tol = m.tolerance!==''&&m.tolerance!=null ? Math.abs(Number(m.tolerance)) : null;
  if(measured===null || nominal===null || tol===null || isNaN(measured) || isNaN(nominal) || isNaN(tol)) return 'pending';
  return Math.abs(measured-nominal) <= tol ? 'ok' : 'fail';
}
function renderMeasurementSection(part){
  const measurements = part.measurements || [];
  const suggested = calcSampleCount(part.orderedQty);
  const hasImageDrawing = part.drawing && part.drawing.type && part.drawing.type.startsWith('image/');
  const admin = isAdmin();
  return `
    <div class="section-title">Ölçüm Kontrolü</div>
    <div class="helper-text" style="margin-bottom:10px;">Sipariş adedine (${fmtNum(part.orderedQty)}) göre örnekleme tablosuna göre önerilen ölçüm sayısı: <b style="color:var(--navy-800);font-style:normal;">${suggested}</b> ${measurements.length ? `· şu an ${measurements.length} ölçüm noktası tanımlı` : ''}</div>
    ${admin ? `
    <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      <button class="btn btn-navy btn-sm" data-action="addMeasurement" data-part="${part.id}">+ Ölçüm Noktası Ekle</button>
      ${suggested > measurements.length ? `<button class="btn btn-ghost btn-sm" data-action="addSuggestedMeasurements" data-part="${part.id}" data-count="${suggested}">Önerilen Sayıya Tamamla (+${suggested-measurements.length})</button>` : ''}
    </div>` : ''}

    ${hasImageDrawing ? `
      <div class="card" style="padding:14px;margin-bottom:14px;">
        ${admin ? `<div class="helper-text" style="margin:0 0 8px 0;">${state.markingMeasurementId ? 'Resme tıklayarak ölçüm noktasının yerini işaretleyin.' : 'Bir ölçüm satırındaki "Resimde İşaretle" butonuna basıp resme tıklayarak konumunu belirleyebilirsiniz.'}</div>` : ''}
        <div class="drawing-image-wrap" id="measureImageWrap" style="position:relative;display:inline-block;max-width:100%;cursor:${state.markingMeasurementId?'crosshair':'default'};">
          <img src="${part.drawing.data}" id="measureImageEl" style="max-width:100%;max-height:420px;border-radius:8px;border:1px solid var(--gray-300);display:block;"/>
          ${measurements.filter(m=>m.imgX!=null && m.imgY!=null).map(m=>`<div class="meas-marker ${measurementStatus(m)}" style="left:${m.imgX}%;top:${m.imgY}%;">${m.no}</div>`).join('')}
        </div>
      </div>
    ` : ''}

    ${measurements.length===0 ? `
      <div class="empty-state" style="padding:30px 20px;">
        <p style="margin:0;">Henüz ölçüm noktası eklenmedi.</p>
      </div>
    ` : `
      <table class="data-table">
        <thead><tr><th>No</th>${hasImageDrawing?'<th>Konum</th>':''}<th>Ölçülen Değer</th><th>Nominal Değer</th><th>Tolerans (±)</th><th>Durum</th>${admin?'<th></th>':''}</tr></thead>
        <tbody>
          ${measurements.map(m=>{
            const status = measurementStatus(m);
            const statusLabel = status==='ok' ? 'Uygun' : status==='fail' ? 'Tolerans Dışı' : 'Bekliyor';
            const statusClass = status==='ok' ? 'shipped' : status==='fail' ? 'progress' : 'notstarted';
            return `
            <tr>
              <td class="mono">${m.no}</td>
              ${hasImageDrawing ? `<td>${m.imgX!=null ? `<span style="color:var(--red-600);font-weight:700;">&#128204; işaretli</span>` : (admin ? `<button class="btn btn-ghost btn-sm" data-mark-measurement="${m.id}">Resimde İşaretle</button>` : '—')}</td>` : ''}
              <td><input type="number" step="any" class="stage-input" style="width:90px;font-size:13px;padding:6px 8px;" data-meas-value="${m.id}" value="${m.measuredValue!=null?m.measuredValue:''}" ${!admin?'disabled':''}/></td>
              <td><input type="number" step="any" class="stage-input" style="width:90px;font-size:13px;padding:6px 8px;" data-meas-nominal="${m.id}" value="${m.nominalValue!=null?m.nominalValue:''}" ${!admin?'disabled':''}/></td>
              <td><input type="number" step="any" class="stage-input" style="width:80px;font-size:13px;padding:6px 8px;" data-meas-tol="${m.id}" value="${m.tolerance!=null?m.tolerance:''}" ${!admin?'disabled':''}/></td>
              <td><span class="status-badge ${statusClass}"><span class="status-dot"></span>${statusLabel}</span></td>
              ${admin ? `<td><div class="icon-btn danger" data-remove-measurement="${m.id}" title="Sil">&#128465;</div></td>` : ''}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    `}
  `;
}

/* ============================= QUALITY VIEW ============================= */
function collectAllNcrs(){
  const all = [];
  state.companies.forEach(c=>{
    getParts(c.id).forEach(p=>{
      (p.ncrs||[]).forEach(n=> all.push({...n, companyId:c.id, companyName:c.name, partId:p.id, partNo:p.partNo, partName:p.partName}));
    });
  });
  return all.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
}
function renderQualityView(){
  const totals = allTotals();
  let all = collectAllNcrs();
  if(state.qualityFilter==='acik') all = all.filter(n=>n.status==='acik');
  if(state.qualityFilter==='kapali') all = all.filter(n=>n.status==='kapali');

  return `
    <div class="page-head">
      <div><div class="page-title">Kalite Kontrol</div><div class="page-sub">Ret adetleri ve uygunsuzluk kayıtları — tüm şirketler</div></div>
      ${isAdmin() ? `<button class="btn btn-primary" data-action="openNcrGlobal">+ Uygunsuzluk Kaydı Aç</button>` : ''}
    </div>
    <div class="kpi-grid">
      <div class="kpi-card accent"><div class="kpi-label">Toplam Ret Adedi</div><div class="kpi-value">${fmtNum(totals.rejected)}</div></div>
      <div class="kpi-card accent"><div class="kpi-label">Açık Uygunsuzluk</div><div class="kpi-value">${fmtNum(totals.openNcr)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Kapatılan Uygunsuzluk</div><div class="kpi-value">${fmtNum(totals.closedNcr)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Sevk Edilen / Sipariş</div><div class="kpi-value" style="font-size:20px;">${fmtNum(totals.shipped)} <span class="kpi-unit">/ ${fmtNum(totals.ordered)}</span></div></div>
    </div>
    <div class="toolbar">
      <select class="filter-select" id="qualityFilterSelect">
        <option value="acik" ${state.qualityFilter==='acik'?'selected':''}>Açık kayıtlar</option>
        <option value="kapali" ${state.qualityFilter==='kapali'?'selected':''}>Kapatılan kayıtlar</option>
        <option value="hepsi" ${state.qualityFilter==='hepsi'?'selected':''}>Tümü</option>
      </select>

    ${all.length===0 ? `
      <div class="empty-state"><div class="ico">&#9878;</div><h3>Kayıt bulunamadı</h3><p>Seçili filtreye uyan bir uygunsuzluk kaydı yok.</p></div>
    ` : all.map(n=>`
      <div class="ncr-card ${n.status==='kapali'?'closed':''}">
        <div class="ncr-top">
          <div>
            <div class="ncr-title">${escapeHtml(n.partNo)} — ${escapeHtml(n.partName)} <span style="font-weight:400;color:var(--gray-500);">(${escapeHtml(n.companyName)})</span></div>

          </div>
          <span class="status-badge ${n.status==='acik'?'open':'closed'}"><span class="status-dot"></span>${n.status==='acik'?'Açık':'Kapatıldı'}</span>
        </div>
        <div class="ncr-desc">${escapeHtml(n.description)}</div>
        ${n.correctiveAction ? `<div class="ncr-action"><b>Düzeltici Faaliyet:</b> ${escapeHtml(n.correctiveAction)}</div>` : ''}
        <div class="ncr-foot">
          <span class="helper-text" style="margin:0;">${n.status==='kapali' && n.closedDate ? 'Kapatıldı: '+n.closedDate : ''}</span>
          ${n.status==='acik' && isAdmin() ? `<button class="btn btn-ghost btn-sm" data-close-ncr="${n.partId}|${n.id}" data-company="${n.companyId}">Kapat</button>` : ''}

function renderNcrList(ncrs, companyId, partId){

        <div>
          <div class="ncr-title">${escapeHtml(n.stage)}</div>
          <div class="ncr-meta">${n.date} · Kaydeden: ${escapeHtml(n.user)}</div>
        </div>
        <span class="status-badge ${n.status==='acik'?'open':'closed'}"><span class="status-dot"></span>${n.status==='acik'?'Açık':'Kapatıldı'}</span>

      <div class="ncr-desc">${escapeHtml(n.description)}</div>
      ${n.correctiveAction ? `<div class="ncr-action"><b>Düzeltici Faaliyet:</b> ${escapeHtml(n.correctiveAction)}</div>` : ''}

}

/* ============================= MODALS ============================= */
function renderModal(){
  const m = state.modal;
  if(!m) return '';
  if(m.type==='addCompany' || m.type==='editCompany'){
    const isEdit = m.type==='editCompany';
    const company = isEdit ? getCompany(m.payload.id) : null;
    return modalWrap(`
      <h2>${isEdit?'Şirketi Düzenle':'Yeni Şirket Ekle'}</h2>
      <div class="modal-sub">${isEdit?'Şirket bilgilerini güncelleyin.':'Şirket adını girerek sisteme ekleyin.'}</div>
      <div class="field">
        <label>Şirket Adı</label>
        <input type="text" id="companyNameInput" placeholder="Örn. ABC Makina" value="${isEdit?escapeHtml(company.name):''}"/>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        <button class="btn btn-primary" data-action="${isEdit?'saveEditCompany':'saveAddCompany'}" data-id="${isEdit?company.id:''}">${isEdit?'Kaydet':'Ekle'}</button>
      </div>
    `);
  }
  if(m.type==='deleteCompany'){
    const company = getCompany(m.payload.id);
    return modalWrap(`
      <h2>Şirketi Sil</h2>
      <div class="modal-sub">"<b>${escapeHtml(company.name)}</b>" şirketini ve tüm parça verilerini kalıcı olarak silmek üzeresiniz. Bu işlem geri alınamaz.</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        <button class="btn btn-primary" style="background:var(--red-700);" data-action="confirmDeleteCompany" data-id="${company.id}">Evet, Sil</button>
      </div>
    `);
  }
  if(m.type==='addPart' || m.type==='editPart'){
    const isEdit = m.type==='editPart';
    const company = getCompany(state.selectedCompanyId);
    const part = isEdit ? getParts(company.id).find(p=>p.id===m.payload.id) : null;
    return modalWrap(`
      <h2>${isEdit?'Parçayı Düzenle':'Yeni Parça Ekle'}</h2>
      <div class="modal-sub">${escapeHtml(company.name)}</div>
      <div class="field"><label>Parça No</label><input type="text" id="partNoInput" ${isEdit?'disabled':''} placeholder="Örn. P-10025" value="${isEdit?escapeHtml(part.partNo):''}"/></div>
      <div class="field"><label>Parça Adı (opsiyonel)</label><input type="text" id="partNameInput" placeholder="Örn. Braket" value="${isEdit?escapeHtml(part.partName):''}"/></div>

      <div class="field"><label>Malzeme Rengi (opsiyonel)</label><input type="text" id="partColorInput" placeholder="Örn. RAL 9005 Siyah — boyanmıyorsa boş bırakın" value="${isEdit?escapeHtml(part.color||''):''}"/></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        <button class="btn btn-primary" data-action="${isEdit?'saveEditPart':'saveAddPart'}" data-id="${isEdit?part.id:''}">${isEdit?'Kaydet':'Ekle'}</button>
      </div>
    `);
  }
  if(m.type==='deletePart'){
    const company = getCompany(state.selectedCompanyId);
    const part = getParts(company.id).find(p=>p.id===m.payload.id);
    return modalWrap(`
      <h2>Parçayı Sil</h2>
      <div class="modal-sub">"<b>${escapeHtml(part.partNo)} — ${escapeHtml(part.partName)}</b>" parçasını silmek istediğinize emin misiniz?</div>

        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>

          <button class="btn btn-ghost" data-action="cancelImportPreview">Farklı Dosya Seç</button>

            <div class="dz-ico">&#128193;</div>
            <div class="dz-text">Klasör Seç</div>

        ${preview.matches.length>0 ? `
        <table class="preview-table">
          <thead><tr><th>Dosya</th><th>Eşleşen Parça</th></tr></thead>
          <tbody>
            ${preview.matches.slice(0,10).map(m=>`<tr><td>${escapeHtml(m.file.name)}</td><td><span class="part-no-tag">${escapeHtml(m.part.partNo)}</span> ${escapeHtml(m.part.partName||'')}</td></tr>`).join('')}
