function renderModal(){
  const m = state.modal;
  if(!m) return '';
  if(m.type==='addCompany' || m.type==='editCompany'){
    const isEdit = m.type==='editCompany';
    const company = isEdit ? getCompany(m.payload.id) : null;
    return modalWrap(`
      <h2>${isEdit?'Şirketi Düzenle':'Yeni Şirket Ekle'}</h2>
      <div class="modal-sub">${isEdit?'Şirket bilgilerini güncelleyin.':'Şirket adını girerek sisteme ekleyin.'}</div>
      <div class="field">
        <label>Şirket Adı</label>
        <input type="text" id="companyNameInput" placeholder="Örn. ABC Makina" value="${isEdit?escapeHtml(company.name):''}"/>
      </div>
      ${isEdit ? `
      <div class="field">
        <label>Müşteri Takip Kodu</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="text" id="companyClientCodeInput" value="${escapeHtml((state.companyAccessCodes||{})[company.id]||'')}" readonly style="font-family:var(--font-mono);letter-spacing:1px;background:var(--gray-50);"/>
          <button class="btn btn-ghost btn-sm" data-action="regenClientCode" data-id="${company.id}" type="button">Yenile</button>
        </div>
        <div class="helper-text">Bu kodu yalnızca ilgili müşteriye verin. Firebase Rules müşteriyi sunucu tarafında yalnızca bu şirkete sınırlar. Kodu yenilersen eski kod yeni kayıtlar için geçersiz olur; daha önce bağlanmış hesaplar etkilenmez.</div>
      </div>` : ''}
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        <button class="btn btn-primary" data-action="${isEdit?'saveEditCompany':'saveAddCompany'}" data-id="${isEdit?company.id:''}">${isEdit?'Kaydet':'Ekle'}</button>
      </div>
    `);
  }
  if(m.type==='deleteCompany'){
    const company = getCompany(m.payload.id);
    return modalWrap(`
      <h2>Şirketi Sil</h2>
      <div class="modal-sub">"<b>${escapeHtml(company.name)}</b>" şirketini ve tüm parça verilerini kalıcı olarak silmek üzeresiniz. Bu işlem geri alınamaz.</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        <button class="btn btn-primary" style="background:var(--red-700);" data-action="confirmDeleteCompany" data-id="${company.id}">Evet, Sil</button>
      </div>
    `);
  }
  if(m.type==='promoteAdmin'){
    const u=(state.accessUsers||{})[m.payload.uid];
    if(!u) return modalWrap(`<h2>Kullanıcı bulunamadı</h2><div class="modal-actions"><button class="btn btn-primary" data-action="closeModal">Kapat</button></div>`);
    return modalWrap(`
      <h2>Yönetici Yetkisi Ver</h2>
      <div class="modal-sub"><b>${escapeHtml(u.name||u.email||'Bu kullanıcı')}</b> tam yönetici yetkisi alacak.</div>
      <div class="card" style="padding:12px;margin:12px 0;background:var(--gray-50);"><div style="font-size:12.5px;line-height:1.55;color:var(--gray-700);">Yönetici; tüm şirketleri, parçaları, kullanıcıları, kalite kayıtlarını ve erişim ayarlarını görebilir ve değiştirebilir.</div></div>
      <div class="modal-actions"><button class="btn btn-ghost" data-action="closeModal">Vazgeç</button><button class="btn btn-primary" data-action="confirmPromoteAdmin" data-uid="${escapeHtml(m.payload.uid)}">Yönetici Yap</button></div>
    `);
  }
  if(m.type==='demoteAdmin'){
    const u=(state.accessUsers||{})[m.payload.uid];
    if(!u) return modalWrap(`<h2>Kullanıcı bulunamadı</h2><div class="modal-actions"><button class="btn btn-primary" data-action="closeModal">Kapat</button></div>`);
    const fallback=(u.roleBeforeAdmin && (DEFAULT_STAGES.includes(u.roleBeforeAdmin)||u.roleBeforeAdmin==='client')) ? u.roleBeforeAdmin : (u.companyId?'client':DEFAULT_STAGES[0]);
    const roleOptions=[...(u.companyId?[{value:'client',label:'Müşteri (Salt Okunur)'}]:[]),...DEFAULT_STAGES.map(r=>({value:r,label:r}))];
    return modalWrap(`
      <h2>Yönetici Yetkisini Kaldır</h2>
      <div class="modal-sub"><b>${escapeHtml(u.name||u.email||'Bu kullanıcı')}</b> artık yönetici olmayacak. Yeni rolünü seçin.</div>
      <div class="field"><label>Yeni Rol</label><select id="demoteRoleSelect">${roleOptions.map(r=>`<option value="${escapeHtml(r.value)}" ${r.value===fallback?'selected':''}>${escapeHtml(r.label)}</option>`).join('')}</select></div>
      <div class="helper-text">Müşteri rolü yalnızca kullanıcı zaten bir şirkete bağlıysa seçilebilir. Değişiklik Firebase Rules tarafından hemen uygulanır.</div>
      <div class="modal-actions"><button class="btn btn-ghost" data-action="closeModal">Vazgeç</button><button class="btn btn-primary" style="background:var(--red-700);" data-action="confirmDemoteAdmin" data-uid="${escapeHtml(m.payload.uid)}">Yetkiyi Kaldır</button></div>
    `);
  }
  if(m.type==='addMonth'){
    const company=getCompany(state.selectedCompanyId);
    return modalWrap(`
      <h2>Sipariş Ayı Ekle</h2>
      <div class="modal-sub">${escapeHtml(company.name)} içine yeni bir sipariş ayı açın. Her ayın parça siparişleri ayrı tutulur.</div>
      <div class="field"><label>Ay</label><input type="month" id="newMonthInput" value="${currentMonthKey()}"/></div>
      <div class="modal-actions"><button class="btn btn-ghost" data-action="closeModal">Vazgeç</button><button class="btn btn-primary" data-action="saveAddMonth">Ayı Ekle ve Aç</button></div>
    `);
  }
  if(m.type==='addPart' || m.type==='editPart'){
    const isEdit = m.type==='editPart';
    const company = getCompany(state.selectedCompanyId);
    const part = isEdit ? getParts(company.id).find(p=>p.id===m.payload.id) : null;
    return modalWrap(`
      <h2>${isEdit?'Parçayı Düzenle':'Yeni Parça Ekle'}</h2>
      <div class="modal-sub">${escapeHtml(company.name)} · aynı parça numarası farklı sipariş aylarında ayrı kayıt olarak tutulabilir.</div>
      <div class="field"><label>Sipariş Ayı</label><select id="partMonthInput">${ensureCompanyMonths(company,getParts(company.id)).slice().sort().reverse().map(mm=>`<option value="${mm}" ${mm===(isEdit?inferPartMonth(part):activeMonthKey(company.id))?'selected':''}>${escapeHtml(monthLabel(mm))}</option>`).join('')}</select></div>
      <div class="field"><label>Parça No</label><input type="text" id="partNoInput" ${isEdit?'disabled':''} placeholder="Örn. P-10025" value="${isEdit?escapeHtml(part.partNo):''}"/></div>
      <div class="field"><label>Parça Adı (opsiyonel)</label><input type="text" id="partNameInput" placeholder="Örn. Braket" value="${isEdit?escapeHtml(part.partName):''}"/></div>
      <div class="field"><label>İstenen Adet</label><input type="number" min="0" id="partQtyInput" placeholder="Örn. 500" value="${isEdit?part.orderedQty:''}"/></div>
      <div class="field"><label>Malzeme Rengi (opsiyonel)</label><input type="text" id="partColorInput" placeholder="Örn. RAL 9005 Siyah — boyanmıyorsa boş bırakın" value="${isEdit?escapeHtml(part.color||''):''}"/></div>
      <div class="field"><label>Termin Tarihi (opsiyonel)</label><input type="date" id="partDueDateInput" value="${isEdit?escapeHtml(part.dueDate||''):''}"/></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        <button class="btn btn-primary" data-action="${isEdit?'saveEditPart':'saveAddPart'}" data-id="${isEdit?part.id:''}">${isEdit?'Kaydet':'Ekle'}</button>
      </div>
    `);
  }
  if(m.type==='deletePart'){
    const company = getCompany(state.selectedCompanyId);
    const part = getParts(company.id).find(p=>p.id===m.payload.id);
    return modalWrap(`
      <h2>Parçayı Sil</h2>
      <div class="modal-sub">"<b>${escapeHtml(part.partNo)} — ${escapeHtml(part.partName)}</b>" parçasını silmek istediğinize emin misiniz?</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        <button class="btn btn-primary" style="background:var(--red-700);" data-action="confirmDeletePart" data-id="${part.id}">Evet, Sil</button>
      </div>
    `);
  }
  if(m.type==='stages'){
    const company = getCompany(state.selectedCompanyId);
    return modalWrap(`
      <h2>Üretim Aşamaları</h2>
      <div class="modal-sub">${escapeHtml(company.name)} için proses akışını düzenleyin. Sondaki aşama "sevkiyat" olarak kabul edilir.</div>
      <div class="stage-chip-row" id="stageChipRow">
        ${company.stages.map((s,i)=>`<span class="tag-chip">${i+1}. ${escapeHtml(s)} <span class="x" data-remove-stage="${escapeHtml(s)}">✕</span></span>`).join('')}
      </div>
      <div class="add-stage-row">
        <input type="text" id="newStageInput" placeholder="Yeni aşama adı (Örn. Kalite Kontrol)"/>
        <button class="btn btn-navy btn-sm" data-action="addStage">+ Ekle</button>
      </div>
      <div class="helper-text">Aşama sırası, üretim akışını (Kesim → Büküm → … → Sevkiyat) temsil eder. Bir aşamayı kaldırmak, o aşamaya ait girilmiş adetleri siler.</div>
      <div class="modal-actions">
        <button class="btn btn-primary" data-action="closeModal">Tamam</button>
      </div>
    `, 'wide');
  }
  if(m.type==='import'){
    const company = getCompany(state.selectedCompanyId);
    return modalWrap(`
      <h2>Excel / CSV Yükle</h2>
      <div class="modal-sub">${escapeHtml(company.name)} için parça listesi yükleyin. Beklenen sütunlar: <b>Parça No, Parça Adı, İstenen Adet</b></div>
      ${!state.importPreview ? `
        <div class="drop-zone" id="dropZone">
          <div class="dz-ico">&#128228;</div>
          <div class="dz-text">Dosya seçmek için tıklayın</div>
          <div class="dz-sub">.xlsx, .xls veya .csv</div>
          <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none;"/>
        </div>
      ` : `
        <div class="import-summary">
          <div>Dosya: <b>${escapeHtml(state.importPreview.fileName)}</b></div>
          <div>Satır: <b>${state.importPreview.rows.length}</b></div>
        </div>
        <table class="preview-table">
          <thead><tr><th>Parça No</th><th>Parça Adı</th><th>İstenen Adet</th></tr></thead>
          <tbody>
            ${state.importPreview.rows.slice(0,6).map(r=>`<tr><td>${escapeHtml(r.partNo)}</td><td>${r.partName ? escapeHtml(r.partName) : '<span style="color:var(--red-600);font-style:italic;">— (isim sütunu bulunamadı)</span>'}</td><td>${fmtNum(r.orderedQty)}</td></tr>`).join('')}
          </tbody>
        </table>
        ${state.importPreview.rows.length>6 ? `<div class="helper-text">…ve ${state.importPreview.rows.length-6} satır daha</div>` : ''}
      `}
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        ${state.importPreview ? `
          <button class="btn btn-ghost" data-action="cancelImportPreview">Farklı Dosya Seç</button>
          <button class="btn btn-primary" data-action="confirmImport">${state.importPreview.rows.length} Parçayı İçe Aktar</button>
        ` : ''}
      </div>
    `, 'wide');
  }
  if(m.type==='bulkDrawings'){
    const company = getCompany(state.selectedCompanyId);
    const preview = state.bulkDrawingPreview;
    return modalWrap(`
      <h2>Teknik Resimleri Toplu Yükle</h2>
      <div class="modal-sub">${escapeHtml(company.name)} — her parça için istediğin kadar teknik resim ekleyebilirsin. Eğer "Klasör Seç" ile yüklersen, önce klasör adının (örn. bir "P-10025" klasörü) parça no'suyla eşleşip eşleşmediğine bakar — klasör içindeki TÜM dosyalar (isimleri ne olursa olsun) o parçaya eklenir. Klasör kullanmazsan, dosya adının içinde geçen parça no'suna göre eşleştirir.</div>
      ${!preview ? `
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <div class="drop-zone" id="bulkFolderZone" style="flex:1;min-width:180px;">
            <div class="dz-ico">&#128193;</div>
            <div class="dz-text">Klasör Seç</div>
            <div class="dz-sub">Bir klasördeki tüm dosyaları tara</div>
            <input type="file" id="bulkFolderInput" webkitdirectory directory multiple style="display:none;"/>
          </div>
          <div class="drop-zone" id="bulkFilesZone" style="flex:1;min-width:180px;">
            <div class="dz-ico">&#128228;</div>
            <div class="dz-text">Dosyaları Seç</div>
            <div class="dz-sub">Tek tek veya birden çok dosya seç</div>
            <input type="file" id="bulkFilesInput" multiple accept=".png,.jpg,.jpeg,.pdf" style="display:none;"/>
          </div>
        </div>
      ` : `
        <div class="import-summary">
          <div>Eşleşen: <b style="color:var(--navy-800);">${preview.matches.length}</b></div>
          <div>Eşleşmeyen: <b style="color:var(--red-700);">${preview.unmatched.length}</b></div>
          <div>Toplam boyut: <b>${(preview.matches.reduce((a,m)=>a+m.file.size,0)/1024/1024).toFixed(1)} MB</b></div>
        </div>
        ${preview.matches.length>0 ? `
        <table class="preview-table">
          <thead><tr><th>Dosya</th><th>Eşleşen Parça</th></tr></thead>
          <tbody>
            ${preview.matches.slice(0,10).map(m=>`<tr><td>${escapeHtml(m.file.name)}</td><td><span class="part-no-tag">${escapeHtml(m.part.partNo)}</span> ${escapeHtml(m.part.partName||'')}</td></tr>`).join('')}
          </tbody>
        </table>
        ${preview.matches.length>10 ? `<div class="helper-text">…ve ${preview.matches.length-10} tane daha</div>` : ''}
        ` : `<div class="helper-text">Eşleşen dosya bulunamadı.</div>`}
        ${preview.unmatched.length>0 ? `
        <div class="section-title" style="font-size:15px;margin-top:16px;">Eşleşmeyenler</div>
        <table class="preview-table">
          <thead><tr><th>Dosya</th><th>Sebep</th></tr></thead>
          <tbody>
            ${preview.unmatched.slice(0,10).map(u=>`<tr><td>${escapeHtml(u.file.name)}</td><td style="color:var(--red-700);">${escapeHtml(u.reason)}</td></tr>`).join('')}
          </tbody>
        </table>
        ${preview.unmatched.length>10 ? `<div class="helper-text">…ve ${preview.unmatched.length-10} tane daha</div>` : ''}
        ` : ''}
      `}
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        ${preview ? `
          <button class="btn btn-ghost" data-action="cancelBulkDrawings">Farklı Dosya Seç</button>
          ${preview.matches.length>0 ? `<button class="btn btn-primary" data-action="confirmBulkDrawings">${preview.matches.length} Teknik Resmi İçe Aktar</button>` : ''}
        ` : ''}
      </div>
    `, 'wide');
  }
  if(m.type==='bulkRename'){
    const count = state.selectedPartIds.size;
    return modalWrap(`
      <h2>Toplu Parça Adı Değiştir</h2>
      <div class="modal-sub">${count} parça seçili. Aşağıdaki işlem yalnızca seçili parçaların adını değiştirir.</div>
      <div class="field">
        <label>İşlem Türü</label>
        <div class="radio-row-mode">
          <label><input type="radio" name="bulkMode" value="replace" checked/> Metin içinde bul ve değiştir</label>
          <label><input type="radio" name="bulkMode" value="prefix"/> Başa metin ekle (önek)</label>
          <label><input type="radio" name="bulkMode" value="suffix"/> Sona metin ekle (sonek)</label>
        </div>
      </div>
      <div class="field"><label>Bul</label><input type="text" id="bulkFindInput" placeholder="Örn. Braket"/></div>
      <div class="field"><label>Değiştir</label><input type="text" id="bulkReplaceInput" placeholder="Örn. Destek Braketi"/></div>
      <div class="field"><label>Önek / Sonek Metni</label><input type="text" id="bulkTextInput" placeholder="Örn. REV2- veya -A"/></div>
      <div class="helper-text">"Bul ve değiştir" modunda yalnızca ilk iki alan; "önek/sonek" modunda yalnızca üçüncü alan kullanılır.</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        <button class="btn btn-primary" data-action="applyBulkRename">Uygula (${count} parça)</button>
      </div>
    `);
  }

  if(m.type==='qualityEvent'){
    const part=getParts(state.selectedCompanyId).find(p=>p.id===m.payload.partId);
    const company=getCompany(state.selectedCompanyId);
    return modalWrap(`
      <h2>Kalite / Adet Kararı</h2>
      <div class="modal-sub">${escapeHtml(part?.partNo||'')} — sağlam fazla üretim ile kalite hurdasını ayrı kaydedin.</div>
      <div class="field"><label>Kayıt Türü</label><select id="qualityEventType">
        <option value="quarantine">Karantina / karar bekliyor</option>
        <option value="quarantine_release">Karantinadan serbest bırak</option>
        <option value="rework">Yeniden işleme (Rework)</option>
        <option value="rework_complete">Rework tamamlandı</option>
        <option value="quality_scrap">Kalite hurdası — otomatik NCR</option>
        <option value="surplus_stock">Fazla üretim — stokta tut</option>
        <option value="surplus_scrap">Fazla üretim — hurdaya ayır</option>
        <option value="surplus_ship">Fazla üretim — müşteriye sevk</option>
        <option value="surplus_hold">Fazla üretim — beklet</option>
        <option value="customer_complaint">Müşteri şikâyeti — otomatik NCR</option>
      </select></div>
      <div class="field"><label>Adet</label><input type="number" min="1" id="qualityEventQty" value="1"/></div>
      <div class="field"><label>Proses</label><select id="qualityEventStage">${(company?.stages||DEFAULT_STAGES).map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')}</select></div>
      <div class="field"><label>Sebep</label><input type="text" id="qualityEventReason" placeholder="Örn. büküm ölçüsü tolerans dışı / ihtiyaç fazlası"/></div>
      <div class="field"><label>Not</label><textarea id="qualityEventNote" placeholder="Ek açıklama"></textarea></div>
      <div class="modal-actions"><button class="btn btn-ghost" data-action="closeModal">Vazgeç</button><button class="btn btn-primary" data-action="saveQualityEvent" data-part="${part?.id||''}">Kaydet</button></div>
    `);
  }
  if(m.type==='productionIssue'){
    const part=getParts(state.selectedCompanyId).find(p=>p.id===m.payload.partId);
    const company=getCompany(state.selectedCompanyId);
    return modalWrap(`
      <h2>Üretim Problemi</h2>
      <div class="modal-sub">${escapeHtml(part?.partNo||'')} — gecikme/duruş kayıtları NCR'dan ayrı tutulur.</div>
      <div class="field"><label>Proses</label><select id="issueStageSelect">${(company?.stages||DEFAULT_STAGES).map(s=>`<option value="${escapeHtml(s)}" ${s===(m.payload.stage||'')?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select></div>
      <div class="field"><label>Problem Türü</label><select id="issueTypeSelect">${PRODUCTION_ISSUE_TYPES.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('')}</select></div>
      <div class="field"><label>Etkilenen Adet (opsiyonel)</label><input type="number" min="0" id="issueQtyInput" value="0"/></div>
      <div class="field"><label>Açıklama</label><textarea id="issueDescInput" placeholder="Ne oldu, üretim neden bekledi?"></textarea></div>
      <div class="modal-actions"><button class="btn btn-ghost" data-action="closeModal">Vazgeç</button><button class="btn btn-primary" data-action="saveProductionIssue" data-part="${part?.id||''}">Kaydet</button></div>
    `);
  }
  if(m.type==='ncr'){
    const payload=m.payload||{};
    const isGlobal = !payload.partId;
    const company = getCompany(state.selectedCompanyId);
    let stageOptions = company ? company.stages : DEFAULT_STAGES;
    let partOptionsHtml = '';
    if(isGlobal){
      partOptionsHtml = `
        <div class="field">
          <label>Şirket</label>
          <select id="ncrCompanySelect">
            ${state.companies.map(c=>`<option value="${c.id}" ${c.id===state.selectedCompanyId?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Parça</label>
          <select id="ncrPartSelect">
            ${getParts(state.selectedCompanyId).map(p=>`<option value="${p.id}">${escapeHtml(p.partNo)} — ${escapeHtml(p.partName)}</option>`).join('')}
          </select>
        </div>`;
    }
    return modalWrap(`
      <h2>Uygunsuzluk Kaydı (NCR)</h2>
      <div class="modal-sub">${isGlobal ? 'Şirket ve parça seçerek yeni bir uygunsuzluk kaydı açın.' : escapeHtml(getParts(state.selectedCompanyId).find(p=>p.id===m.payload.partId)?.partNo || '')}</div>
      ${partOptionsHtml}
      <div class="field">
        <label>Aşama</label>
        <select id="ncrStageSelect">
          ${stageOptions.map(s=>`<option value="${escapeHtml(s)}" ${s===payload.stage?'selected':''}>${escapeHtml(s)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Uygunsuzluk Türü</label><select id="ncrCategorySelect">${NCR_CATEGORY_OPTIONS.map(x=>`<option value="${escapeHtml(x)}" ${x===(payload.category||'')?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select></div>
      <div class="field"><label>Etkilenen Adet</label><input type="number" min="0" id="ncrQtyInput" value="${Number(payload.qty)||0}"/></div>
      <div class="field">
        <label>Uygunsuzluk Açıklaması</label>
        <textarea id="ncrDescInput" placeholder="Örn. Ölçü toleransı dışında, yüzeyde çatlak vb.">${escapeHtml(payload.description||'')}</textarea>
      </div>
      <div class="field"><label>Kök Neden (biliniyorsa)</label><textarea id="ncrRootCauseInput" placeholder="Örn. yanlış takım, hatalı program, operatör ayarı…"></textarea></div>
      <div class="field"><label>Karar / Disposition</label><select id="ncrDispositionSelect">${NCR_DISPOSITION_OPTIONS.map(x=>`<option value="${escapeHtml(x)}" ${x===(payload.disposition||'Karantina')?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select></div>
      <div class="field">
        <label>Düzeltici Faaliyet (opsiyonel)</label>
        <textarea id="ncrActionInput" placeholder="Alınacak / alınan aksiyon"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        <button class="btn btn-primary" data-action="saveNcr" data-part="${m.payload.partId||''}">Kaydı Aç</button>
      </div>
    `);
  }
  if(m.type==='disHata'){
    return modalWrap(`
      <h2>Dış Hata Kaydı Ekle</h2>
      <div class="modal-sub">Müşteriden gelen / dışarıda tespit edilen hata kaydı.</div>
      <div class="field"><label>Tarih</label><input type="date" id="disHataTarihInput" value="${new Date().toISOString().slice(0,10)}"/></div>
      <div class="field"><label>Parça Kodu</label><input type="text" id="disHataParcaInput" placeholder="Örn. 2337055"/></div>
      <div class="field"><label>Hata Nedeni</label><textarea id="disHataNedenInput" placeholder="Örn. Malzemeler ters büküm yapılmış"></textarea></div>
      <div class="field"><label>Adet</label><input type="number" min="0" id="disHataAdetInput" placeholder="0"/></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        <button class="btn btn-primary" data-action="saveDisHata">Kaydet</button>
      </div>
    `);
  }
  if(m.type==='icHata'){
    return modalWrap(`
      <h2>İç Hata Kaydı Ekle</h2>
      <div class="modal-sub">Bölüm / kişi bazlı iç hata kaydı.</div>
      <div class="field"><label>Tarih</label><input type="date" id="icHataTarihInput" value="${new Date().toISOString().slice(0,10)}"/></div>
      <div class="field"><label>Bölüm</label>
        <select id="icHataBolumInput">${ERROR_DEPT_LIST.map(d=>`<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Hata Adı</label><input type="text" id="icHataAdiInput" placeholder="Örn. 12 mm Bermak"/></div>
      <div class="field"><label>Hata Türü</label><input type="text" id="icHataTuruInput" placeholder="Örn. Hatalı büküm"/></div>
      <div class="field"><label>Sorumlu Kişi</label><input type="text" id="icHataSorumluInput" placeholder="Örn. Ahmet Yılmaz"/></div>
      <div class="field"><label>Hatanın Nasıl Meydana Geldiği</label><textarea id="icHataNasilInput" placeholder="Örn. Gündüz vardiyası"></textarea></div>
      <div class="field"><label>Adet</label><input type="number" min="0" id="icHataAdetInput" placeholder="0"/></div>
      <div class="field"><label>İzlenebilirlik</label>
        <select id="icHataIzlenebilirlikInput"><option value="OK">OK</option><option value="NOT OK">NOT OK</option></select>
      </div>
      <div class="field"><label>Açıklama (opsiyonel)</label><textarea id="icHataAciklamaInput"></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        <button class="btn btn-primary" data-action="saveIcHata">Kaydet</button>
      </div>
    `);
  }
  if(m.type==='drawingTrash'){
    const trash = state.drawingTrash || [];
    return modalWrap(`
      <h2>Teknik Resim Çöp Kutusu</h2>
      <div class="modal-sub">Silinen teknik resimler burada ${TRASH_RETENTION_DAYS} gün saklanır, sonra otomatik olarak kalıcı silinir.</div>
      ${trash.length===0 ? `
        <div class="empty-state" style="padding:30px 20px;"><p style="margin:0;">Çöp kutusu boş.</p></div>
      ` : `
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
          <button class="btn btn-ghost btn-sm" data-action="trashSelectAll">Tümünü Seç</button>
          <button class="btn btn-ghost btn-sm" data-action="trashSelectNone">Seçimi Temizle</button>
          <div class="spacer" style="flex:1;"></div>
          <button class="btn btn-ghost btn-sm" data-action="trashRestoreSelected" ${state.selectedTrashIds.size===0?'disabled':''}>Seçilenleri Kurtar (${state.selectedTrashIds.size})</button>
          <button class="btn btn-danger-ghost btn-sm" data-action="trashDeleteSelected" ${state.selectedTrashIds.size===0?'disabled':''}>Seçilenleri Kalıcı Sil</button>
          <button class="btn btn-navy btn-sm" data-action="trashRestoreAll">Tümünü Kurtar</button>
          <button class="btn btn-danger-ghost btn-sm" data-action="trashDeleteAll">Tümünü Kalıcı Sil</button>
        </div>
        <div class="drawing-gallery" style="max-height:400px;overflow-y:auto;">
          ${trash.map(t=>{
            const d = t.drawing || {};
            const daysLeft = Math.max(0, TRASH_RETENTION_DAYS - (daysSince(t.deletedAt)||0));
            return `
            <div class="drawing-box">
              <input type="checkbox" class="sel-check" data-trash-check="${t.id}" ${state.selectedTrashIds.has(t.id)?'checked':''}/>
              ${d.type && d.type.startsWith('image/') ?
                `<img src="${d.data}" class="drawing-thumb"/>` :
                `<div class="drawing-file-icon">&#128196;</div>`}
              <div class="drawing-info">
                <div class="fname">${escapeHtml(d.name||'')}</div>
                <div class="helper-text" style="margin:2px 0 0 0;">${escapeHtml(t.companyName)} · ${escapeHtml(t.partNo)} — ${escapeHtml(t.partName||'')}</div>
                <div class="helper-text" style="margin:0;">Silen: ${escapeHtml(t.deletedBy||'—')} · ${escapeHtml(t.deletedAt)} · ${daysLeft} gün sonra kalıcı silinir</div>
              </div>
              <button class="btn btn-navy btn-sm" data-restore-trash="${t.id}">Kurtar</button>
              <button class="btn btn-danger-ghost btn-sm" data-delete-trash="${t.id}">Kalıcı Sil</button>
            </div>`;
          }).join('')}
        </div>
      `}
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Kapat</button>
      </div>
    `, 'wide');
  }
  return '';
}
function modalWrap(inner, size){
  return `<div class="modal-overlay" id="modalOverlay">
    <div class="modal ${size==='wide'?'wide':''} modal-wrap-pos">
      <div class="modal-close" data-action="closeModal">✕</div>
      ${inner}
    </div>
  </div>`;
}

/* ============================= EVENT HANDLERS ============================= */
function attachHandlers(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.view = el.getAttribute('data-nav'); render(); });
  });

  app.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', (e)=> handleAction(el.getAttribute('data-action'), el, e));
  });

  app.querySelectorAll('[data-select-company]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-edit-company]') || e.target.closest('[data-delete-company]') || e.target.closest('[data-pin-company]')) return;
      state.selectedCompanyId = el.getAttribute('data-select-company');
      state.selectedPartIds = new Set();
      lsSet('lastCompanyId', state.selectedCompanyId);
      render();
    });
  });
  app.querySelectorAll('[data-select-company-btn]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); state.selectedCompanyId = el.getAttribute('data-select-company-btn'); state.selectedPartIds = new Set(); lsSet('lastCompanyId', state.selectedCompanyId); render(); });
  });
  app.querySelectorAll('[data-pin-company]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); toggleCompanyPin(el.getAttribute('data-pin-company')); render(); });
  });
  app.querySelectorAll('[data-edit-company]').forEach(el=>{
    el.addEventListener('click',(e)=>{ e.stopPropagation(); state.modal = {type:'editCompany', payload:{id: el.getAttribute('data-edit-company')}}; render(); });
  });
  app.querySelectorAll('[data-delete-company]').forEach(el=>{
    el.addEventListener('click',(e)=>{ e.stopPropagation(); state.modal = {type:'deleteCompany', payload:{id: el.getAttribute('data-delete-company')}}; render(); });
  });

  app.querySelectorAll('[data-edit-part]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); state.modal = {type:'editPart', payload:{id: el.getAttribute('data-edit-part')}}; render(); });
  });
  app.querySelectorAll('[data-delete-part]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); state.modal = {type:'deletePart', payload:{id: el.getAttribute('data-delete-part')}}; render(); });
  });
  app.querySelectorAll('[data-track-part]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); state.selectedPartId = el.getAttribute('data-track-part'); state.view='tracking'; render(); });
  });
  app.querySelectorAll('[data-pin-part]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); togglePartPin(el.getAttribute('data-pin-part')); render(); });
  });
  app.querySelectorAll('tr.part-row-clickable').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('input, button, .icon-btn, .part-row-pin, .drawing-attach-icon')) return;
      state.selectedCompanyId = el.getAttribute('data-row-company');
      state.selectedPartId = el.getAttribute('data-row-part');
      state.view = 'tracking';
      render();
    });
  });

  const selectAllCheck = document.getElementById('selectAllCheck');
  if(selectAllCheck){
    selectAllCheck.addEventListener('change', (e)=>{
      e.stopPropagation();
      const company = getCompany(state.selectedCompanyId);
      const stages = company.stages;
      let parts = getMonthParts(company.id, activeMonthKey(company.id));
      if(state.search.trim()){
        const q = state.search.trim().toLowerCase();
        parts = parts.filter(p => (p.partNo||'').toLowerCase().includes(q) || (p.partName||'').toLowerCase().includes(q));
      }
      if(state.drawingFilter==='missing') parts = parts.filter(p => !(p.drawings && p.drawings.length));
      if(state.drawingFilter==='has') parts = parts.filter(p => p.drawings && p.drawings.length);
      if(state.shipmentFilter==='active') parts = parts.filter(p => partStatus(p, stages)!=='shipped');
      if(state.shipmentFilter==='shipped') parts = parts.filter(p => partStatus(p, stages)==='shipped');
      if(selectAllCheck.checked){ parts.forEach(p=> state.selectedPartIds.add(p.id)); }
      else { parts.forEach(p=> state.selectedPartIds.delete(p.id)); }
      render();
    });
  }
  app.querySelectorAll('[data-part-check]').forEach(el=>{
    el.addEventListener('click', (e)=> e.stopPropagation());
    el.addEventListener('change', ()=>{
      const id = el.getAttribute('data-part-check');
      if(el.checked){ state.selectedPartIds.add(id); } else { state.selectedPartIds.delete(id); }
      render();
    });
  });

  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      state.search = searchInput.value; render();
      setTimeout(()=>{ const i=document.getElementById('searchInput'); if(i){ i.focus(); i.selectionStart=i.selectionEnd=i.value.length; } },0);
    });
  }
  const shipmentFilterSelect = document.getElementById('shipmentFilterSelect');
  if(shipmentFilterSelect){
    shipmentFilterSelect.addEventListener('change', ()=>{
      state.shipmentFilter=shipmentFilterSelect.value; state.selectedPartIds=new Set();
      if(state.view==='tracking'){
        const c=getCompany(state.selectedCompanyId);
        if(c){
          const candidates=getMonthParts(c.id,activeMonthKey(c.id)).filter(p=>state.shipmentFilter==='all'||(state.shipmentFilter==='active'?partStatus(p,c.stages)!=='shipped':partStatus(p,c.stages)==='shipped'));
          if(candidates.length) state.selectedPartId=candidates[0].id;
        }
      }
      render();
    });
  }
  const drawingFilterSelect = document.getElementById('drawingFilterSelect');
  if(drawingFilterSelect){
    drawingFilterSelect.addEventListener('change', ()=>{ state.drawingFilter = drawingFilterSelect.value; state.selectedPartIds = new Set(); render(); });
  }
  const companyMonthSelect = document.getElementById('companyMonthSelect');
  if(companyMonthSelect){
    companyMonthSelect.addEventListener('change', ()=>{
      const cid = state.selectedCompanyId;
      state.selectedMonthByCompany[cid] = companyMonthSelect.value;
      state.selectedPartId = null; state.selectedPartIds = new Set(); state.partSearchQuery=''; state.partSearchOpen=false;
      render();
    });
  }
  const dashboardMonthSelect = document.getElementById('dashboardMonthSelect');
  if(dashboardMonthSelect){ dashboardMonthSelect.addEventListener('change', ()=>{ state.dashboardMonth = dashboardMonthSelect.value; render(); }); }
  const dashboardCompanySelect = document.getElementById('dashboardCompanySelect');
  if(dashboardCompanySelect){ dashboardCompanySelect.addEventListener('change', ()=>{ state.dashboardCompanyId=dashboardCompanySelect.value; state.dashboardCompanyMonth=null; render(); }); }
  const dashboardCompanyMonthSelect=document.getElementById('dashboardCompanyMonthSelect');
  if(dashboardCompanyMonthSelect){ dashboardCompanyMonthSelect.addEventListener('change', ()=>{ state.dashboardCompanyMonth=dashboardCompanyMonthSelect.value; render(); }); }

  const partSearchInput = document.getElementById('partSearchInput');
  if(partSearchInput){
    partSearchInput.addEventListener('focus', ()=>{
      if(__searchFocusGuard) return;
      state.partSearchOpen = true;
      render();
      setTimeout(()=>{
        const i=document.getElementById('partSearchInput');
        if(i){ __searchFocusGuard = true; i.focus(); i.value = state.partSearchQuery; __searchFocusGuard = false; }
      },0);
    });
    partSearchInput.addEventListener('input', ()=>{
      state.partSearchQuery = partSearchInput.value;
      state.partSearchOpen = true;
      render();
      setTimeout(()=>{
        const i=document.getElementById('partSearchInput');
        if(i){ __searchFocusGuard = true; i.focus(); i.value = state.partSearchQuery; i.selectionStart=i.selectionEnd=i.value.length; __searchFocusGuard = false; }
      },0);
    });
    partSearchInput.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ state.partSearchOpen=false; state.partSearchQuery=''; render(); } });
  }
  app.querySelectorAll('[data-search-select-part]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.selectedPartId = el.getAttribute('data-search-select-part');
      state.partSearchOpen = false;
      state.partSearchQuery = '';
      render();
    });
  });

  const drawingDropZone = document.getElementById('drawingDropZone');
  const drawingFileInput = document.getElementById('drawingFileInput');
  if(drawingDropZone && drawingFileInput){
    drawingDropZone.addEventListener('click', ()=> drawingFileInput.click());
    drawingFileInput.addEventListener('change', (e)=>{ if(e.target.files.length) handleDrawingUpload(e.target.files); });
  }
  app.querySelectorAll('[data-view-drawing]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const company = getCompany(state.selectedCompanyId);
      const part = getParts(company.id).find(p=>p.id===el.getAttribute('data-view-drawing'));
      const idx = Number(el.getAttribute('data-drawing-idx'));
      const drawing = part && part.drawings && part.drawings[idx];
      if(drawing){
        try{
          const blob = dataURLtoBlob(drawing.data);
          const blobUrl = URL.createObjectURL(blob);
          if(drawing.type && drawing.type.startsWith('image/')){
            const w = window.open();
            if(w){
              w.document.write(`<title>${escapeHtml(drawing.name)}</title><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;height:100vh;"><img src="${blobUrl}" style="max-width:100%;max-height:100%;"/></body>`);
            } else {
              showToast('Yeni sekme açılamadı — tarayıcınız pop-up engelliyor olabilir.');
            }
          } else {
            const w = window.open(blobUrl, '_blank');
            if(!w) showToast('Yeni sekme açılamadı — tarayıcınız pop-up engelliyor olabilir.');
          }
        }catch(e){
          console.error('drawing view error', e);
          showToast('Dosya açılamadı.');
        }
      }
    });
  });
  app.querySelectorAll('[data-remove-drawing]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const company = getCompany(state.selectedCompanyId);
      const part = getParts(company.id).find(p=>p.id===el.getAttribute('data-remove-drawing'));
      const idx = Number(el.getAttribute('data-drawing-idx'));
      if(part && part.drawings && part.drawings[idx]!==undefined){
        const [removed] = part.drawings.splice(idx, 1);
        moveDrawingToTrash(company, part, removed);
        await persistParts(company.id);
        await persistDrawingTrash();
        const trashId = state.drawingTrash[0].id;
        render();
        showToast('Teknik resim kaldırıldı. Çöp kutusunda 15 gün saklanır.', trashId);
      }
    });
  });

  app.querySelectorAll('[data-remove-measurement]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      syncTrackingFormToState();
      const company = getCompany(state.selectedCompanyId);
      const part = getParts(company.id).find(p=>p.id===state.selectedPartId);
      if(!part) return;
      part.measurements = (part.measurements||[]).filter(m=>m.id!==el.getAttribute('data-remove-measurement'));
      part.measurements.forEach((m,i)=> m.no = i+1);
      await persistParts(company.id);
      render();
    });
  });
  app.querySelectorAll('[data-mark-measurement]').forEach(el=>{
    el.addEventListener('click', ()=>{
      syncTrackingFormToState();
      state.markingMeasurementId = el.getAttribute('data-mark-measurement');
      render();
    });
  });
  app.querySelectorAll('[data-unmark-measurement]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      syncTrackingFormToState();
      const company = getCompany(state.selectedCompanyId);
      const part = getParts(company.id).find(p=>p.id===state.selectedPartId);
      const m = part && (part.measurements||[]).find(x=>x.id===el.getAttribute('data-unmark-measurement'));
      if(!m) return;
      m.imgX = null; m.imgY = null; m.drawingIndex = null;
      await persistParts(company.id);
      render();
    });
  });
  const cancelMarkBtn = app.querySelector('[data-action="cancelMarkMeasurement"]');
  if(cancelMarkBtn){
    cancelMarkBtn.addEventListener('click', ()=>{
      state.markingMeasurementId = null;
      render();
    });
  }
  const measureDrawingSurface = document.getElementById('measureDrawingSurface');
  if(measureDrawingSurface && state.markingMeasurementId){
    measureDrawingSurface.addEventListener('click', async (e)=>{
      syncTrackingFormToState();
      const company = getCompany(state.selectedCompanyId);
      const part = company ? getParts(company.id).find(p=>p.id===state.selectedPartId) : null;
      const m = part && (part.measurements||[]).find(x=>x.id===state.markingMeasurementId);
      if(!m) return;
      const rect = measureDrawingSurface.getBoundingClientRect();
      if(!rect.width || !rect.height) return;
      const xPct = Math.min(100, Math.max(0, ((e.clientX-rect.left)/rect.width)*100));
      const yPct = Math.min(100, Math.max(0, ((e.clientY-rect.top)/rect.height)*100));
      m.imgX = xPct; m.imgY = yPct; m.drawingIndex = state.measureDrawingIndex;
      state.markingMeasurementId = null;
      render();
      await persistParts(company.id);
    });
  }

  app.querySelectorAll('[data-stage-input]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const pid=state.selectedPartId, stage=inp.getAttribute('data-stage-input');
      state.lastEditedStageByPart[pid]=stage;
      state.stageDrafts[pid]=state.stageDrafts[pid]||{};
      state.stageDrafts[pid][stage]=Math.max(0,Number(inp.value)||0);
    });
  });
  app.querySelectorAll('[data-reject-input]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const pid=state.selectedPartId, stage=inp.getAttribute('data-reject-input');
      state.rejectDrafts[pid]=state.rejectDrafts[pid]||{};
      state.rejectDrafts[pid][stage]=Math.max(0,Number(inp.value)||0);
    });
  });

  const measureDrawingSelect = document.getElementById('measureDrawingSelect');
  if(measureDrawingSelect){
    measureDrawingSelect.addEventListener('change', ()=>{
      syncTrackingFormToState();
      state.measureDrawingIndex = Number(measureDrawingSelect.value)||0;
      state.markingMeasurementId = null;
      render();
    });
  }

  // Ölçüm işaretlerini teknik resim üzerinde sürükleyerek hassas konumlandır.
  app.querySelectorAll('[data-meas-marker]').forEach(marker=>{
    marker.addEventListener('dblclick', async (e)=>{
      e.preventDefault(); e.stopPropagation();
      if(!isAdmin()) return;
      syncTrackingFormToState();
      const company=getCompany(state.selectedCompanyId);
      const part=getParts(company.id).find(p=>p.id===state.selectedPartId);
      const m=part && (part.measurements||[]).find(x=>x.id===marker.getAttribute('data-meas-marker'));
      if(!m) return;
      m.imgX=null; m.imgY=null; m.drawingIndex=null;
      await persistParts(company.id);
      render();
    });
    marker.addEventListener('pointerdown', (e)=>{
      if(!isAdmin()) return;
      e.preventDefault(); e.stopPropagation();
      syncTrackingFormToState();
      const image=document.getElementById('measureDrawingSurface');
      const company=getCompany(state.selectedCompanyId);
      const part=getParts(company.id).find(p=>p.id===state.selectedPartId);
      const m=part && (part.measurements||[]).find(x=>x.id===marker.getAttribute('data-meas-marker'));
      if(!image || !m) return;
      marker.classList.add('dragging');
      try{ marker.setPointerCapture(e.pointerId); }catch(_){}
      const move=(ev)=>{
        const rect=image.getBoundingClientRect();
        const x=Math.min(100,Math.max(0,((ev.clientX-rect.left)/rect.width)*100));
        const y=Math.min(100,Math.max(0,((ev.clientY-rect.top)/rect.height)*100));
        m.imgX=x; m.imgY=y; m.drawingIndex=state.measureDrawingIndex;
        marker.style.left=x+'%'; marker.style.top=y+'%';
      };
      const up=async (ev)=>{
        move(ev); marker.classList.remove('dragging');
        marker.removeEventListener('pointermove',move); marker.removeEventListener('pointerup',up); marker.removeEventListener('pointercancel',up);
        await persistParts(company.id); render();
      };
      marker.addEventListener('pointermove',move); marker.addEventListener('pointerup',up); marker.addEventListener('pointercancel',up);
    });
  });

  app.querySelectorAll('[data-goto-part][data-goto-company]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const cid=row.getAttribute('data-goto-company'), pid=row.getAttribute('data-goto-part');
      const part=getParts(cid).find(p=>p.id===pid);
      state.selectedCompanyId=cid;
      if(part) state.selectedMonthByCompany[cid]=inferPartMonth(part);
      state.shipmentFilter='all'; state.selectedPartId=pid; state.view='tracking';
      render();
    });
  });

  const qualityFilterSelect = document.getElementById('qualityFilterSelect');
  if(qualityFilterSelect){ qualityFilterSelect.addEventListener('change', ()=>{ state.qualityFilter = qualityFilterSelect.value; render(); }); }

  const ncrCompanySelect = document.getElementById('ncrCompanySelect');
  if(ncrCompanySelect){
    ncrCompanySelect.addEventListener('change', ()=>{
      state.selectedCompanyId = ncrCompanySelect.value;
      render();
      state.modal = {type:'ncr', payload:{partId:null}};
      render();
    });
  }

  app.querySelectorAll('[data-remove-stage]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const company = getCompany(state.selectedCompanyId);
      const stageName = el.getAttribute('data-remove-stage');
      if(company.stages.length<=1){ showToast('En az bir üretim aşaması olmalı.'); return; }
      company.stages = company.stages.filter(s=>s!==stageName);
      persistCompanies();
      render();
      state.modal = {type:'stages'};
      render();
    });
  });

  app.querySelectorAll('[data-export-company]').forEach(el=>{
    el.addEventListener('click', ()=> exportCompanyExcel(el.getAttribute('data-export-company')));
  });

  app.querySelectorAll('[data-goto-part]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.selectedCompanyId = el.getAttribute('data-goto-company');
      state.selectedPartId = el.getAttribute('data-goto-part');
      state.view = 'tracking';
      render();
    });
  });

  app.querySelectorAll('[data-et-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.errorTrackingTab = el.getAttribute('data-et-tab'); render(); });
  });
  app.querySelectorAll('[data-remove-dis-hata]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      state.errorTracking.disHatalar = (state.errorTracking.disHatalar||[]).filter(h=>h.id!==el.getAttribute('data-remove-dis-hata'));
      await persistErrorTracking();
      showToast('Kayıt silindi.');
      render();
    });
  });
  app.querySelectorAll('[data-remove-ic-hata]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      state.errorTracking.icHatalar = (state.errorTracking.icHatalar||[]).filter(h=>h.id!==el.getAttribute('data-remove-ic-hata'));
      await persistErrorTracking();
      showToast('Kayıt silindi.');
      render();
    });
  });

  app.querySelectorAll('[data-trash-check]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const id = el.getAttribute('data-trash-check');
      if(el.checked){ state.selectedTrashIds.add(id); } else { state.selectedTrashIds.delete(id); }
      render();
    });
  });
  app.querySelectorAll('[data-restore-trash]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      await restoreTrashEntries([el.getAttribute('data-restore-trash')]);
      render();
    });
  });
  app.querySelectorAll('[data-delete-trash]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-delete-trash');
      if(!confirm('Bu teknik resmi kalıcı olarak silmek istediğinize emin misiniz?')) return;
      state.drawingTrash = (state.drawingTrash||[]).filter(t=>t.id!==id);
      state.selectedTrashIds.delete(id);
      await persistDrawingTrash();
      showToast('Kalıcı olarak silindi.');
      render();
    });
  });

  app.querySelectorAll('[data-close-ncr]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const [partId, ncrId] = el.getAttribute('data-close-ncr').split('|');
      const companyId = el.getAttribute('data-company');
      const part = getParts(companyId).find(p=>p.id===partId);
      const ncr = (part.ncrs||[]).find(n=>n.id===ncrId);
      if(ncr){
        ncr.status = 'kapali';
        ncr.closedDate = todayStr();
        ncr.closedBy = state.currentUser;
        await persistParts(companyId);
        showToast('Uygunsuzluk kaydı kapatıldı.');
        render();
      }
    });
  });

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  if(dropZone && fileInput){
    dropZone.addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', (e)=>{ if(e.target.files[0]) handleFileImport(e.target.files[0]); });
    dropZone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropZone.classList.add('drag'); });
    dropZone.addEventListener('dragleave', ()=> dropZone.classList.remove('drag'));
    dropZone.addEventListener('drop', (e)=>{
      e.preventDefault(); dropZone.classList.remove('drag');
      if(e.dataTransfer.files[0]) handleFileImport(e.dataTransfer.files[0]);
    });
  }

  const bulkFolderZone = document.getElementById('bulkFolderZone');
  const bulkFolderInput = document.getElementById('bulkFolderInput');
  if(bulkFolderZone && bulkFolderInput){
    bulkFolderZone.addEventListener('click', ()=> bulkFolderInput.click());
    bulkFolderInput.addEventListener('change', (e)=>{ if(e.target.files.length) handleBulkDrawingFiles(e.target.files); });
  }
  const bulkFilesZone = document.getElementById('bulkFilesZone');
  const bulkFilesInput = document.getElementById('bulkFilesInput');
  if(bulkFilesZone && bulkFilesInput){
    bulkFilesZone.addEventListener('click', ()=> bulkFilesInput.click());
    bulkFilesInput.addEventListener('change', (e)=>{ if(e.target.files.length) handleBulkDrawingFiles(e.target.files); });
  }

  const newStageInput = document.getElementById('newStageInput');
  if(newStageInput){ newStageInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleAction('addStage'); }); }
  const companyNameInput = document.getElementById('companyNameInput');
  if(companyNameInput){
    companyNameInput.focus();
    companyNameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ const btn = app.querySelector('[data-action="saveAddCompany"],[data-action="saveEditCompany"]'); if(btn) btn.click(); } });
  }
  renderPdfMeasurementSurface();
}

async function handleAction(action, el){
  switch(action){
    case 'switchUser': {
      fbAuth.signOut().catch(()=>{});
      state.currentUser = null; state.currentUserUid = null; state.currentUserRole = null;
      state.companies = []; state.partsByCompany = {}; state.selectedCompanyId = null; state.companyAccessCodes={}; state.staffInvites={}; state.accessUsers={};
      state.authView = 'login';
      render();
      break;
    }
    case 'recoverLegacyParts': {
      if(!isAdmin()) return;
      if(!confirm('Eski parça kayıtları taranıp mevcut güvenli verilerle birleştirilecek. Hiçbir eski kayıt silinmeyecek. Devam edilsin mi?')) return;
      showToast('Eski veriler taranıyor…');
      const result=await recoverLegacyParts();
      if(result.permissionDenied && result.legacyCompanies===0){
        alert('Eski kayıtların bulunduğu yola Firebase Rules erişimi şu anda engelliyor. Önce geçici KURTARMA Rules dosyasını Publish edin, bu butona tekrar basın; kurtarma tamamlanınca güvenli Rules\'a geri dönün.');
        break;
      }
      if(result.writeFailed){ alert('Kurtarma sırasında yeni güvenli veri yoluna yazma hatası oluştu. Veriler silinmedi.'); break; }
      await loadAll();
      alert(`Kurtarma tamamlandı.\n\nYeni geri eklenen parça: ${result.restored}\nMevcut kayıtla birleştirilen: ${result.mergedCount}\nEski veri bulunan şirket: ${result.legacyCompanies}\n\nEski parts:... kayıtları silinmedi.`);
      render();
      break;
    }
    case 'createStaffInvite': {
      if(!isAdmin()) return;
      const role=document.getElementById('staffInviteRoleSelect')?.value;
      if(!DEFAULT_STAGES.includes(role)){showToast('Geçerli bir rol seçin.');return;}
      const code=genAccessCode(); const item={role,active:true,createdAt:todayStr(),createdBy:state.currentUser};
      state.staffInvites[code]=item; await storageSet('staffInvites/'+code,item); showToast(role+' için personel davet kodu oluşturuldu.'); render(); break;
    }
    case 'revokeStaffInvite': {
      if(!isAdmin()) return;
      const code=el.getAttribute('data-code'); if(!code)return;
      delete state.staffInvites[code]; await storageDelete('staffInvites/'+code); showToast('Personel daveti iptal edildi.'); render(); break;
    }
    case 'openPromoteAdmin': {
      if(!isAdmin()) return;
      const targetUid=el.getAttribute('data-uid');
      const u=(state.accessUsers||{})[targetUid];
      if(!targetUid||!u||u.role==='admin') return;
      state.modal={type:'promoteAdmin',payload:{uid:targetUid}}; render(); break;
    }
    case 'confirmPromoteAdmin': {
      if(!isAdmin()) return;
      const targetUid=el.getAttribute('data-uid');
      const u=(state.accessUsers||{})[targetUid];
      if(!targetUid||!u||u.role==='admin'){state.modal=null;render();return;}
      const updated={...u,roleBeforeAdmin:u.role,role:'admin',promotedAt:todayStr(),promotedBy:state.currentUser};
      const ok=await storageSet('users/'+targetUid,updated);
      if(!ok){showToast('Yönetici yetkisi verilemedi.');return;}
      state.accessUsers[targetUid]=updated; state.modal=null;
      showToast((u.name||u.email||'Kullanıcı')+' artık yönetici.'); render(); break;
    }
    case 'openDemoteAdmin': {
      if(!isAdmin()) return;
      const targetUid=el.getAttribute('data-uid');
      const u=(state.accessUsers||{})[targetUid];
      const adminCount=Object.values(state.accessUsers||{}).filter(x=>x&&x.role==='admin').length;
      if(!targetUid||!u||u.role!=='admin') return;
      if(targetUid===state.currentUserUid){showToast('Kendi yönetici yetkinizi buradan kaldıramazsınız.');return;}
      if(adminCount<=1){showToast('Sistemde en az bir yönetici kalmalıdır.');return;}
      state.modal={type:'demoteAdmin',payload:{uid:targetUid}}; render(); break;
    }
    case 'confirmDemoteAdmin': {
      if(!isAdmin()) return;
      const targetUid=el.getAttribute('data-uid');
      const u=(state.accessUsers||{})[targetUid];
      const adminCount=Object.values(state.accessUsers||{}).filter(x=>x&&x.role==='admin').length;
      if(!targetUid||!u||u.role!=='admin'){state.modal=null;render();return;}
      if(targetUid===state.currentUserUid){showToast('Kendi yönetici yetkinizi kaldıramazsınız.');return;}
      if(adminCount<=1){showToast('Sistemde en az bir yönetici kalmalıdır.');return;}
      const newRole=document.getElementById('demoteRoleSelect')?.value;
      if(!(DEFAULT_STAGES.includes(newRole)||(newRole==='client'&&u.companyId))){showToast('Geçerli bir yeni rol seçin.');return;}
      const updated={...u,role:newRole,adminRemovedAt:todayStr(),adminRemovedBy:state.currentUser};
      delete updated.roleBeforeAdmin;
      const ok=await storageSet('users/'+targetUid,updated);
      if(!ok){showToast('Yönetici yetkisi kaldırılamadı.');return;}
      state.accessUsers[targetUid]=updated; state.modal=null;
      showToast((u.name||u.email||'Kullanıcı')+' için yönetici yetkisi kaldırıldı.'); render(); break;
    }
    case 'openAddCompany': state.modal = {type:'addCompany'}; render(); break;
    case 'closeModal': state.modal=null; state.importPreview=null; render(); break;
    case 'gotoCompanies': state.view='companies'; render(); break;
    case 'gotoParts': state.view='parts'; render(); break;

    case 'saveAddCompany': {
      const name = document.getElementById('companyNameInput').value.trim();
      if(!name){ showToast('Şirket adı boş olamaz.'); return; }
      const newCo = {id: uid('co'), name, createdAt: new Date().toLocaleDateString('tr-TR'), stages: DEFAULT_STAGES.slice(), months:[currentMonthKey()]};
      const newCode = genClientCode();
      state.companyAccessCodes[newCo.id]=newCode;
      state.companies.push(newCo);
      state.partsByCompany[newCo.id] = [];
      state.selectedCompanyId = newCo.id;
      state.modal = null;
      await persistCompanies();
      await storageSet('parts/'+newCo.id, []);
      await storageSet('companyAccessCodes/'+newCo.id, newCode);
      await storageSet('clientInvites/'+newCode, {companyId:newCo.id,active:true,createdAt:todayStr()});
      showToast('Şirket eklendi: ' + name);
      render();
      break;
    }
    case 'saveEditCompany': {
      const id = el.getAttribute('data-id');
      const name = document.getElementById('companyNameInput').value.trim();
      if(!name){ showToast('Şirket adı boş olamaz.'); return; }
      const co = getCompany(id);
      co.name = name;
      state.modal = null;
      await persistCompanies();
      showToast('Şirket güncellendi.');
      render();
      break;
    }
    case 'regenClientCode': {
      const id = el.getAttribute('data-id');
      const co = getCompany(id);
      if(co){
        const oldCode=(state.companyAccessCodes||{})[id]||'';
        const newCode=genClientCode();
        state.companyAccessCodes[id]=newCode;
        await storageSet('companyAccessCodes/'+id,newCode);
        await storageSet('clientInvites/'+newCode,{companyId:id,active:true,createdAt:todayStr()});
        if(oldCode) await storageDelete('clientInvites/'+oldCode);
        showToast('Müşteri davet kodu yenilendi.');
        state.modal = {type:'editCompany', payload:{id}};
        render();
      }
      break;
    }
    case 'confirmDeleteCompany': {
      const id = el.getAttribute('data-id');
      state.companies = state.companies.filter(c=>c.id!==id);
      delete state.partsByCompany[id];
      if(state.selectedCompanyId===id) state.selectedCompanyId = state.companies[0]?.id || null;
      state.modal = null;
      await persistCompanies();
      await storageDelete('parts/'+id);
      const oldCode=(state.companyAccessCodes||{})[id]||'';
      if(oldCode) await storageDelete('clientInvites/'+oldCode);
      await storageDelete('companyAccessCodes/'+id);
      delete state.companyAccessCodes[id];
      showToast('Şirket silindi.');
      render();
      break;
    }

    case 'openAddMonth': state.modal = {type:'addMonth'}; render(); break;
    case 'saveAddMonth': {
      const company=getCompany(state.selectedCompanyId);
      const input=document.getElementById('newMonthInput');
      const key=input && input.value;
      if(!company || !/^\d{4}-\d{2}$/.test(key||'')){ showToast('Geçerli bir ay seçin.'); return; }
      company.months=ensureCompanyMonths(company,getParts(company.id));
      if(!company.months.includes(key)) company.months.push(key);
      company.months.sort(); state.selectedMonthByCompany[company.id]=key; state.selectedPartId=null; state.selectedPartIds=new Set(); state.modal=null;
      await persistCompanies(); showToast(monthLabel(key)+' sipariş ayı açıldı.'); render(); break;
    }
    case 'openAddPart': state.modal = {type:'addPart'}; render(); break;
    case 'saveAddPart': {
      const company = getCompany(state.selectedCompanyId);
      const partNo = document.getElementById('partNoInput').value.trim();
      const partName = document.getElementById('partNameInput').value.trim();
      const qty = Number(document.getElementById('partQtyInput').value) || 0;
      const colorVal = document.getElementById('partColorInput') ? document.getElementById('partColorInput').value.trim() : '';
      const dueDateVal = document.getElementById('partDueDateInput') ? document.getElementById('partDueDateInput').value : '';
      const orderMonth = (document.getElementById('partMonthInput')||{}).value || activeMonthKey(company.id);
      if(!partNo){ showToast('Parça no zorunludur.'); return; }
      const parts = getParts(company.id);
      const existing = parts.find(p=>(p.partNo||'').toLowerCase()===partNo.toLowerCase() && inferPartMonth(p)===orderMonth);
      let newPartId = null;
      if(existing){
        existing.partName = partName; existing.orderedQty = qty; existing.color = colorVal; existing.dueDate = dueDateVal; existing.orderMonth=orderMonth;
        existing.lastUpdate = todayStr(); existing.updatedBy = state.currentUser; newPartId = existing.id;
      } else {
        newPartId = uid('pt');
        parts.push({id:newPartId, partNo, partName, orderedQty:qty, color:colorVal, dueDate:dueDateVal, orderMonth, qtys:{}, rejects:{}, note:'', drawings:[], measurements:[], lastUpdate:todayStr(), updatedBy:state.currentUser, history:[], ncrs:[], returnEvents:[],qualityEvents:[],productionIssues:[],dismissedNcrSuggestions:[],processProfile:{}});
      }
      company.months=ensureCompanyMonths(company,parts);
      if(!company.months.includes(orderMonth)) company.months.push(orderMonth);
      company.months.sort(); state.selectedMonthByCompany[company.id]=orderMonth;
      state.partsByCompany[company.id] = parts;
      state.modal = null;
      state.selectedPartId = newPartId;
      await Promise.all([persistParts(company.id),persistCompanies()]);
      showToast('Parça kaydedildi.');
      render();
      break;
    }
    case 'saveEditPart': {
      const company = getCompany(state.selectedCompanyId);
      const id = el.getAttribute('data-id');
      const part = getParts(company.id).find(p=>p.id===id);
      part.partName = document.getElementById('partNameInput').value.trim();
      part.orderedQty = Number(document.getElementById('partQtyInput').value) || 0;
      const newOrderMonth=(document.getElementById('partMonthInput')||{}).value || inferPartMonth(part);
      part.orderMonth=newOrderMonth; state.selectedMonthByCompany[company.id]=newOrderMonth;
      part.color = document.getElementById('partColorInput') ? document.getElementById('partColorInput').value.trim() : (part.color||'');
      part.dueDate = document.getElementById('partDueDateInput') ? document.getElementById('partDueDateInput').value : (part.dueDate||'');
      part.lastUpdate = todayStr();
      part.updatedBy = state.currentUser;
      state.modal = null;
      ensureCompanyMonths(company,getParts(company.id));
      await Promise.all([persistParts(company.id),persistCompanies()]);
      showToast('Parça güncellendi.');
      render();
      break;
    }
    case 'confirmDeletePart': {
      const company = getCompany(state.selectedCompanyId);
      const id = el.getAttribute('data-id');
      state.partsByCompany[company.id] = getParts(company.id).filter(p=>p.id!==id);
      state.modal = null;
      await persistParts(company.id);
      showToast('Parça silindi.');
      render();
      break;
    }

    case 'openStages': state.modal = {type:'stages'}; render(); break;
    case 'addStage': {
      const company = getCompany(state.selectedCompanyId);
      const input = document.getElementById('newStageInput');
      const val = input.value.trim();
      if(!val){ return; }
      if(company.stages.some(s=>s.toLowerCase()===val.toLowerCase())){ showToast('Bu aşama zaten mevcut.'); return; }
      company.stages.push(val);
      await persistCompanies();
      render();
      state.modal = {type:'stages'};
      render();
      break;
    }

    case 'openImport': state.importPreview = null; state.modal = {type:'import'}; render(); break;
    case 'openBulkDrawings': state.bulkDrawingPreview = null; state.modal = {type:'bulkDrawings'}; render(); break;
    case 'cancelBulkDrawings': state.bulkDrawingPreview = null; render(); break;
    case 'confirmBulkDrawings': await confirmBulkDrawings(); break;
    case 'cancelImportPreview': state.importPreview = null; render(); break;
    case 'confirmImport': {
      const company = getCompany(state.selectedCompanyId);
      const parts = getParts(company.id);
      const orderMonth = activeMonthKey(company.id);
      let added=0, updated=0;
      state.importPreview.rows.forEach(r=>{
        const existing = parts.find(p=>(p.partNo||'').toLowerCase()===r.partNo.toLowerCase() && inferPartMonth(p)===orderMonth);
        if(existing){
          existing.partName = r.partName || existing.partName;
          existing.orderedQty = r.orderedQty; existing.orderMonth=orderMonth;
          existing.lastUpdate = todayStr();
          existing.updatedBy = state.currentUser;
          updated++;
        } else {
          parts.push({id:uid('pt'), partNo:r.partNo, partName:r.partName, orderedQty:r.orderedQty, color:'', dueDate:'', orderMonth, qtys:{}, rejects:{}, note:'', drawings:[], measurements:[], lastUpdate:todayStr(), updatedBy:state.currentUser, history:[], ncrs:[], returnEvents:[],qualityEvents:[],productionIssues:[],dismissedNcrSuggestions:[],processProfile:{}});
          added++;
        }
      });
      state.partsByCompany[company.id] = parts;
      state.importPreview = null;
      state.modal = null;
      await persistParts(company.id);
      showToast(`İçe aktarıldı: ${added} yeni, ${updated} güncellendi.`);
      render();
      break;
    }

    case 'saveTracking': {
      const company = getCompany(state.selectedCompanyId);
      const partId = el.getAttribute('data-part');
      const part = getParts(company.id).find(p=>p.id===partId);
      const inputs = document.querySelectorAll('[data-stage-input]');
      const rejectInputs = document.querySelectorAll('[data-reject-input]');
      const now = todayStr();
      let changed = false;
      const previousCurrentIdx=getCurrentStageIndex(part, company.stages);
      const previousCurrentStage=previousCurrentIdx>=0?company.stages[previousCurrentIdx]:null;
      const stageChanges=[];
      inputs.forEach(inp=>{
        const stage=inp.getAttribute('data-stage-input');
        if(!canEditStage(stage)) return;
        const newVal=Math.max(0,Number(inp.value)||0);
        if(!part.qtys) part.qtys={};
        const oldVal=Number(part.qtys[stage]||0);
        if(newVal!==oldVal){ part.qtys[stage]=newVal; stageChanges.push({stage,newVal,oldVal}); changed=true; }
      });
      if(stageChanges.length){
        part.history=part.history||[];
        const preferred=state.lastEditedStageByPart[part.id]||null;
        stageChanges.sort((a,b)=>{
          if(a.stage===preferred && b.stage!==preferred) return 1;
          if(b.stage===preferred && a.stage!==preferred) return -1;
          return company.stages.indexOf(a.stage)-company.stages.indexOf(b.stage);
        });
        stageChanges.forEach(ch=>part.history.push({date:now,stage:ch.stage,qty:ch.newVal,reject:false,user:state.currentUser}));
        const lastChange=stageChanges[stageChanges.length-1];
        const targetIdx=company.stages.indexOf(lastChange.stage);
        if(previousCurrentStage && targetIdx>=0 && targetIdx<previousCurrentIdx && lastChange.newVal>0){
          part.returnEvents=part.returnEvents||[];
          part.returnEvents.push({id:uid('ret'),date:now,fromStage:previousCurrentStage,toStage:lastChange.stage,qty:lastChange.newVal,user:state.currentUser,note:'İleri bir prosesten önceki prosese geri dönüş'});
        }
      }
      delete state.lastEditedStageByPart[part.id];
      delete state.stageDrafts[part.id]; delete state.rejectDrafts[part.id];
      rejectInputs.forEach(inp=>{
        const stage = inp.getAttribute('data-reject-input');
        if(!canEditStage(stage)) return;
        const newVal = Math.max(0, Number(inp.value)||0);
        if(!part.rejects) part.rejects={};
        const oldVal = Number(part.rejects[stage]||0);
        if(newVal !== oldVal){
          part.rejects[stage] = newVal;
          part.history = part.history || [];
          part.history.push({date: now, stage, qty: newVal, reject:true, user: state.currentUser});
          changed = true;
        }
      });
      if(isAdmin()){
        const noteVal = document.getElementById('partNoteInput').value;
        if(noteVal !== (part.note||'')){ part.note = noteVal; changed = true; }
        const colorInput = document.getElementById('partColorTrackInput');
        if(colorInput){
          const colorVal = colorInput.value.trim();
          if(colorVal !== (part.color||'')){ part.color = colorVal; changed = true; }
        }
      }
      // Ölçüm kontrolü değerlerini topla (yalnızca yönetici)
      part.measurements = part.measurements || [];
      if(isAdmin()){
        document.querySelectorAll('[data-meas-value]').forEach(inp=>{
          const m = part.measurements.find(x=>x.id===inp.getAttribute('data-meas-value'));
          if(m){ const v = inp.value===''?'':parseDecimal(inp.value); if(v!==m.measuredValue){ m.measuredValue=v; changed=true; } }
        });
        document.querySelectorAll('[data-meas-nominal]').forEach(inp=>{
          const m = part.measurements.find(x=>x.id===inp.getAttribute('data-meas-nominal'));
          if(m){ const v = inp.value===''?'':parseDecimal(inp.value); if(v!==m.nominalValue){ m.nominalValue=v; changed=true; } }
        });
        document.querySelectorAll('[data-meas-tol]').forEach(inp=>{
          const m = part.measurements.find(x=>x.id===inp.getAttribute('data-meas-tol'));
          if(m){ const v = inp.value===''?'':parseDecimal(inp.value); if(v!==m.tolerance){ m.tolerance=v; changed=true; } }
        });
      }
      const autoNcrCount=ensureAutomaticMeasurementNcrs(part);
      if(autoNcrCount>0) changed=true;
      if(changed){ part.lastUpdate = now; part.updatedBy = state.currentUser; }
      await persistParts(company.id);
      showToast(autoNcrCount>0 ? `${autoNcrCount} tolerans dışı ölçüm için NCR otomatik açıldı.` : (changed ? 'Üretim verileri güncellendi.' : 'Değişiklik yok.'));
      render();
      break;
    }


    case 'saveProcessProfile': {
      const company=getCompany(state.selectedCompanyId);
      const part=getParts(company.id).find(p=>p.id===el.getAttribute('data-part'));
      if(!part) return;
      ensurePartQualityData(part);
      part.processProfile={
        material:(document.getElementById('ppMaterial')?.value||'').trim(),
        thickness:document.getElementById('ppThickness')?.value===''?'':parseDecimal(document.getElementById('ppThickness')?.value),
        width:Number(document.getElementById('ppWidth')?.value)||0,
        length:Number(document.getElementById('ppLength')?.value)||0,
        holeCount:Number(document.getElementById('ppHoles')?.value)||0,
        bendCount:Number(document.getElementById('ppBends')?.value)||0,
        weldLengthMm:Number(document.getElementById('ppWeld')?.value)||0,
        complexity:document.getElementById('ppComplexity')?.value||'normal',

    case 'analyzeDrawingPdf': {
      const company=getCompany(state.selectedCompanyId);
      const part=getParts(company.id).find(p=>p.id===el.getAttribute('data-part'));
      if(!part) return;
      const pdf=(part.drawings||[]).find(d=>d.type==='application/pdf'||/\.pdf$/i.test(d.name||''));
      if(!pdf){showToast('Bu parçada PDF teknik resim yok.');return;}
      if(!window.pdfjsLib){showToast('PDF analiz kütüphanesi yüklenemedi.');return;}
      try{
        const raw=await (await fetch(pdf.data)).arrayBuffer();
        pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const doc=await pdfjsLib.getDocument({data:raw}).promise;
        const page=await doc.getPage(1), tc=await page.getTextContent();
        const text=tc.items.map(x=>x.str).join(' ');
        ensurePartQualityData(part);
        const prof=processProfile(part);
        const th=text.match(/(?:THK|THICKNESS|KALINLIK|SAC|T)\s*[:=]?\s*(\d+(?:[.,]\d+)?)/i);
        const dim=text.match(/(\d{2,4}(?:[.,]\d+)?)\s*[xX×]\s*(\d{2,4}(?:[.,]\d+)?)/);
        const holes=[...text.matchAll(/(\d+)\s*[xX]\s*[Ø⌀]\s*\d+(?:[.,]\d+)?/g)].reduce((a,m)=>a+(Number(m[1])||0),0);
        const toNum=s=>parseDecimal(s);
        if(th) prof.thickness=toNum(th[1]);
        if(dim){prof.width=toNum(dim[1]);prof.length=toNum(dim[2]);}
        if(holes) prof.holeCount=holes;
        const tolerances=[...text.matchAll(/±\s*(\d+(?:[.,]\d+)?)/g)].map(m=>toNum(m[1])).filter(Number.isFinite);
        if(tolerances.length && Math.min(...tolerances)<=.1) prof.toleranceClass='precision';
        prof.autoAnalyzedAt=todayStr(); prof.autoAnalysisSource=pdf.name;
        part.processProfile=prof;
        await persistParts(company.id);
        showToast((th||dim||holes||tolerances.length)?'PDF metin katmanından ön analiz çıkarıldı. Değerleri kontrol edip Analizi Kaydet’e basın.':'PDF okundu fakat güvenilir ölçü bilgisi bulunamadı; alanları elle doldurun.');
