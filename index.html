        ` : `<div class="helper-text">Eşleşen dosya bulunamadı.</div>`}
        ${preview.unmatched.length>0 ? `
        <div class="section-title" style="font-size:15px;margin-top:16px;">Eşleşmeyenler</div>
        <table class="preview-table">
          <thead><tr><th>Dosya</th><th>Sebep</th></tr></thead>
          <tbody>
            ${preview.unmatched.slice(0,10).map(u=>`<tr><td>${escapeHtml(u.file.name)}</td><td style="color:var(--red-700);">${escapeHtml(u.reason)}</td></tr>`).join('')}
          </tbody>
        </table>
        ${preview.unmatched.length>10 ? `<div class="helper-text">…ve ${preview.unmatched.length-10} tane daha</div>` : ''}
        ` : ''}
      `}
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        ${preview ? `
          <button class="btn btn-ghost" data-action="cancelBulkDrawings">Farklı Dosya Seç</button>
          ${preview.matches.length>0 ? `<button class="btn btn-primary" data-action="confirmBulkDrawings">${preview.matches.length} Teknik Resmi İçe Aktar</button>` : ''}
        ` : ''}
      </div>
    `, 'wide');
  }
  if(m.type==='bulkRename'){
    const count = state.selectedPartIds.size;
    return modalWrap(`
      <h2>Toplu Parça Adı Değiştir</h2>
      <div class="modal-sub">${count} parça seçili. Aşağıdaki işlem yalnızca seçili parçaların adını değiştirir.</div>
      <div class="field">
        <label>İşlem Türü</label>
        <div class="radio-row-mode">
          <label><input type="radio" name="bulkMode" value="replace" checked/> Metin içinde bul ve değiştir</label>
          <label><input type="radio" name="bulkMode" value="prefix"/> Başa metin ekle (önek)</label>
          <label><input type="radio" name="bulkMode" value="suffix"/> Sona metin ekle (sonek)</label>
        </div>
      </div>
      <div class="field"><label>Bul</label><input type="text" id="bulkFindInput" placeholder="Örn. Braket"/></div>
      <div class="field"><label>Değiştir</label><input type="text" id="bulkReplaceInput" placeholder="Örn. Destek Braketi"/></div>
      <div class="field"><label>Önek / Sonek Metni</label><input type="text" id="bulkTextInput" placeholder="Örn. REV2- veya -A"/></div>
      <div class="helper-text">"Bul ve değiştir" modunda yalnızca ilk iki alan; "önek/sonek" modunda yalnızca üçüncü alan kullanılır.</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        <button class="btn btn-primary" data-action="applyBulkRename">Uygula (${count} parça)</button>
      </div>
    `);
  }
  if(m.type==='ncr'){
    const isGlobal = !m.payload.partId;
    const company = getCompany(state.selectedCompanyId);
    let stageOptions = company ? company.stages : DEFAULT_STAGES;
    let partOptionsHtml = '';
    if(isGlobal){
      partOptionsHtml = `
        <div class="field">
          <label>Şirket</label>
          <select id="ncrCompanySelect">
            ${state.companies.map(c=>`<option value="${c.id}" ${c.id===state.selectedCompanyId?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Parça</label>
          <select id="ncrPartSelect">
            ${getParts(state.selectedCompanyId).map(p=>`<option value="${p.id}">${escapeHtml(p.partNo)} — ${escapeHtml(p.partName)}</option>`).join('')}
          </select>
        </div>`;
    }
    return modalWrap(`
      <h2>Uygunsuzluk Kaydı (NCR)</h2>
      <div class="modal-sub">${isGlobal ? 'Şirket ve parça seçerek yeni bir uygunsuzluk kaydı açın.' : escapeHtml(getParts(state.selectedCompanyId).find(p=>p.id===m.payload.partId)?.partNo || '')}</div>
      ${partOptionsHtml}
      <div class="field">
        <label>Aşama</label>
        <select id="ncrStageSelect">
          ${stageOptions.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Uygunsuzluk Açıklaması</label>
        <textarea id="ncrDescInput" placeholder="Örn. Ölçü toleransı dışında, yüzeyde çatlak vb."></textarea>
      </div>
      <div class="field">
        <label>Düzeltici Faaliyet (opsiyonel)</label>
        <textarea id="ncrActionInput" placeholder="Alınacak / alınan aksiyon"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-action="closeModal">Vazgeç</button>
        <button class="btn btn-primary" data-action="saveNcr" data-part="${m.payload.partId||''}">Kaydı Aç</button>
      </div>
    `);
  }
  return '';
}
function modalWrap(inner, size){
  return `<div class="modal-overlay" id="modalOverlay">
    <div class="modal ${size==='wide'?'wide':''} modal-wrap-pos">
      <div class="modal-close" data-action="closeModal">✕</div>
      ${inner}
    </div>
  </div>`;
}

/* ============================= EVENT HANDLERS ============================= */
function attachHandlers(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.view = el.getAttribute('data-nav'); render(); });
  });

  app.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', (e)=> handleAction(el.getAttribute('data-action'), el, e));
  });

  app.querySelectorAll('[data-select-company]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('[data-edit-company]') || e.target.closest('[data-delete-company]')) return;
      state.selectedCompanyId = el.getAttribute('data-select-company');
      state.selectedPartIds = new Set();
      render();
    });
  });
  app.querySelectorAll('[data-select-company-btn]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); state.selectedCompanyId = el.getAttribute('data-select-company-btn'); state.selectedPartIds = new Set(); render(); });
  });
  app.querySelectorAll('[data-edit-company]').forEach(el=>{
    el.addEventListener('click',(e)=>{ e.stopPropagation(); state.modal = {type:'editCompany', payload:{id: el.getAttribute('data-edit-company')}}; render(); });
  });
  app.querySelectorAll('[data-delete-company]').forEach(el=>{
    el.addEventListener('click',(e)=>{ e.stopPropagation(); state.modal = {type:'deleteCompany', payload:{id: el.getAttribute('data-delete-company')}}; render(); });
  });

  app.querySelectorAll('[data-edit-part]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.modal = {type:'editPart', payload:{id: el.getAttribute('data-edit-part')}}; render(); });
  });
  app.querySelectorAll('[data-delete-part]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.modal = {type:'deletePart', payload:{id: el.getAttribute('data-delete-part')}}; render(); });
  });
  app.querySelectorAll('[data-track-part]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.selectedPartId = el.getAttribute('data-track-part'); state.view='tracking'; render(); });
  });

  const selectAllCheck = document.getElementById('selectAllCheck');
  if(selectAllCheck){
    selectAllCheck.addEventListener('change', ()=>{
      const company = getCompany(state.selectedCompanyId);
      let parts = getParts(company.id);
      if(state.search.trim()){
        const q = state.search.trim().toLowerCase();
        parts = parts.filter(p => p.partNo.toLowerCase().includes(q) || p.partName.toLowerCase().includes(q));
      }
      if(selectAllCheck.checked){ parts.forEach(p=> state.selectedPartIds.add(p.id)); }
      else { parts.forEach(p=> state.selectedPartIds.delete(p.id)); }
      render();
    });
  }
  app.querySelectorAll('[data-part-check]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const id = el.getAttribute('data-part-check');
      if(el.checked){ state.selectedPartIds.add(id); } else { state.selectedPartIds.delete(id); }
      render();
    });
  });

  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{
      state.search = searchInput.value; render();
      setTimeout(()=>{ const i=document.getElementById('searchInput'); if(i){ i.focus(); i.selectionStart=i.selectionEnd=i.value.length; } },0);
    });
  }

  const partSearchInput = document.getElementById('partSearchInput');
  if(partSearchInput){
    partSearchInput.addEventListener('input', ()=>{
      const val = partSearchInput.value;
      const company = getCompany(state.selectedCompanyId);
      const parts = getParts(company.id);
      const match = parts.find(p => `${p.partNo} — ${p.partName}` === val);
      if(match){ state.selectedPartId = match.id; render(); }
    });
  }

  const drawingDropZone = document.getElementById('drawingDropZone');
  const drawingFileInput = document.getElementById('drawingFileInput');
  if(drawingDropZone && drawingFileInput){
    drawingDropZone.addEventListener('click', ()=> drawingFileInput.click());
    drawingFileInput.addEventListener('change', (e)=>{ if(e.target.files[0]) handleDrawingUpload(e.target.files[0]); });
  }
  app.querySelectorAll('[data-view-drawing]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const company = getCompany(state.selectedCompanyId);
      const part = getParts(company.id).find(p=>p.id===el.getAttribute('data-view-drawing'));
      if(part && part.drawing){
        const w = window.open();
        if(w){
          if(part.drawing.type && part.drawing.type.startsWith('image/')){
            w.document.write(`<title>${escapeHtml(part.drawing.name)}</title><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;height:100vh;"><img src="${part.drawing.data}" style="max-width:100%;max-height:100%;"/></body>`);
          } else {
            w.location = part.drawing.data;
          }
        }
      }
    });
  });
  app.querySelectorAll('[data-remove-drawing]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const company = getCompany(state.selectedCompanyId);
      const part = getParts(company.id).find(p=>p.id===el.getAttribute('data-remove-drawing'));
      if(part){
        part.drawing = null;
        await persistParts(company.id);
        showToast('Teknik resim kaldırıldı.');
        render();
      }
    });
  });

  app.querySelectorAll('[data-remove-measurement]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      syncTrackingFormToState();
      const company = getCompany(state.selectedCompanyId);
      const part = getParts(company.id).find(p=>p.id===state.selectedPartId);
      if(!part) return;
      part.measurements = (part.measurements||[]).filter(m=>m.id!==el.getAttribute('data-remove-measurement'));
      part.measurements.forEach((m,i)=> m.no = i+1);
      await persistParts(company.id);
      render();
    });
  });
  app.querySelectorAll('[data-mark-measurement]').forEach(el=>{
    el.addEventListener('click', ()=>{
      syncTrackingFormToState();
      state.markingMeasurementId = el.getAttribute('data-mark-measurement');
      render();
    });
  });
  const measureImageEl = document.getElementById('measureImageEl');
  if(measureImageEl && state.markingMeasurementId){
    measureImageEl.addEventListener('click', async (e)=>{
      syncTrackingFormToState();
      const company = getCompany(state.selectedCompanyId);
      const part = getParts(company.id).find(p=>p.id===state.selectedPartId);
      const m = part && (part.measurements||[]).find(x=>x.id===state.markingMeasurementId);
      if(!m) return;
      const rect = measureImageEl.getBoundingClientRect();
      const xPct = Math.min(100, Math.max(0, ((e.clientX-rect.left)/rect.width)*100));
      const yPct = Math.min(100, Math.max(0, ((e.clientY-rect.top)/rect.height)*100));
      m.imgX = xPct; m.imgY = yPct;
      state.markingMeasurementId = null;
      await persistParts(company.id);
      render();
    });
  }

  const qualityFilterSelect = document.getElementById('qualityFilterSelect');
  if(qualityFilterSelect){ qualityFilterSelect.addEventListener('change', ()=>{ state.qualityFilter = qualityFilterSelect.value; render(); }); }

  const ncrCompanySelect = document.getElementById('ncrCompanySelect');
  if(ncrCompanySelect){
    ncrCompanySelect.addEventListener('change', ()=>{
      state.selectedCompanyId = ncrCompanySelect.value;
      render();
      state.modal = {type:'ncr', payload:{partId:null}};
      render();
    });
  }

  app.querySelectorAll('[data-remove-stage]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const company = getCompany(state.selectedCompanyId);
      const stageName = el.getAttribute('data-remove-stage');
      if(company.stages.length<=1){ showToast('En az bir üretim aşaması olmalı.'); return; }
      company.stages = company.stages.filter(s=>s!==stageName);
      persistCompanies();
      render();
      state.modal = {type:'stages'};
      render();
    });
  });

  app.querySelectorAll('[data-export-company]').forEach(el=>{
    el.addEventListener('click', ()=> exportCompanyExcel(el.getAttribute('data-export-company')));
  });

  app.querySelectorAll('[data-close-ncr]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const [partId, ncrId] = el.getAttribute('data-close-ncr').split('|');
      const companyId = el.getAttribute('data-company');
      const part = getParts(companyId).find(p=>p.id===partId);
      const ncr = (part.ncrs||[]).find(n=>n.id===ncrId);
      if(ncr){
        ncr.status = 'kapali';
        ncr.closedDate = todayStr();
        ncr.closedBy = state.currentUser;
        await persistParts(companyId);
        showToast('Uygunsuzluk kaydı kapatıldı.');
        render();
      }
    });
  });

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  if(dropZone && fileInput){
    dropZone.addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', (e)=>{ if(e.target.files[0]) handleFileImport(e.target.files[0]); });
    dropZone.addEventListener('dragover', (e)=>{ e.preventDefault(); dropZone.classList.add('drag'); });
    dropZone.addEventListener('dragleave', ()=> dropZone.classList.remove('drag'));
    dropZone.addEventListener('drop', (e)=>{
      e.preventDefault(); dropZone.classList.remove('drag');
      if(e.dataTransfer.files[0]) handleFileImport(e.dataTransfer.files[0]);
    });
  }

  const bulkFolderZone = document.getElementById('bulkFolderZone');
  const bulkFolderInput = document.getElementById('bulkFolderInput');
  if(bulkFolderZone && bulkFolderInput){
    bulkFolderZone.addEventListener('click', ()=> bulkFolderInput.click());
    bulkFolderInput.addEventListener('change', (e)=>{ if(e.target.files.length) handleBulkDrawingFiles(e.target.files); });
  }
  const bulkFilesZone = document.getElementById('bulkFilesZone');
  const bulkFilesInput = document.getElementById('bulkFilesInput');
  if(bulkFilesZone && bulkFilesInput){
    bulkFilesZone.addEventListener('click', ()=> bulkFilesInput.click());
    bulkFilesInput.addEventListener('change', (e)=>{ if(e.target.files.length) handleBulkDrawingFiles(e.target.files); });
  }

  const newStageInput = document.getElementById('newStageInput');
  if(newStageInput){ newStageInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleAction('addStage'); }); }
  const companyNameInput = document.getElementById('companyNameInput');
  if(companyNameInput){
    companyNameInput.focus();
    companyNameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ const btn = app.querySelector('[data-action="saveAddCompany"],[data-action="saveEditCompany"]'); if(btn) btn.click(); } });
  }
}

async function handleAction(action, el){
  switch(action){
    case 'switchUser': {
      fbAuth.signOut().catch(()=>{});
      state.currentUser = null; state.currentUserUid = null; state.currentUserRole = null;
      state.companies = []; state.partsByCompany = {}; state.selectedCompanyId = null;
      state.authView = 'login';
      render();
      break;
    }
    case 'openAddCompany': state.modal = {type:'addCompany'}; render(); break;
    case 'closeModal': state.modal=null; state.importPreview=null; render(); break;
    case 'gotoCompanies': state.view='companies'; render(); break;
    case 'gotoParts': state.view='parts'; render(); break;

    case 'saveAddCompany': {
      const name = document.getElementById('companyNameInput').value.trim();
      if(!name){ showToast('Şirket adı boş olamaz.'); return; }
      const newCo = {id: uid('co'), name, createdAt: new Date().toLocaleDateString('tr-TR'), stages: DEFAULT_STAGES.slice()};
      state.companies.push(newCo);
      state.partsByCompany[newCo.id] = [];
      state.selectedCompanyId = newCo.id;
      state.modal = null;
      await persistCompanies();
      await storageSet('parts:'+newCo.id, []);
      showToast('Şirket eklendi: ' + name);
      render();
      break;
    }
    case 'saveEditCompany': {
      const id = el.getAttribute('data-id');
      const name = document.getElementById('companyNameInput').value.trim();
      if(!name){ showToast('Şirket adı boş olamaz.'); return; }
      const co = getCompany(id);
      co.name = name;
      state.modal = null;
      await persistCompanies();
      showToast('Şirket güncellendi.');
      render();
      break;
    }
    case 'confirmDeleteCompany': {
      const id = el.getAttribute('data-id');
      state.companies = state.companies.filter(c=>c.id!==id);
      delete state.partsByCompany[id];
      if(state.selectedCompanyId===id) state.selectedCompanyId = state.companies[0]?.id || null;
      state.modal = null;
      await persistCompanies();
      await storageDelete('parts:'+id);
      showToast('Şirket silindi.');
      render();
      break;
    }

    case 'openAddPart': state.modal = {type:'addPart'}; render(); break;
    case 'saveAddPart': {
      const company = getCompany(state.selectedCompanyId);
      const partNo = document.getElementById('partNoInput').value.trim();
      const partName = document.getElementById('partNameInput').value.trim();
      const qty = Number(document.getElementById('partQtyInput').value) || 0;
      const colorVal = document.getElementById('partColorInput') ? document.getElementById('partColorInput').value.trim() : '';
      if(!partNo){ showToast('Parça no zorunludur.'); return; }
      const parts = getParts(company.id);
      const existing = parts.find(p=>p.partNo.toLowerCase()===partNo.toLowerCase());
      let newPartId = null;
      if(existing){
        existing.partName = partName;
        existing.orderedQty = qty;
        existing.color = colorVal;
        existing.lastUpdate = todayStr();
        existing.updatedBy = state.currentUser;
        newPartId = existing.id;
      } else {
        newPartId = uid('pt');
        parts.push({id: newPartId, partNo, partName, orderedQty: qty, color: colorVal, qtys:{}, rejects:{}, note:'', drawing:null, measurements:[], lastUpdate: todayStr(), updatedBy: state.currentUser, history:[], ncrs:[]});
      }
      state.partsByCompany[company.id] = parts;
      state.modal = null;
      state.selectedPartId = newPartId;
      await persistParts(company.id);
      showToast('Parça kaydedildi.');
      render();
      break;
    }
    case 'saveEditPart': {
      const company = getCompany(state.selectedCompanyId);
      const id = el.getAttribute('data-id');
      const part = getParts(company.id).find(p=>p.id===id);
      part.partName = document.getElementById('partNameInput').value.trim();
      part.orderedQty = Number(document.getElementById('partQtyInput').value) || 0;
      part.color = document.getElementById('partColorInput') ? document.getElementById('partColorInput').value.trim() : (part.color||'');
      part.lastUpdate = todayStr();
      part.updatedBy = state.currentUser;
      state.modal = null;
      await persistParts(company.id);
      showToast('Parça güncellendi.');
      render();
      break;
    }
    case 'confirmDeletePart': {
      const company = getCompany(state.selectedCompanyId);
      const id = el.getAttribute('data-id');
      state.partsByCompany[company.id] = getParts(company.id).filter(p=>p.id!==id);
      state.modal = null;
      await persistParts(company.id);
      showToast('Parça silindi.');
      render();
      break;
    }

    case 'openStages': state.modal = {type:'stages'}; render(); break;
    case 'addStage': {
      const company = getCompany(state.selectedCompanyId);
      const input = document.getElementById('newStageInput');
      const val = input.value.trim();
      if(!val){ return; }
      if(company.stages.some(s=>s.toLowerCase()===val.toLowerCase())){ showToast('Bu aşama zaten mevcut.'); return; }
      company.stages.push(val);
      await persistCompanies();
      render();
      state.modal = {type:'stages'};
      render();
      break;
    }

    case 'openImport': state.importPreview = null; state.modal = {type:'import'}; render(); break;
    case 'openBulkDrawings': state.bulkDrawingPreview = null; state.modal = {type:'bulkDrawings'}; render(); break;
    case 'cancelBulkDrawings': state.bulkDrawingPreview = null; render(); break;
    case 'confirmBulkDrawings': await confirmBulkDrawings(); break;
    case 'cancelImportPreview': state.importPreview = null; render(); break;
    case 'confirmImport': {
      const company = getCompany(state.selectedCompanyId);
      const parts = getParts(company.id);
      let added=0, updated=0;
      state.importPreview.rows.forEach(r=>{
        const existing = parts.find(p=>p.partNo.toLowerCase()===r.partNo.toLowerCase());
        if(existing){
          existing.partName = r.partName || existing.partName;
          existing.orderedQty = r.orderedQty;
          existing.lastUpdate = todayStr();
          existing.updatedBy = state.currentUser;
          updated++;
        } else {
          parts.push({id: uid('pt'), partNo:r.partNo, partName:r.partName, orderedQty:r.orderedQty, color:'', qtys:{}, rejects:{}, note:'', drawing:null, measurements:[], lastUpdate:todayStr(), updatedBy: state.currentUser, history:[], ncrs:[]});
          added++;
        }
      });
      state.partsByCompany[company.id] = parts;
      state.importPreview = null;
      state.modal = null;
      await persistParts(company.id);
      showToast(`İçe aktarıldı: ${added} yeni, ${updated} güncellendi.`);
      render();
      break;
    }

    case 'saveTracking': {
      const company = getCompany(state.selectedCompanyId);
      const partId = el.getAttribute('data-part');
      const part = getParts(company.id).find(p=>p.id===partId);
      const inputs = document.querySelectorAll('[data-stage-input]');
      const rejectInputs = document.querySelectorAll('[data-reject-input]');
      const now = todayStr();
      let changed = false;
      inputs.forEach(inp=>{
        const stage = inp.getAttribute('data-stage-input');
        if(!canEditStage(stage)) return; // yetkisiz alan — istemci tarafında da engelle
        const newVal = Math.max(0, Number(inp.value)||0);
        if(!part.qtys) part.qtys={};
        const oldVal = Number(part.qtys[stage]||0);
        if(newVal !== oldVal){
          part.qtys[stage] = newVal;
          part.history = part.history || [];
          part.history.push({date: now, stage, qty: newVal, reject:false, user: state.currentUser});
          changed = true;
        }
      });
      rejectInputs.forEach(inp=>{
        const stage = inp.getAttribute('data-reject-input');
        if(!canEditStage(stage)) return;
        const newVal = Math.max(0, Number(inp.value)||0);
        if(!part.rejects) part.rejects={};
        const oldVal = Number(part.rejects[stage]||0);
        if(newVal !== oldVal){
          part.rejects[stage] = newVal;
          part.history = part.history || [];
          part.history.push({date: now, stage, qty: newVal, reject:true, user: state.currentUser});
          changed = true;
        }
      });
      if(isAdmin()){
        const noteVal = document.getElementById('partNoteInput').value;
        if(noteVal !== (part.note||'')){ part.note = noteVal; changed = true; }
        const colorInput = document.getElementById('partColorTrackInput');
        if(colorInput){
          const colorVal = colorInput.value.trim();
          if(colorVal !== (part.color||'')){ part.color = colorVal; changed = true; }
        }
      }
      // Ölçüm kontrolü değerlerini topla (yalnızca yönetici)
      part.measurements = part.measurements || [];
      if(isAdmin()){
        document.querySelectorAll('[data-meas-value]').forEach(inp=>{
          const m = part.measurements.find(x=>x.id===inp.getAttribute('data-meas-value'));
          if(m){ const v = inp.value===''?'':Number(inp.value); if(v!==m.measuredValue){ m.measuredValue=v; changed=true; } }
        });
        document.querySelectorAll('[data-meas-nominal]').forEach(inp=>{
          const m = part.measurements.find(x=>x.id===inp.getAttribute('data-meas-nominal'));
          if(m){ const v = inp.value===''?'':Number(inp.value); if(v!==m.nominalValue){ m.nominalValue=v; changed=true; } }
        });
        document.querySelectorAll('[data-meas-tol]').forEach(inp=>{
          const m = part.measurements.find(x=>x.id===inp.getAttribute('data-meas-tol'));
          if(m){ const v = inp.value===''?'':Number(inp.value); if(v!==m.tolerance){ m.tolerance=v; changed=true; } }
        });
      }
      if(changed){ part.lastUpdate = now; part.updatedBy = state.currentUser; }
      await persistParts(company.id);
      showToast(changed ? 'Üretim verileri güncellendi.' : 'Değişiklik yok.');
      render();
      break;
    }

    case 'openNcr': state.modal = {type:'ncr', payload:{partId: el.getAttribute('data-part')}}; render(); break;
    case 'openNcrGlobal': {
      if(!state.selectedCompanyId || getParts(state.selectedCompanyId).length===0){
        showToast('Önce bir şirket seçin ve parça ekleyin.');
        return;
      }
      state.modal = {type:'ncr', payload:{partId:null}}; render(); break;
    }
    case 'saveNcr': {
      let companyId = state.selectedCompanyId;
      let partId = el.getAttribute('data-part');
      const ncrCompanySelect = document.getElementById('ncrCompanySelect');
      const ncrPartSelect = document.getElementById('ncrPartSelect');
      if(ncrCompanySelect) companyId = ncrCompanySelect.value;
      if(ncrPartSelect) partId = ncrPartSelect.value;
      if(!partId){ showToast('Parça seçilmedi.'); return; }
      const part = getParts(companyId).find(p=>p.id===partId);
      if(!part){ showToast('Parça bulunamadı.'); return; }
      const stage = document.getElementById('ncrStageSelect').value;
      const description = document.getElementById('ncrDescInput').value.trim();
      const correctiveAction = document.getElementById('ncrActionInput').value.trim();
      if(!description){ showToast('Açıklama girilmelidir.'); return; }
      part.ncrs = part.ncrs || [];
      part.ncrs.push({id: uid('ncr'), date: todayStr(), stage, description, correctiveAction, status:'acik', user: state.currentUser});
      state.modal = null;
      await persistParts(companyId);
      showToast('Uygunsuzluk kaydı açıldı.');
      render();
      break;
    }

    case 'clearSelection': state.selectedPartIds = new Set(); render(); break;
    case 'openBulkRename': state.modal = {type:'bulkRename'}; render(); break;
    case 'applyBulkRename': {
      const company = getCompany(state.selectedCompanyId);
      const parts = getParts(company.id);
      const mode = document.querySelector('input[name="bulkMode"]:checked').value;
      const findVal = (document.getElementById('bulkFindInput')||{}).value || '';
      const replaceVal = (document.getElementById('bulkReplaceInput')||{}).value || '';
      const textVal = (document.getElementById('bulkTextInput')||{}).value || '';
      if(mode==='replace' && !findVal){ showToast('"Bul" alanı boş olamaz.'); return; }
      if((mode==='prefix'||mode==='suffix') && !textVal){ showToast('Eklenecek metni girin.'); return; }
      let changedCount = 0;
      parts.forEach(p=>{
        if(!state.selectedPartIds.has(p.id)) return;
        let newName = p.partName || '';
        if(mode==='replace'){
          if(newName.toLowerCase().includes(findVal.toLowerCase())){
            const re = new RegExp(findVal.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
            newName = newName.replace(re, replaceVal);
          } else { return; }
        } else if(mode==='prefix'){
          newName = textVal + newName;
        } else if(mode==='suffix'){
          newName = newName + textVal;
        }
        if(newName !== p.partName){
          p.partName = newName;
          p.lastUpdate = todayStr();
          p.updatedBy = state.currentUser;
          changedCount++;
        }
      });
      state.modal = null;
      state.selectedPartIds = new Set();
      await persistParts(company.id);
      showToast(`${changedCount} parçanın adı güncellendi.`);
      render();
      break;
    }

    case 'addMeasurement': {
      syncTrackingFormToState();
      const company = getCompany(state.selectedCompanyId);
      const part = getParts(company.id).find(p=>p.id===el.getAttribute('data-part'));
      part.measurements = part.measurements || [];
      const nextNo = part.measurements.length + 1;
      part.measurements.push({id: uid('ms'), no: nextNo, imgX:null, imgY:null, measuredValue:'', nominalValue:'', tolerance:''});
      await persistParts(company.id);
      render();
      break;
    }
    case 'addSuggestedMeasurements': {
      syncTrackingFormToState();
      const company = getCompany(state.selectedCompanyId);
      const part = getParts(company.id).find(p=>p.id===el.getAttribute('data-part'));
      const count = Number(el.getAttribute('data-count'))||0;
      part.measurements = part.measurements || [];
      while(part.measurements.length < count){
        part.measurements.push({id: uid('ms'), no: part.measurements.length+1, imgX:null, imgY:null, measuredValue:'', nominalValue:'', tolerance:''});
      }
      await persistParts(company.id);
      render();
      break;
    }

    case 'exportAll': exportAllExcel(); break;
  }
}

/* ============================= TEKNİK RESİM YÜKLEME ============================= */
function handleDrawingUpload(file){
  const MAX_BYTES = 3 * 1024 * 1024;
  if(file.size > MAX_BYTES){
    showToast('Dosya çok büyük. En fazla 3 MB yükleyebilirsiniz.');
    return;
  }
  const reader = new FileReader();
  reader.onload = async (e)=>{
    const company = getCompany(state.selectedCompanyId);
    const part = getParts(company.id).find(p=>p.id===state.selectedPartId);
    if(!part) return;
    const prevDrawing = part.drawing;
    part.drawing = { name: file.name, type: file.type, data: e.target.result };
    render();
    const ok = await persistParts(company.id);
    if(ok===false){
      part.drawing = prevDrawing;
      showToast('Dosya kaydedilemedi — depolama sınırına yaklaşılmış olabilir.');
      render();
    } else {
      showToast('Teknik resim eklendi.');
      render();
    }
  };
  reader.onerror = ()=> showToast('Dosya okunamadı.');
  reader.readAsDataURL(file);
}

/* ============================= TOPLU TEKNİK RESİM YÜKLEME ============================= */
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function handleBulkDrawingFiles(fileList){
  const company = getCompany(state.selectedCompanyId);
  if(!company){ showToast('Önce bir şirket seçin.'); return; }
  const parts = getParts(company.id);
  const files = Array.from(fileList).filter(f=> f.type.startsWith('image/') || f.type==='application/pdf' || /\.(png|jpe?g|pdf)$/i.test(f.name));
  if(!files.length){ showToast('Uygun dosya bulunamadı (.png, .jpg, .pdf).'); return; }

  const matches = [];
  const unmatched = [];
  files.forEach(file=>{
    const nameNoExt = file.name.replace(/\.[^.\/\\]+$/, '');
    let best = null;
    parts.forEach(p=>{
      const no = (p.partNo||'').trim();
      if(!no) return;
      if(nameNoExt.toLowerCase().includes(no.toLowerCase())){
        if(!best || no.length > best.partNo.length) best = p;
      }
    });
    if(best){
      if(file.size > 3*1024*1024){
        unmatched.push({file, reason:'Dosya çok büyük (3 MB üzeri)'});
      } else {
        matches.push({file, part: best});
      }
    } else {
      unmatched.push({file, reason:'Dosya adında eşleşen parça no bulunamadı'});
    }
  });

  state.bulkDrawingPreview = {matches, unmatched};
  render();
}
async function confirmBulkDrawings(){
  const company = getCompany(state.selectedCompanyId);
  const preview = state.bulkDrawingPreview;
  if(!company || !preview) return;
  let ok = 0, fail = 0;
  for(const m of preview.matches){
    try{
      const dataUrl = await readFileAsDataURL(m.file);
      const parts = getParts(company.id);
      const livePart = parts.find(p=>p.id===m.part.id);
      if(livePart){ livePart.drawing = { name: m.file.name, type: m.file.type, data: dataUrl }; ok++; }
    }catch(e){ fail++; }
  }
  state.bulkDrawingPreview = null;
  state.modal = null;
  render();
  const saved = await persistParts(company.id);
  if(saved===false){
    showToast('Kaydedilemedi — toplam dosya boyutu depolama sınırını aşmış olabilir. Daha az dosyayla tekrar deneyin.');
  } else {
    showToast(`${ok} teknik resim eklendi${fail?`, ${fail} tanesi okunamadı`:''}.`);
  }
  render();
}

/* ============================= IMPORT (CSV/XLSX) ============================= */
function handleFileImport(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
      if(!json.length){ showToast('Dosya boş görünüyor.'); return; }
      const header = json[0].map(h=>String(h||'').toLowerCase().trim());
      // Parça No: başlıkta "parça no" / "parca no" geçiyorsa, yoksa "no" içeren ama "istenen" olmayan sütun
      let noIdx = header.findIndex(h=>h.includes('parça no') || h.includes('parca no'));
      if(noIdx===-1) noIdx = header.findIndex(h=>h.includes('no') && !h.includes('istenen'));
      // Parça Adı: başlıkta "parça ad"/"parca ad"/"isim"/"ürün ad" gibi ifadeler geçiyorsa o sütun.
      // Bulunamazsa isim sütunu YOK sayılır — adet sütunu isim alanına yazılmaz, isim boş bırakılır.
      let nameIdx = header.findIndex(h=> (h.includes('parça ad') || h.includes('parca ad') || h.includes('ürün ad') || h.includes('urun ad') || h.includes('isim') || h.includes('ad ')|| h==='ad' || h==='adı' || h==='adi') && !h.includes('istenen') && !h.includes('adet'));
      // İstenen Adet: "istenen", "adet", "miktar", "sipariş" içeren sütun.
      let qtyIdx = header.findIndex(h=>h.includes('istenen') || h.includes('adet') || h.includes('miktar') || h.includes('siparis') || h.includes('sipariş'));

      if(noIdx===-1) noIdx=0;
      if(qtyIdx===-1){
        // adet sütunu başlıktan tanınamadıysa, no ve isim dışındaki ilk sayısal sütunu adet kabul et
        const candidateIdx = [0,1,2].find(i=> i!==noIdx && i!==nameIdx);
        qtyIdx = candidateIdx!==undefined ? candidateIdx : -1;
      }

      const rows = [];
      for(let i=1;i<json.length;i++){
        const r = json[i];
        if(!r || r.every(c=>c==='' || c==null)) continue;
        const partNo = String(r[noIdx]||'').trim();
        const partName = nameIdx!==-1 ? String(r[nameIdx]||'').trim() : '';
        const orderedQty = qtyIdx!==-1 ? (Number(r[qtyIdx])||0) : 0;
        if(!partNo) continue;
        rows.push({partNo, partName, orderedQty});
      }
      if(!rows.length){ showToast('Geçerli satır bulunamadı.'); return; }
      state.importPreview = {rows, fileName: file.name};
      render();
    }catch(err){
      console.error(err);
      showToast('Dosya okunamadı. Lütfen .xlsx, .xls veya .csv formatında bir dosya seçin.');
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ============================= EXPORT (XLSX) ============================= */
function companySheetData(companyId){
  const company = getCompany(companyId);
  const stages = company.stages;
  const parts = getParts(companyId);
  return parts.map(p=>{
    const curIdx = getCurrentStageIndex(p, stages);
    const remaining = partRemaining(p, stages);
    const curStage = curIdx>=0 && remaining>0 ? stages[curIdx] : (remaining===0 && p.orderedQty>0 ? 'Sevk Edildi' : '');
    const row = {'Parça No': p.partNo, 'Parça Adı': p.partName, 'Mevcut Aşama': curStage, 'İstenen Adet': p.orderedQty, 'Malzeme Rengi': p.color || ''};
    stages.forEach(s=>{ row[s] = Number((p.qtys||{})[s]||0); row[s+' (Ret)'] = Number((p.rejects||{})[s]||0); });
    row['Toplam Ret'] = partTotalReject(p);
    row['Kalan Adet'] = remaining;
    row['Not'] = p.note || '';
    row['Son Güncelleme'] = p.lastUpdate || '';
    row['Güncelleyen'] = p.updatedBy || '';
    return row;
  });
}
function ncrSheetData(){
  const rows = [];
  state.companies.forEach(c=>{
    getParts(c.id).forEach(p=>{
      (p.ncrs||[]).forEach(n=>{
        rows.push({
          'Şirket': c.name, 'Parça No': p.partNo, 'Parça Adı': p.partName, 'Aşama': n.stage,
          'Tarih': n.date, 'Açıklama': n.description, 'Düzeltici Faaliyet': n.correctiveAction || '',
          'Durum': n.status==='acik' ? 'Açık' : 'Kapatıldı', 'Kaydeden': n.user,
          'Kapatma Tarihi': n.closedDate || '', 'Kapatan': n.closedBy || ''
        });
      });
    });
  });
  return rows;
}
function exportCompanyExcel(companyId){
  const company = getCompany(companyId);
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(companySheetData(companyId));
  XLSX.utils.book_append_sheet(wb, ws, company.name.substring(0,31) || 'Sirket');
  const companyNcrRows = ncrSheetData().filter(r=>r['Şirket']===company.name);
  if(companyNcrRows.length){
    const wsNcr = XLSX.utils.json_to_sheet(companyNcrRows);
    XLSX.utils.book_append_sheet(wb, wsNcr, 'Kalite Kayitlari');
  }
  XLSX.writeFile(wb, `${company.name.replace(/[^a-z0-9ığüşöçİĞÜŞÖÇ_\- ]/gi,'_')}_uretim_raporu.xlsx`);
  showToast('Excel raporu indirildi.');
}
function exportAllExcel(){
  const wb = XLSX.utils.book_new();
  state.companies.forEach(c=>{
    const ws = XLSX.utils.json_to_sheet(companySheetData(c.id));
    let sheetName = c.name.substring(0,31) || 'Sirket';
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });
  const ncrRows = ncrSheetData();
  if(ncrRows.length){
    const wsNcr = XLSX.utils.json_to_sheet(ncrRows);
    XLSX.utils.book_append_sheet(wb, wsNcr, 'Kalite Kayitlari');
  }
  if(state.companies.length===0){ showToast('Aktarılacak veri yok.'); return; }
  XLSX.writeFile(wb, 'tum_sirketler_uretim_raporu.xlsx');
  showToast('Birleşik Excel raporu indirildi.');
}

/* ============================= INIT ============================= */
fbAuth.onAuthStateChanged(async (user)=>{
  state.authChecking = false;
  if(user){
    try{
      const token = await user.getIdToken();
      const res = await fetch(`${FIREBASE_URL}/users/${user.uid}.json?auth=${token}`);
      const profile = await res.json();
      state.currentUser = (profile && profile.name) || user.displayName || user.email;
      state.currentUserUid = user.uid;
      state.currentUserRole = (profile && profile.role) || null;
      render();
      await loadAll();
    }catch(e){
      console.error('Oturum bilgisi okunamadı', e);
      state.currentUser = null;
      render();
    }
  } else {
    state.currentUser = null;
    state.currentUserUid = null;
    state.currentUserRole = null;
    render();
  }
});
