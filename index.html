async function restoreTrashEntries(ids){
  const idSet = new Set(ids);
  const toRestore = (state.drawingTrash||[]).filter(t=>idSet.has(t.id));
  const companiesTouched = new Set();
  for(const t of toRestore){
    const part = getParts(t.companyId).find(p=>p.id===t.partId);
    if(part){
      if(!Array.isArray(part.drawings)) part.drawings = [];
      part.drawings.push(t.drawing);
      companiesTouched.add(t.companyId);
    }
  }
  state.drawingTrash = (state.drawingTrash||[]).filter(t=>!idSet.has(t.id));
  for(const companyId of companiesTouched){ await persistParts(companyId); }
  await persistDrawingTrash();
  showToast(`${toRestore.length} teknik resim geri yüklendi.`);
}

/* ============================= TEKNİK RESİM YÜKLEME ============================= */
async function handleDrawingUpload(fileList){
  const files = Array.from(fileList);
  const MAX_BYTES = 3 * 1024 * 1024;
  const company = getCompany(state.selectedCompanyId);
  const part = getParts(company.id).find(p=>p.id===state.selectedPartId);
  if(!part) return;
  if(!Array.isArray(part.drawings)) part.drawings = [];
  const prevDrawings = part.drawings.slice();
  let added = 0, tooBig = 0;
  for(const file of files){
    if(file.size > MAX_BYTES){ tooBig++; continue; }
    try{
      const dataUrl = await readFileAsDataURL(file);
      part.drawings.push({ name: file.name, type: file.type, data: dataUrl });
      added++;
    }catch(e){ /* atla */ }
  }
  render();
  if(added>0){
    const ok = await persistParts(company.id);
    if(ok===false){
      part.drawings = prevDrawings;
      showToast('Dosyalar kaydedilemedi — depolama sınırına yaklaşılmış olabilir.');
      render();
      return;
    }
  }
  showToast(`${added} teknik resim eklendi${tooBig?`, ${tooBig} dosya 3 MB sınırını aştığı için atlandı`:''}.`);
  render();
}

/* ============================= TOPLU TEKNİK RESİM YÜKLEME ============================= */
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function findMatchingPart(file, parts){
  const relPath = file.webkitRelativePath || '';
  const pathParts = relPath.split('/').filter(Boolean);
  const nameNoExt = file.name.replace(/\.[^.\/\\]+$/, '');

  // 1) Klasör yapısı varsa: dosyanın bulunduğu klasörün adı parça no'suyla TAM eşleşiyor mu (en güvenilir yöntem)
  if(pathParts.length >= 2){
    const folderName = pathParts[pathParts.length-2].trim().toLowerCase();
    const exact = parts.find(p=> (p.partNo||'').trim().toLowerCase() === folderName);
    if(exact) return exact;
  }
  // 2) Klasör adının İÇİNDE parça no geçiyor mu (klasör ismi ekstra açıklama içeriyor olabilir)
  if(pathParts.length >= 2){
    const folderName = pathParts[pathParts.length-2].toLowerCase();
    let best = null;
    parts.forEach(p=>{
      const no = (p.partNo||'').trim();
      if(!no) return;
      if(folderName.includes(no.toLowerCase())){
        if(!best || no.length > best.partNo.length) best = p;
      }
    });
    if(best) return best;
  }
  // 3) Klasör yoksa veya eşleşmediyse: dosya adının içinde parça no geçiyor mu (eski yöntem, yedek olarak)
  let best = null;
  parts.forEach(p=>{
    const no = (p.partNo||'').trim();
    if(!no) return;
    if(nameNoExt.toLowerCase().includes(no.toLowerCase())){
      if(!best || no.length > best.partNo.length) best = p;
    }
  });
  return best;
}
function handleBulkDrawingFiles(fileList){
  const company = getCompany(state.selectedCompanyId);
  if(!company){ showToast('Önce bir şirket seçin.'); return; }
  const parts = getMonthParts(company.id, activeMonthKey(company.id));
  const files = Array.from(fileList).filter(f=> f.type.startsWith('image/') || f.type==='application/pdf' || /\.(png|jpe?g|pdf)$/i.test(f.name));
  if(!files.length){ showToast('Uygun dosya bulunamadı (.png, .jpg, .pdf).'); return; }

  const matches = [];
  const unmatched = [];
  files.forEach(file=>{
    const best = findMatchingPart(file, parts);
    if(best){
      if(file.size > 3*1024*1024){
        unmatched.push({file, reason:'Dosya çok büyük (3 MB üzeri)'});
      } else {
        matches.push({file, part: best});
      }
    } else {
      unmatched.push({file, reason:'Ne klasör adında ne dosya adında eşleşen parça no bulundu'});
    }
  });

  state.bulkDrawingPreview = {matches, unmatched};
  render();
}
async function confirmBulkDrawings(){
  const company = getCompany(state.selectedCompanyId);
  const preview = state.bulkDrawingPreview;
  if(!company || !preview) return;
  let ok = 0, fail = 0;
  for(const m of preview.matches){
    try{
      const dataUrl = await readFileAsDataURL(m.file);
      const parts = getParts(company.id);
      const livePart = parts.find(p=>p.id===m.part.id);
      if(livePart){
        if(!Array.isArray(livePart.drawings)) livePart.drawings = [];
        livePart.drawings.push({ name: m.file.name, type: m.file.type, data: dataUrl });
        ok++;
      }
    }catch(e){ fail++; }
  }
  state.bulkDrawingPreview = null;
  state.modal = null;
  render();
  const saved = await persistParts(company.id);
  if(saved===false){
    showToast('Kaydedilemedi — toplam dosya boyutu depolama sınırını aşmış olabilir. Daha az dosyayla tekrar deneyin.');
  } else {
    showToast(`${ok} teknik resim eklendi${fail?`, ${fail} tanesi okunamadı`:''}.`);
  }
  render();
}

/* ============================= IMPORT (CSV/XLSX) ============================= */
function handleFileImport(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
      if(!json.length){ showToast('Dosya boş görünüyor.'); return; }
      const header = json[0].map(h=>String(h||'').toLowerCase().trim());
      // Parça No: başlıkta "parça no" / "parca no" geçiyorsa, yoksa "no" içeren ama "istenen" olmayan sütun
      let noIdx = header.findIndex(h=>h.includes('parça no') || h.includes('parca no'));
      if(noIdx===-1) noIdx = header.findIndex(h=>h.includes('no') && !h.includes('istenen'));
      // Parça Adı: başlıkta "parça ad"/"parca ad"/"isim"/"ürün ad" gibi ifadeler geçiyorsa o sütun.
      // Bulunamazsa isim sütunu YOK sayılır — adet sütunu isim alanına yazılmaz, isim boş bırakılır.
      let nameIdx = header.findIndex(h=> (h.includes('parça ad') || h.includes('parca ad') || h.includes('ürün ad') || h.includes('urun ad') || h.includes('isim') || h.includes('ad ')|| h==='ad' || h==='adı' || h==='adi') && !h.includes('istenen') && !h.includes('adet'));
      // İstenen Adet: "istenen", "adet", "miktar", "sipariş" içeren sütun.
      let qtyIdx = header.findIndex(h=>h.includes('istenen') || h.includes('adet') || h.includes('miktar') || h.includes('siparis') || h.includes('sipariş'));

      if(noIdx===-1) noIdx=0;
      if(qtyIdx===-1){
        // adet sütunu başlıktan tanınamadıysa, no ve isim dışındaki ilk sayısal sütunu adet kabul et
        const candidateIdx = [0,1,2].find(i=> i!==noIdx && i!==nameIdx);
        qtyIdx = candidateIdx!==undefined ? candidateIdx : -1;
      }

      const rows = [];
      for(let i=1;i<json.length;i++){
        const r = json[i];
        if(!r || r.every(c=>c==='' || c==null)) continue;
        const partNo = String(r[noIdx]||'').trim();
        const partName = nameIdx!==-1 ? String(r[nameIdx]||'').trim() : '';
        const orderedQty = qtyIdx!==-1 ? (Number(r[qtyIdx])||0) : 0;
        if(!partNo) continue;
        rows.push({partNo, partName, orderedQty});
      }
      if(!rows.length){ showToast('Geçerli satır bulunamadı.'); return; }
      state.importPreview = {rows, fileName: file.name};
      render();
    }catch(err){
      console.error(err);
      showToast('Dosya okunamadı. Lütfen .xlsx, .xls veya .csv formatında bir dosya seçin.');
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ============================= EXPORT (XLSX) ============================= */
function companySheetData(companyId){
  const company = getCompany(companyId);
  const stages = company.stages;
  const parts = getParts(companyId);
  return parts.map(p=>{
    const curIdx = getCurrentStageIndex(p, stages);
    const remaining = partRemaining(p, stages);
    const curStage = curIdx>=0 && remaining>0 ? stages[curIdx] : (remaining===0 && p.orderedQty>0 ? 'Sevk Edildi' : '');
    const row = {'Sipariş Ayı': monthLabel(inferPartMonth(p)), 'Parça No': p.partNo, 'Parça Adı': p.partName, 'Mevcut Aşama': curStage, 'İstenen Adet': p.orderedQty, 'Malzeme Rengi': p.color || ''};
    stages.forEach(s=>{ row[s] = Number((p.qtys||{})[s]||0); row[s+' (Ret)'] = Number((p.rejects||{})[s]||0); });
    row['Toplam Ret'] = partTotalReject(p);
    row['Kalan Adet'] = remaining;
    row['Not'] = p.note || '';
    row['Son Güncelleme'] = p.lastUpdate || '';
    row['Güncelleyen'] = p.updatedBy || '';
    row['Teknik Resim Sayısı'] = (p.drawings||[]).length;
    return row;
  });
}
function ncrSheetData(){
  const rows = [];
  visibleCompanies().forEach(c=>{
    getParts(c.id).forEach(p=>{
      (p.ncrs||[]).forEach(n=>{
        rows.push({
          'Şirket': c.name, 'Parça No': p.partNo, 'Parça Adı': p.partName, 'Aşama': n.stage,
          'Tarih': n.date, 'Kayıt Türü': n.recordType || 'Kalite Uygunsuzluğu', 'Uygunsuzluk Türü': n.category || '',
          'Etkilenen Adet': Number(n.qty)||0, 'Açıklama': n.description, 'Kök Neden': n.rootCause || '',
          'Karar / Disposition': n.disposition || '', 'Düzeltici Faaliyet': n.correctiveAction || '',
          'Kaynak': n.autoCreated ? 'Otomatik' : 'Manuel',
          'Durum': n.status==='acik' ? 'Açık' : 'Kapatıldı', 'Kaydeden': n.user,
          'Kapatma Tarihi': n.closedDate || '', 'Kapatan': n.closedBy || ''
        });
      });
    });
  });
  return rows;
}

function qualityEventSheetData(companyId){
  const rows=[];
  visibleCompanies().filter(c=>!companyId||c.id===companyId).forEach(c=>{
    getParts(c.id).forEach(p=>{
      (p.qualityEvents||[]).forEach(e=>{
        const meta=QUALITY_EVENT_META[e.type]||{label:e.type};
        rows.push({'Tarih':e.date,'Şirket':c.name,'Sipariş Ayı':monthLabel(inferPartMonth(p)),'Parça No':p.partNo,'Parça Adı':p.partName,'Kayıt Türü':meta.label,'Adet':Number(e.qty)||0,'Proses':e.stage||'','Sebep':e.reason||'','Not':e.note||'','Kaydeden':e.user||''});
      });
    });
  });
  return rows;
}
function productionIssueSheetData(companyId){
  const rows=[];
  visibleCompanies().filter(c=>!companyId||c.id===companyId).forEach(c=>{
    getParts(c.id).forEach(p=>{
      (p.productionIssues||[]).forEach(i=>rows.push({'Tarih':i.date,'Şirket':c.name,'Sipariş Ayı':monthLabel(inferPartMonth(p)),'Parça No':p.partNo,'Parça Adı':p.partName,'Proses':i.stage||'','Problem Türü':i.type||'','Etkilenen Adet':Number(i.qty)||0,'Açıklama':i.description||'','Durum':i.status==='kapali'?'Kapatıldı':'Açık','Kaydeden':i.user||'','Kapanış':i.closedAt||''}));
    });
  });
  return rows;
}
function processEstimateSheetData(companyId){
  const rows=[];
  visibleCompanies().filter(c=>!companyId||c.id===companyId).forEach(c=>{
    getParts(c.id).forEach(p=>{
      const prof=processProfile(p);
      c.stages.filter(s=>s!=='Sevkiyat').forEach(stage=>{
        rows.push({'Şirket':c.name,'Sipariş Ayı':monthLabel(inferPartMonth(p)),'Parça No':p.partNo,'Parça Adı':p.partName,'Sipariş Adedi':p.orderedQty,'Proses':stage,'Tahmini Gün':Number(estimateStageDays(p,stage).toFixed(2)),'Malzeme':prof.material||'','Kalınlık mm':prof.thickness||'','En mm':prof.width||'','Boy mm':prof.length||'','Delik':prof.holeCount||0,'Büküm':prof.bendCount||0,'Kaynak mm':prof.weldLengthMm||0,'Karmaşıklık':prof.complexity||'normal','Tolerans':prof.toleranceClass||'normal'});
      });
    });
  });
  return rows;
}

function returnSheetData(companyId){
  const rows=[];
  visibleCompanies().filter(c=>!companyId || c.id===companyId).forEach(c=>{
    getParts(c.id).forEach(p=>{
      (p.returnEvents||[]).forEach(r=>rows.push({
        'Tarih':r.date,'Şirket':c.name,'Sipariş Ayı':monthLabel(inferPartMonth(p)),'Parça No':p.partNo,'Parça Adı':p.partName,
        'Geri Dönülen Proses':r.toStage,'Önceki Proses':r.fromStage,'Adet':r.qty,'Kaydeden':r.user||'','Not':r.note||''
      }));
    });
  });
  return rows;
}
function exportCompanyExcel(companyId){
  const company = getCompany(companyId);
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(companySheetData(companyId));
  XLSX.utils.book_append_sheet(wb, ws, company.name.substring(0,31) || 'Sirket');
  const companyNcrRows = ncrSheetData().filter(r=>r['Şirket']===company.name);
  if(companyNcrRows.length){
    const wsNcr = XLSX.utils.json_to_sheet(companyNcrRows);
    XLSX.utils.book_append_sheet(wb, wsNcr, 'Kalite Kayitlari');
  }
  const returns=returnSheetData(companyId);
  if(returns.length){ XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(returns),'Proses Geri Donusleri'); }
  const qevents=qualityEventSheetData(companyId);
  if(qevents.length){ XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(qevents),'Kalite Adet Kararlari'); }
  const issues=productionIssueSheetData(companyId);
  if(issues.length){ XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(issues),'Uretim Problemleri'); }
  const estimates=processEstimateSheetData(companyId);
  if(estimates.length){ XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(estimates),'Proses Tahminleri'); }
  XLSX.writeFile(wb, `${company.name.replace(/[^a-z0-9ığüşöçİĞÜŞÖÇ_\- ]/gi,'_')}_uretim_raporu.xlsx`);
  showToast('Excel raporu indirildi.');
}
function exportAllExcel(){
  const wb = XLSX.utils.book_new();
  const vc = visibleCompanies();
  vc.forEach(c=>{
    const ws = XLSX.utils.json_to_sheet(companySheetData(c.id));
    let sheetName = c.name.substring(0,31) || 'Sirket';
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });
  const ncrRows = ncrSheetData();
  if(ncrRows.length){
    const wsNcr = XLSX.utils.json_to_sheet(ncrRows);
    XLSX.utils.book_append_sheet(wb, wsNcr, 'Kalite Kayitlari');
  }
  const returns=returnSheetData();
  if(returns.length){ XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(returns),'Proses Geri Donusleri'); }
  const qevents=qualityEventSheetData();
  if(qevents.length){ XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(qevents),'Kalite Adet Kararlari'); }
  const issues=productionIssueSheetData();
  if(issues.length){ XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(issues),'Uretim Problemleri'); }
  const estimates=processEstimateSheetData();
  if(estimates.length){ XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(estimates),'Proses Tahminleri'); }
  if(vc.length===0){ showToast('Aktarılacak veri yok.'); return; }
  XLSX.writeFile(wb, 'tum_sirketler_uretim_raporu.xlsx');
  showToast('Birleşik Excel raporu indirildi.');
}

fbAuth.onAuthStateChanged(async (user)=>{
  state.authChecking=false;
  if(user){
    try{
      const profile=await storageGet('users/'+user.uid);
      if(!profile || !profile.role){
        state.currentUser=null; state.currentUserUid=user.uid; state.currentUserRole=null; state.clientCompanyId=null; state.authView='login';
        render(); return;
      }
      state.currentUser=profile.name||user.displayName||user.email;
      state.currentUserUid=user.uid; state.currentUserRole=profile.role; state.clientCompanyId=profile.companyId||null;
      render(); loadLocalPrefs(); await loadAll(); checkAndNotify();
    }catch(e){ console.error('Oturum bilgisi okunamadı',e); state.currentUser=null; render(); }
  }else{
    state.currentUser=null; state.currentUserUid=null; state.currentUserRole=null; state.clientCompanyId=null; render();
  }
});
